name: AAU Real RabbitMQ In-Flight Restart Integrity

on:
  push:
    branches: [experiment/recursive-tree-nemotron-v0]
    paths:
      - 'experiments/recursion-tree-v0/pg-rabbit-inflight-restart.mjs'
      - 'experiments/recursion-tree-v0/pg-rabbit-worker.mjs'
      - '.github/workflows/experimental-rabbit-inflight-restart.yml'
  pull_request:
    branches: [main]
    paths:
      - 'experiments/recursion-tree-v0/pg-rabbit-inflight-restart.mjs'
      - 'experiments/recursion-tree-v0/pg-rabbit-worker.mjs'
      - '.github/workflows/experimental-rabbit-inflight-restart.yml'

permissions:
  contents: read

jobs:
  in-flight-redelivery:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: recursion
          POSTGRES_PASSWORD: recursion
          POSTGRES_DB: recursion_lab
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U recursion -d recursion_lab"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
      rabbitmq:
        image: rabbitmq:3.13-alpine
        env:
          RABBITMQ_DEFAULT_USER: aau_ci
          RABBITMQ_DEFAULT_PASS: aau_ci
        ports: ['5672:5672']
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 25
    env:
      AAU_DISPOSABLE_CI_DB: 'yes'
      TEST_PG_URL: postgres://recursion:recursion@127.0.0.1:5432/recursion_lab
      TEST_RABBIT_URL: amqp://aau_ci:aau_ci@127.0.0.1:5672
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated SQL and broker drivers
        run: npm install --prefix experiments/recursion-tree-v0 --no-save --ignore-scripts --no-audit --no-fund pg@8.16.3 amqplib@0.10.9
      - name: Validate code and resolve disposable RabbitMQ container identity
        run: |
          set -euo pipefail
          node --check experiments/recursion-tree-v0/pg-rabbit-inflight-restart.mjs
          node --check experiments/recursion-tree-v0/pg-rabbit-worker.mjs
          rabbit="$(docker ps --filter 'ancestor=rabbitmq:3.13-alpine' --format '{{.ID}}' | head -n 1)"
          test -n "$rabbit"
          echo "AAU_RABBIT_CONTAINER=$rabbit" >> "$GITHUB_ENV"
      - name: Restart RabbitMQ with two in-flight unacknowledged persistent deliveries
        working-directory: experiments/recursion-tree-v0
        run: node pg-rabbit-inflight-restart.mjs
      - name: Upload in-flight broker failure and recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aau-inflight-broker-restart-evidence
          path: experiments/recursion-tree-v0/pg-rabbit-inflight-report.json
          if-no-files-found: ignore
