name: Patch safe GitHub error details
on:
  push:
    paths:
      - '.github/workflows/patch-safe-github-error-details.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch broker GitHub error logging
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('workers/broker-bridge-render.js')
          lines = p.read_text().splitlines()
          out = []
          in_github = False
          patched = False

          inject = [
              "    const safeGithubError = {",
              "      status: error.status || null,",
              "      message: error.details?.message || null,",
              "      documentation_url: error.details?.documentation_url || null,",
              "      errors: Array.isArray(error.details?.errors)",
              "        ? error.details.errors.slice(0, 5).map((item) => ({",
              "            resource: item?.resource || null,",
              "            field: item?.field || null,",
              "            code: item?.code || null,",
              "            message: item?.message || null,",
              "          }))",
              "        : null,",
              "    };",
              "    console.log('AAU_GITHUB_ERROR', JSON.stringify(safeGithubError));",
              "    const safeMessage = [String(error.message || error), safeGithubError.message].filter(Boolean).join(': ');",
          ]

          for line in lines:
              if line.startswith('async function runGithub(job) {'):
                  in_github = True

              if in_github and line == '  } catch (error) {':
                  out.append(line)
                  out.extend(inject)
                  patched = True
                  continue

              if in_github and line.strip() == 'p_error_message: String(error.message || error),':
                  out.append('      p_error_message: safeMessage,')
                  continue

              if in_github and line.strip() == 'p_partial_result: partial,':
                  out.append('      p_partial_result: { ...partial, github_error: safeGithubError },')
                  continue

              if in_github and line.strip() == 'return { ok: false, retryable: Boolean(error.retryable), reason: String(error.message || error) };':
                  out.append('    return { ok: false, retryable: Boolean(error.retryable), reason: safeMessage };')
                  continue

              if in_github and line.startswith('async function vc(path'):
                  in_github = False

              out.append(line)

          if not patched:
              raise SystemExit('github catch block not found')

          p.write_text('\n'.join(out) + '\n')
          PY
      - name: Validate syntax
        run: node --check workers/broker-bridge-render.js
      - name: Commit patch
        run: |
          git config user.name "AAU Infrastructure Bot"
          git config user.email "aau-infra@users.noreply.github.com"
          git add workers/broker-bridge-render.js
          git commit -m "fix: log sanitized GitHub API error details"
          git push
