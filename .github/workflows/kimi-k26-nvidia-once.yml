name: AAU Kimi K2.6 NVIDIA Think-Off Once

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/kimi-k26-nvidia-once.yml'

permissions:
  contents: read

jobs:
  kimi-instant:
    if: github.head_ref == 'experiment/recursive-tree-nemotron-v0'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Syntax and deterministic authenticator
        working-directory: experiments/recursion-tree-v0
        run: |
          set -euo pipefail
          test -n "${NVIDIA_API_KEY:-}" || { echo "NVIDIA_KEY_MISSING"; exit 3; }
          node --check live-nvidia-kimi-k26-thinking-off.mjs
          node --test synthesis-slots.test.mjs
      - name: Test Kimi K2.6 with thinking disabled on live ten-level tree
        working-directory: experiments/recursion-tree-v0
        run: node live-nvidia-kimi-k26-thinking-off.mjs
      - name: Save exact model replies, errors, tree and synthesis proofs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aau-kimi-k26-thinking-off-evidence
          path: experiments/recursion-tree-v0/recursion-live-nvidia-kimi-k26-thinking-off-report.json
          if-no-files-found: ignore
