name: AAU Serial Scheduler Optimization V8

on:
  pull_request:
    types: [opened]
    branches:
      - experiment/deterministic-scheduler-v7
    paths:
      - 'experiments/scheduler-optimization-v8/**'
      - '.github/workflows/scheduler-optimization-v8.yml'

permissions:
  contents: read

concurrency:
  group: aau-serial-logistics-model-slot
  cancel-in-progress: false

jobs:
  isolated-optimization-single-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 23
    env:
      AAU_V8_LIVE: 'yes'
      MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Mandatory independent optimizer and scheduling preflight
        run: |
          node --check experiments/scheduler-optimization-v8/optimizer.mjs
          node --check experiments/scheduler-optimization-v8/live.mjs
          node --test experiments/scheduler-optimization-v8/optimizer.test.mjs
          node --test experiments/deterministic-scheduler-v7/kernel.test.mjs
      - name: Serial Kimi assignments then independently graded deterministic cost optimization
        working-directory: experiments/scheduler-optimization-v8
        run: node live.mjs
      - name: Save model-specific improvements and deterministic optimizer ledger
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aau-serial-scheduler-optimization-v8-evidence
          path: experiments/scheduler-optimization-v8/optimization-v8-evidence.json
          if-no-files-found: warn
