name: AAU Kimi Unfamiliar Failure Generalization One Shot
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/kimi-unfamiliar-failures-once.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: aau-kimi-unfamiliar-failures-one-shot
  cancel-in-progress: false
jobs:
  blind-fault-diagnosis:
    if: github.head_ref == 'experiment/recursive-tree-nemotron-v0'
    runs-on: ubuntu-latest
    timeout-minutes: 28
    env:
      MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
      AAU_PYTHON_SANDBOX: 'yes'
      AAU_UNFAMILIAR_REAL_KIMI: 'yes'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Retrieve original real Kimi mathematical and routing code
        uses: actions/download-artifact@v4
        with:
          name: aau-kimi-unseen-python-cognition-audit
          run-id: 38994095805
          repository: booleanlambda/agent-control-room
          github-token: ${{ github.token }}
          path: experiments/recursion-tree-v0
      - name: Retrieve Kimi-authored repaired assignment solver
        uses: actions/download-artifact@v4
        with:
          name: aau-kimi-direct-traceback-real-repair-evidence
          run-id: 39038175797
          repository: booleanlambda/agent-control-room
          github-token: ${{ github.token }}
          path: experiments/recursion-tree-v0/prior-v5
      - name: Strict original source hashes, no hidden solution leakage and genuine Docker setup
        run: |
          set -euo pipefail
          test -n "${MOONSHOT_API_KEY:-}" || { echo 'MOONSHOT_API_KEY_MISSING'; exit 3; }
          node --check experiments/recursion-tree-v0/unfamiliar-fault-cases.mjs
          node --check experiments/recursion-tree-v0/unfamiliar-fault-live.mjs
          node --test experiments/recursion-tree-v0/unseen-python-benchmarks.test.mjs
          docker pull python:3.12-alpine
      - name: Real Kimi K2.6 diagnoses three hidden-location injected faults, writes complete repairs, independently graded
        working-directory: experiments/recursion-tree-v0
        run: node unfamiliar-fault-live.mjs live
      - name: Preserve all real model-generated repairs, hidden grades, provider usage and failed cases
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aau-kimi-unfamiliar-three-faults-live-evidence
          path: experiments/recursion-tree-v0/unfamiliar-fault-live-results.json
          if-no-files-found: ignore
