name: AAU Moonshot Kimi 2.5 No-Thinking Ten-Deep One Shot

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/moonshot-k25-no-thinking-once.yml'

permissions:
  contents: read

jobs:
  kimi-instant-recursion:
    if: github.head_ref == 'experiment/recursive-tree-nemotron-v0'
    runs-on: ubuntu-latest
    timeout-minutes: 13
    env:
      MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
      MOONSHOT_APIKEY: ${{ secrets.MOONSHOT_APIKEY }}
      MOONSHOT_ID: ${{ secrets.MOONSHOT_ID }}
      MOONSHOT_ENDPOINT: ${{ secrets.MOONSHOT_ENDPOINT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and invariant checks
        working-directory: experiments/recursion-tree-v0
        run: |
          node --check moonshot-k25-probe.mjs
          node --check live-kimi-thinking-off.mjs
          node --test synthesis-slots.test.mjs
      - name: Verify Kimi K2.5 instant API access without printing secrets
        working-directory: experiments/recursion-tree-v0
        run: node moonshot-k25-probe.mjs
      - name: Live Kimi no-thinking ten-level recursion and authenticated synthesis
        working-directory: experiments/recursion-tree-v0
        run: node live-kimi-thinking-off.mjs
      - name: Preserve model decisions and all verifier evidence even if rejected
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aau-moonshot-k25-thinking-off-depth10
          path: experiments/recursion-tree-v0/recursion-live-kimi-k25-thinking-off-report.json
          if-no-files-found: ignore
