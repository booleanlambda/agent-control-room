name: AAU One-time Nemotron Live Recursion Campaign

on:
  push:
    branches: [experiment/recursive-tree-nemotron-v0]
    paths:
      - '.github/workflows/nemotron-live-campaign-once.yml'

permissions:
  contents: read

jobs:
  live-small-tree:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Strict live stage-one model trial
        working-directory: experiments/recursion-tree-v0
        run: |
          set -euo pipefail
          test -n "${NVIDIA_API_KEY:-}" || { echo "NVIDIA_GITHUB_SECRET_MISSING"; exit 1; }
          node --check run.mjs
          node --check live-depth10.mjs
          node run.mjs --mode=live --stage=1
      - name: Upload real stage-one decisions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aau-live-stage1-campaign
          path: experiments/recursion-tree-v0/recursion-tree-live-stage1.json
          if-no-files-found: ignore

  live-ten-nested-splits:
    needs: live-small-tree
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Real ten nested splits plus model-authored parent synthesis
        working-directory: experiments/recursion-tree-v0
        run: |
          set -euo pipefail
          test -n "${NVIDIA_API_KEY:-}" || { echo "NVIDIA_GITHUB_SECRET_MISSING"; exit 1; }
          node --check live-depth10.mjs
          node live-depth10.mjs
      - name: Upload real depth-ten node and synthesis audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aau-live-depth10-campaign
          path: experiments/recursion-tree-v0/recursion-live-depth10-report.json
          if-no-files-found: ignore
