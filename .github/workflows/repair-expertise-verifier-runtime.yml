name: Repair Zero-Child Runtime

on:
  push:
    branches: [fix/zero-child-runtime]
    paths:
      - '.github/workflows/repair-expertise-verifier-runtime.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Patch terminal synthesis routing
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          controls=Path('workers/semantic-runtime-controls.js')
          s=controls.read_text()
          fn="""export function runtimeOwnedTerminalSynthesisChild(candidate){
            const requirement=String(candidate?.requirement??'')
              .toLowerCase()
              .replace(/[^a-z0-9\\s]/g,' ')
              .replace(/\\s+/g,' ')
              .trim();
            if(!requirement)return false;

            if(/^reconcile\\b/.test(requirement)){
              const padded=' '+requirement+' ';
              const hasResolvedChild=[
                ' completed child ',' completed children ',' completed sibling ',
                ' resolved child ',' resolved children ',' resolved sibling ',
                ' verified child ',' verified children ',' verified sibling ',
                ' completed result ',' completed results ',' resolved result ',' resolved results ',
                ' verified result ',' verified results ',' completed artifact ',' completed artifacts ',
                ' resolved artifact ',' resolved artifacts ',' verified artifact ',' verified artifacts '
              ].some(v=>padded.includes(v));
              const hasFinalOutput=/\\b(final|terminal|submission|submit|format|synthesi[sz]e|merge|assemble)\\b/.test(requirement);
              return hasResolvedChild&&hasFinalOutput;
            }

            return /^(synthesize|synthesise|format|submit|compile|merge|assemble|convert)\\b/.test(requirement);
          }

          """
          anchor="export function pathDepth(nodePath){"
          if 'export function runtimeOwnedTerminalSynthesisChild' not in s:
              if anchor not in s:
                  raise SystemExit('controls_anchor_missing')
              s=s.replace(anchor,fn+anchor,1)
          controls.write_text(s)

          runtime=Path('workers/autonomous-recursive-decomposition.js')
          s=runtime.read_text()
          import_old="""  MAX_MODEL_TRANSPORT_ATTEMPTS,
            pathDepth,
          } from './semantic-runtime-controls.js';"""
          import_new="""  MAX_MODEL_TRANSPORT_ATTEMPTS,
            runtimeOwnedTerminalSynthesisChild,
            pathDepth,
          } from './semantic-runtime-controls.js';"""
          if 'runtimeOwnedTerminalSynthesisChild,' not in s.split("} from './semantic-runtime-controls.js';",1)[0]:
              if import_old not in s:
                  raise SystemExit('runtime_import_anchor_missing')
              s=s.replace(import_old,import_new,1)

          local_start=s.find('function runtimeOwnedTerminalSynthesisChild(candidate){')
          if local_start >= 0:
              local_end=s.find('\n}\n\nfunction validateStageContractArtifact',local_start)
              if local_end < 0:
                  raise SystemExit('local_classifier_end_missing')
              s=s[:local_start]+s[local_end+3:]

          old="""if(authored.length<1)
          throw new Error('autonomous_decomposition_split_requires_child:'+node.node_path);"""
          new="""if(authored.length<1){
          const collapsed=parsed?._runtime_terminal_synthesis_collapsed===true;
          const recoveryError=new Error(
            collapsed
              ?'runtime_terminal_synthesis_collapse_zero_child_reconsider'
              :'agent_split_done_without_child_reconsider'
          );
          recoveryError.code=collapsed
            ?'RUNTIME_TERMINAL_SYNTHESIS_COLLAPSE_ZERO_CHILD'
            :'COGNITION_SPLIT_DONE_WITHOUT_CHILD';
          recoveryError.rejectionReason=collapsed
            ?'terminal_synthesis_classifier_left_split_without_semantic_child'
            :'split_decision_produced_no_semantic_child';
          return returnChildAuthoringFailure({
            ordinal,
            phase:collapsed
              ?'terminal_synthesis_collapse_zero_child'
              :'split_done_without_child',
            error:recoveryError,
          });
        }"""
          if old in s:
              s=s.replace(old,new,1)
          elif 'runtime_terminal_synthesis_collapse_zero_child_reconsider' not in s:
              raise SystemExit('zero_child_done_anchor_missing')
          runtime.write_text(s)

          tests=Path('workers/semantic-runtime-controls.test.js')
          s=tests.read_text()
          import_anchor="""  classifyThresholdEvidence,
            pathDepth,"""
          import_repl="""  classifyThresholdEvidence,
            runtimeOwnedTerminalSynthesisChild,
            pathDepth,"""
          if 'runtimeOwnedTerminalSynthesisChild,' not in s.split("} from './semantic-runtime-controls.js';",1)[0]:
              if import_anchor not in s:
                  raise SystemExit('test_import_anchor_missing')
              s=s.replace(import_anchor,import_repl,1)

          tests_block="""test('terminal synthesis classifier preserves substantive reconciliation work',()=>{
            assert.equal(runtimeOwnedTerminalSynthesisChild({
              requirement:'Reconcile conflicting source values for CAC and select the canonical ledger value.'
            }),false);
            assert.equal(runtimeOwnedTerminalSynthesisChild({
              requirement:'Reconcile variable definitions, units, periods, and evidence states across supplied reports.'
            }),false);
          });

          test('terminal synthesis classifier owns only final reconciliation of resolved outputs',()=>{
            assert.equal(runtimeOwnedTerminalSynthesisChild({
              requirement:'Reconcile completed child artifacts into the final submission.'
            }),true);
            assert.equal(runtimeOwnedTerminalSynthesisChild({
              requirement:'Reconcile verified sibling results into the final artifact.'
            }),true);
            assert.equal(runtimeOwnedTerminalSynthesisChild({
              requirement:'Format the final submission for delivery.'
            }),true);
          });

          """
          test_anchor="test('path depth is only an emergency storage geometry check',()=>{"
          if "terminal synthesis classifier preserves substantive reconciliation work" not in s:
              if test_anchor not in s:
                  raise SystemExit('test_anchor_missing')
              s=s.replace(test_anchor,tests_block+test_anchor,1)
          tests.write_text(s)
          PY

      - name: Regression checks
        run: |
          node --check workers/semantic-runtime-controls.js
          node --check workers/autonomous-recursive-decomposition.js
          node --check workers/semantic-runtime-controls.test.js
          node --test workers/semantic-runtime-controls.test.js

      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add workers/semantic-runtime-controls.js workers/semantic-runtime-controls.test.js workers/autonomous-recursive-decomposition.js
          git diff --cached --quiet && exit 0
          git commit -m 'fix: preserve substantive reconciliation children'
          git push origin HEAD:fix/zero-child-runtime

# zero-child upstream repair v1
