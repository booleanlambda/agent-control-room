name: Repair Expertise Verifier Runtime

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-expertise-verifier-runtime.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Harden verifier latency and transient retry handling
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          p = Path('workers/expertise-verification-worker.js')
          s = p.read_text()

          old_candidate = "    const result = await nvidiaCall({ model: run.candidate_model_id, system, user, maxTokens: 700, temperature: 0.10, timeoutMs: run.metadata?.operator_smoke_test ? 90000 : 60000 });"
          new_candidate = """    let result = null;
    let lastError = null;
    for (let attempt = 1; attempt <= 3; attempt++) {
      try {
        result = await nvidiaCall({ model: run.candidate_model_id, system, user, maxTokens: 700, temperature: 0.10, timeoutMs: 120000 });
        break;
      } catch (error) {
        lastError = error;
        const status = Number(error?.status || 0);
        const retryable = error?.name === 'AbortError' || status === 429 || status >= 500;
        if (!retryable || attempt === 3) throw error;
        await sleep(1500 * attempt);
      }
    }
    if (!result) throw lastError || new Error(`candidate_no_result:${task.id}`);"""
          if old_candidate not in s:
              raise SystemExit('candidate_anchor_missing')
          s = s.replace(old_candidate, new_candidate, 1)

          old_auth = """  for (let attempt = 1; attempt <= 3; attempt++) {
    const result = await nvidiaCall({ model: run.authenticator_model, system, user, maxTokens: 220, temperature: 0, timeoutMs: 60000, jsonMode: true });
    const grade = parseGrade(result.text);
    if (grade) return { ...grade, id: task.id, verifier_model: result.model, raw_sha256: sha256(result.text) };
    if (attempt < 3) await sleep(1200 * attempt);
  }"""
          new_auth = """  for (let attempt = 1; attempt <= 3; attempt++) {
    try {
      const result = await nvidiaCall({ model: run.authenticator_model, system, user, maxTokens: 220, temperature: 0, timeoutMs: 90000, jsonMode: true });
      const grade = parseGrade(result.text);
      if (grade) return { ...grade, id: task.id, verifier_model: result.model, raw_sha256: sha256(result.text) };
    } catch (error) {
      const status = Number(error?.status || 0);
      const retryable = error?.name === 'AbortError' || status === 429 || status >= 500;
      if (!retryable || attempt === 3) throw error;
    }
    if (attempt < 3) await sleep(1500 * attempt);
  }"""
          if old_auth not in s:
              raise SystemExit('authenticator_anchor_missing')
          s = s.replace(old_auth, new_auth, 1)

          old_adj = """  for (const model of candidates) {
    try {
      const result = await nvidiaCall({ model, system, user, maxTokens: 500, temperature: 0, timeoutMs: 45000 });
      const grade = parseGrade(result.text);
      if (grade) return { ...grade, id: task.id, adjudicator_model: result.model, supersedes_score: prior.score, raw_sha256: sha256(result.text) };
    } catch (e) {
      console.warn('AAU_EXPERTISE_ADJUDICATOR_MODEL_FAILED', model, String(e?.message || e).slice(0, 500));
    }
  }"""
          new_adj = """  for (const model of candidates) {
    for (let attempt = 1; attempt <= 2; attempt++) {
      try {
        const result = await nvidiaCall({ model, system, user, maxTokens: 650, temperature: 0, timeoutMs: 90000 });
        const grade = parseGrade(result.text);
        if (grade) return { ...grade, id: task.id, adjudicator_model: result.model, supersedes_score: prior.score, raw_sha256: sha256(result.text) };
      } catch (e) {
        console.warn('AAU_EXPERTISE_ADJUDICATOR_MODEL_FAILED', model, String(e?.message || e).slice(0, 500));
      }
      if (attempt < 2) await sleep(1500 * attempt);
    }
  }"""
          if old_adj not in s:
              raise SystemExit('adjudicator_anchor_missing')
          s = s.replace(old_adj, new_adj, 1)

          p.write_text(s)
          PY
          node --check workers/expertise-verification-worker.js
      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add workers/expertise-verification-worker.js
          git diff --cached --quiet && exit 0
          git commit -m 'fix: harden expertise verifier retries and timeouts'
          git push

# repair trigger v1
