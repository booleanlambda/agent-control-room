name: AAU K3 OFF V6 Prompt Self-Audit Retest
on:
  pull_request:
    types: [opened]
    branches:
      - experiment/aau-toolchain-prompt-v6-self-audit-20261020
permissions:
  contents: read
concurrency:
  group: aau-serial-logistics-model-slot
  cancel-in-progress: false
jobs:
  k3-v6:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Hash-pin identical challenge/rubric/UCCR and new V6 prompt
        shell: bash
        run: |
          set -euo pipefail
          root=experiments/tool-selection-restoration
          test "$(git hash-object "$root/challenge.json")" = "e51781a1a000f59f8c5ba508698c513d6c90bdb6"
          test "$(git hash-object "$root/rubric.json")" = "e19e740ebbe52c8772faa34685ffb4165b3883ec"
          test "$(git hash-object "$root/aau_registry_db_export_v01.json")" = "ac160bdf4eb0f1ea2d179a6ad355f8235fa19ec0"
          test "$(git hash-object "$root/TOOL_SELECTION_GENERIC_V5_SYSTEM.md")" = "e520242011970ad10338a9b764896db2ada38bd6"
          test "$(git hash-object "$root/TOOL_SELECTION_GENERIC_V6_SYSTEM.md")" = "4746107111c7b6c99131396965db364016ae33f0"
          test "$(git hash-object "$root/parallel_discovery_v01.py")" = "c2c037eb34d6f10c6c90be46f52219bda4154d94"
          test "$(git hash-object "$root/k3_v6_parallel_selfaudit_live_v01.py")" = "c5f879e92aaa39c7f141b3c0085f897df4634b04"
          test "$(git hash-object "$root/k3_v6_independent_structural_regression_v01.py")" = "d3bcbe356d4cb55137e16eb3083f4780204be85c"
          python -m py_compile "$root/parallel_discovery_v01.py" "$root/k3_v6_parallel_selfaudit_live_v01.py" "$root/k3_v6_independent_structural_regression_v01.py"
      - name: Verify identical tool roster, first required Parallel, bounded discovery
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0,'experiments/tool-selection-restoration')
          import k3_v6_parallel_selfaudit_live_v01 as k
          from parallel_discovery_v01 import Discovery
          assert k.FROZEN['TOOL_SELECTION_GENERIC_V6_SYSTEM.md']=='4746107111c7b6c99131396965db364016ae33f0'
          assert len(k.CAT['operations'])==6
          assert [x['function']['name'] for x in k.TOOLS]==['search_capabilities','inspect_operation','parallel_software_discovery']
          d=Discovery()
          assert d.search('', ['valid'])['error']=='INVALID_OBJECTIVE'
          assert d.search('Find computational software', [])['error']=='INVALID_SEARCH_QUERIES'
          assert d.calls==0
          print('AAU_V6_SAME_BENCHMARK_AND_ADAPTER_PASS')
          PY
      - name: Live K3 thinking OFF with pinned V6 prompt and Parallel
        env:
          MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
          PARALLEL_API_KEY: ${{ secrets.PARALLEL_API_KEY }}
        run: python experiments/tool-selection-restoration/k3_v6_parallel_selfaudit_live_v01.py
      - name: Independent deterministic structural and prior-error regression audit
        if: always()
        run: python experiments/tool-selection-restoration/k3_v6_independent_structural_regression_v01.py
      - name: Archive response, provider receipt, tool results, regression checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aau-k3-off-v6-prompt-selfaudit-full-evidence
          path: |
            experiments/tool-selection-restoration/TOOL_SELECTION_GENERIC_V6_SYSTEM.md
            experiments/tool-selection-restoration/challenge.json
            experiments/tool-selection-restoration/rubric.json
            experiments/tool-selection-restoration/aau_registry_db_export_v01.json
            experiments/tool-selection-restoration/evidence_k3_v6_parallel_selfaudit_v01/
          retention-days: 30
          if-no-files-found: warn
