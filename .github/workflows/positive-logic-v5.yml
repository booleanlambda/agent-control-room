name: AAU Positive Logical Recovery V5

on:
  pull_request:
    types: [opened]
    branches:
      - experiment/organic-multifamily-v4
    paths:
      - 'experiments/positive-logic-v5/**'
      - '.github/workflows/positive-logic-v5.yml'

permissions:
  contents: read

concurrency:
  group: aau-serial-logistics-model-slot
  cancel-in-progress: false

jobs:
  single-worker-positive-logic:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    env:
      AAU_ORGANIC_V4_AUTHORIZED: 'yes'
      AAU_PYTHON_SANDBOX: 'yes'
      MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Preflight logic, syntax, exact positive optimum and guardrails
        run: |
          node --check experiments/positive-logic-v5/benchmark.mjs
          node --check experiments/positive-logic-v5/live.mjs
          node --test experiments/positive-logic-v5/benchmark.test.mjs
      - name: Single-thread Kimi organic executable reasoning recovery
        working-directory: experiments/positive-logic-v5
        run: node live.mjs
      - name: Preserve public and hidden verification evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aau-positive-logic-v5-evidence
          path: experiments/positive-logic-v5/positive-logic-v5-evidence.json
          if-no-files-found: warn
