name: Systemic Runtime Tree CI

on:
  push:
    branches:
      - systemic-runtime-tree-v0.2
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-tree:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax check runtime files
        run: |
          node --check workers/autonomous-recursive-decomposition.js
          node --check workers/nvidia-intent-execution.js
          node --check workers/nvidia-autonomous-lifecycle.js
      - name: Semantic runtime control tests
        run: node --test workers/semantic-runtime-controls.test.js
