name: AAU tool evidence verifier tests (no model API)
on:
  pull_request:
    types: [opened, synchronize]
    branches:
      - experiment/aau-v4-k26-repair-delta-20261019
    paths:
      - experiments/tool-selection-restoration/tool_evidence_verifier_v1.py
      - experiments/tool-selection-restoration/test_tool_evidence_verifier_v1.py
      - .github/workflows/aau-tool-evidence-verifier-tests.yml
permissions:
  contents: read
jobs:
  synthetic-evidence-pre-gate-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile verifier and tests
        run: |
          python -m py_compile experiments/tool-selection-restoration/tool_evidence_verifier_v1.py
          python -m py_compile experiments/tool-selection-restoration/test_tool_evidence_verifier_v1.py
      - name: Run synthetic regression tests (NO live model and NO Stage 2)
        run: python -m unittest discover -s experiments/tool-selection-restoration -p 'test_tool_evidence_verifier_v1.py' -v
