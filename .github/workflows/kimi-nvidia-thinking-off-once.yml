name: AAU Kimi K2.5 NVIDIA Think-Off One Shot

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/kimi-nvidia-thinking-off-once.yml'

permissions:
  contents: read

jobs:
  kimi-non-thinking-comparison:
    if: github.head_ref == 'experiment/recursive-tree-nemotron-v0'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Verify key and deterministic trust boundary
        working-directory: experiments/recursion-tree-v0
        run: |
          set -euo pipefail
          test -n "${NVIDIA_API_KEY:-}" || { echo "NVIDIA_KEY_UNAVAILABLE"; exit 3; }
          node --check live-nvidia-kimi-thinking-off.mjs
          node --test synthesis-slots.test.mjs
      - name: Test live Kimi K2.5 with thinking disabled — ten levels and ten parent syntheses
        working-directory: experiments/recursion-tree-v0
        run: node live-nvidia-kimi-thinking-off.mjs
      - name: Preserve diagnostic model decisions and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aau-kimi-nvidia-thinking-off-depth10
          path: experiments/recursion-tree-v0/recursion-live-nvidia-kimi-k25-thinking-off-report.json
          if-no-files-found: ignore
