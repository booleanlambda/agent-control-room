name: AAU Kimi K2.5 Think-Off Depth10 One Shot

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/kimi-k25-thinking-off-once.yml'

permissions:
  contents: read

jobs:
  kimi-deep-tree:
    if: github.head_ref == 'experiment/recursive-tree-nemotron-v0'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      MOONSHOT_APIKEY: ${{ secrets.MOONSHOT_APIKEY }}
      MOONSHOT_ENDPOINT: ${{ secrets.MOONSHOT_ENDPOINT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Verify Kimi credentials without displaying secret values
        run: |
          if [[ -z "${MOONSHOT_APIKEY:-}" ]]; then
            echo "KIMI_EXPERIMENT_BLOCKED=GITHUB_MOONSHOT_APIKEY_UNAVAILABLE"
            exit 3
          fi
      - name: Check recursion engine and proof binding
        working-directory: experiments/recursion-tree-v0
        run: |
          node --check live-kimi-thinking-off.mjs
          node --test synthesis-slots.test.mjs
      - name: Kimi K2.5 instant ten-deep recursion and full synthesis
        working-directory: experiments/recursion-tree-v0
        run: node live-kimi-thinking-off.mjs
      - name: Preserve full model decisions, token usage and verifier outcomes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aau-kimi-thinking-off-depth10-evidence
          path: experiments/recursion-tree-v0/recursion-live-kimi-k25-thinking-off-report.json
          if-no-files-found: ignore
