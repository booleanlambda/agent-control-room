name: AAU K3 Frozen Toolchain Independent Executable Verification
on:
  pull_request:
    types: [opened]
    branches:
      - experiment/aau-parallel-required-tool-k3off-20261020
permissions:
  contents: read
  actions: read
concurrency:
  group: aau-independent-executable-verification
  cancel-in-progress: false
jobs:
  verify-original-selection:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download exact original Kimi run artifact without altering proposal
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p /tmp/aau-frozen
          gh run download 39478425234 -n aau-k3-off-parallel-required-tool-full-evidence -D /tmp/aau-frozen
          cp /tmp/aau-frozen/evidence_k3_parallel_required_v02/summary.json experiments/tool-selection-restoration/frozen_original_summary.json
          sha256sum experiments/tool-selection-restoration/frozen_original_summary.json
          echo 'FROZEN_ORIGINAL_PROPOSAL_DIRECTLY_FROM_ACTIONS_RUN_39478425234'
      - name: Verify test code pinned and pin runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object experiments/tool-selection-restoration/verify_frozen_k3_toolchain.py)" = "5f2b5c4015307f8bdc7348b94267afb0f25e4713"
          python -m py_compile experiments/tool-selection-restoration/verify_frozen_k3_toolchain.py
          python -m pip install -q --disable-pip-version-check networkx==3.6.1 pyomo==6.10.1 highspy==1.15.1 ortools==9.12.4544 dss-python==0.15.7
      - name: Run independent executable, negative-case and contract verification
        run: python experiments/tool-selection-restoration/verify_frozen_k3_toolchain.py
      - name: Archive complete verifier receipt on both pass and failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aau-k3-frozen-ten-tool-independent-verification
          path: |
            experiments/tool-selection-restoration/evidence_k3_independent_verifier_v01/
          if-no-files-found: warn
          retention-days: 30
