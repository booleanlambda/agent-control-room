name: AAU One-Time Provider Retrieval Probe

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/provider-capability-once.yml'

permissions:
  contents: read

jobs:
  provider-capabilities:
    if: github.head_ref == 'experiment/recursive-tree-nemotron-v0'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify fixed-endpoint code and fail-closed policy
        working-directory: experiments/recursion-tree-v0
        run: |
          node --check provider-real-capabilities.mjs
          node --test provider-recovery-policy.test.mjs
      - name: At most one small inference per provider and read-only result retrieval
        working-directory: experiments/recursion-tree-v0
        run: node provider-real-capabilities.mjs
      - name: Archive sanitized provider capability assessment
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aau-moonshot-nvidia-response-retrieval-capabilities
          path: experiments/recursion-tree-v0/provider-real-capabilities-report.json
          if-no-files-found: error
