name: AAU Kimi K2.6 Pacing-Aware One-Time Recursion

on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/kimi-k26-rate-aware-once.yml']

permissions:
  contents: read

jobs:
  kimi-non-thinking-3rpm:
    if: github.head_ref == 'experiment/recursive-tree-nemotron-v0'
    runs-on: ubuntu-latest
    timeout-minutes: 23
    env:
      MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
      MOONSHOT_APIKEY: ${{ secrets.MOONSHOT_APIKEY }}
      MOONSHOT_ENDPOINT: ${{ secrets.MOONSHOT_ENDPOINT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Verify key presence and deterministic safety tests
        working-directory: experiments/recursion-tree-v0
        run: |
          test -n "${MOONSHOT_API_KEY:-}${MOONSHOT_APIKEY:-}" || { echo 'MOONSHOT_KEY_UNAVAILABLE'; exit 3; }
          node --check live-kimi-thinking-off.mjs
          node --test synthesis-slots.test.mjs
      - name: Real Kimi K2.6 thinking-off ten-deep run with organization rate limiter
        working-directory: experiments/recursion-tree-v0
        run: node live-kimi-thinking-off.mjs
      - name: Upload every model decision, terminal status and proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aau-kimi-k26-rate-aware-evidence
          path: experiments/recursion-tree-v0/recursion-live-kimi-k26-thinking-off-report.json
          if-no-files-found: ignore
