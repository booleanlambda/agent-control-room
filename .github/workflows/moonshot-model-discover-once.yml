name: AAU Moonshot One-Shot Available Model Discovery

on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/moonshot-model-discover-once.yml']

permissions:
  contents: read

jobs:
  list-account-model-ids:
    if: github.head_ref == 'experiment/recursive-tree-nemotron-v0'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
      MOONSHOT_APIKEY: ${{ secrets.MOONSHOT_APIKEY }}
      MOONSHOT_ENDPOINT: ${{ secrets.MOONSHOT_ENDPOINT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Fetch readable Kimi IDs without logging credentials
        working-directory: experiments/recursion-tree-v0
        run: |
          node --check moonshot-discover-models.mjs
          node moonshot-discover-models.mjs
