name: AAU K3 OFF UCCR Plus Parallel Live Tool Discovery
on:
  pull_request:
    types: [opened]
    branches:
      - experiment/aau-k3-off-readonly-toolchain-20261020
permissions:
  contents: read
concurrency:
  group: aau-serial-logistics-model-slot
  cancel-in-progress: false
jobs:
  k3-parallel:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify original benchmark and unchanged existing registry export
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object experiments/tool-selection-restoration/challenge.json)" = "e51781a1a000f59f8c5ba508698c513d6c90bdb6"
          test "$(git hash-object experiments/tool-selection-restoration/TOOL_SELECTION_GENERIC_V5_SYSTEM.md)" = "e520242011970ad10338a9b764896db2ada38bd6"
          test "$(git hash-object experiments/tool-selection-restoration/rubric.json)" = "e19e740ebbe52c8772faa34685ffb4165b3883ec"
          test "$(git hash-object experiments/tool-selection-restoration/aau_registry_db_export_v01.json)" = "ac160bdf4eb0f1ea2d179a6ad355f8235fa19ec0"
          test "$(git hash-object experiments/tool-selection-restoration/parallel_discovery_v01.py)" = "c2c037eb34d6f10c6c90be46f52219bda4154d94"
          test "$(git hash-object experiments/tool-selection-restoration/k3_parallel_toolchain_live_v01.py)" = "e38366a35da4784700e4680e915888ec75169e5c"
          test "$(git hash-object experiments/tool-selection-restoration/k3_parallel_independent_audit_v01.py)" = "1a316cafe3c35f1ca72aa11be165d1295e87ad0f"
          python -m py_compile experiments/tool-selection-restoration/parallel_discovery_v01.py experiments/tool-selection-restoration/k3_parallel_toolchain_live_v01.py experiments/tool-selection-restoration/k3_parallel_independent_audit_v01.py
      - name: Independently verify read-only tools and invalid input rejection
        shell: bash
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0,'experiments/tool-selection-restoration')
          import k3_parallel_toolchain_live_v01 as k
          from parallel_discovery_v01 import Discovery
          d=Discovery()
          assert len(k.CAT['operations'])==6
          assert k.search_capabilities('graph')['result_count']>0
          assert not k.inspect_operation('op.unknown')['found']
          assert d.search('', ['valid'])['error']=='INVALID_OBJECTIVE'
          assert d.search('Find computational software', [])['error']=='INVALID_SEARCH_QUERIES'
          assert [t['function']['name'] for t in k.TOOLS]==['search_capabilities','inspect_operation','parallel_software_discovery']
          print('AAU_PARALLEL_K3_ADAPTER_NEGATIVE_TESTS_PASS')
          PY
      - name: Verify GitHub secret with one real Parallel documented software search
        env:
          PARALLEL_API_KEY: ${{ secrets.PARALLEL_API_KEY }}
        run: python experiments/tool-selection-restoration/parallel_discovery_v01.py
      - name: Kimi K3 thinking OFF chooses UCCR and Parallel live discovery calls
        env:
          PARALLEL_API_KEY: ${{ secrets.PARALLEL_API_KEY }}
          MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
        run: python experiments/tool-selection-restoration/k3_parallel_toolchain_live_v01.py
      - name: Independent proposal and live-source audit
        if: always()
        run: python experiments/tool-selection-restoration/k3_parallel_independent_audit_v01.py
      - name: Archive source URLs, Parallel and K3 responses, and structural verifier receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aau-k3-parallel-live-discovery-complete-evidence
          path: |
            experiments/tool-selection-restoration/challenge.json
            experiments/tool-selection-restoration/TOOL_SELECTION_GENERIC_V5_SYSTEM.md
            experiments/tool-selection-restoration/aau_registry_db_export_v01.json
            experiments/tool-selection-restoration/evidence_k3_parallel_discovery_v01/
          if-no-files-found: warn
          retention-days: 30
