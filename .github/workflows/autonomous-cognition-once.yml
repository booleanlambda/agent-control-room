name: AAU Autonomous Engineering Cognition One Shot

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/autonomous-cognition-once.yml'

permissions:
  contents: read

jobs:
  kimi-k26:
    if: github.head_ref == 'experiment/recursive-tree-nemotron-v0'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
      AAU_COGNITION_LIVE_EXPERIMENT: 'yes'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Verify independently audited microgrid benchmark
        run: |
          node --check experiments/recursion-tree-v0/autonomous-engineering-live.mjs
          node --test experiments/recursion-tree-v0/autonomous-engineering-benchmark.test.mjs
      - name: Kimi K2.6 thinking disabled chooses decomposition/tools and solves microgrid
        working-directory: experiments/recursion-tree-v0
        run: node autonomous-engineering-live.mjs kimi
      - name: Preserve full real Kimi cognition and independent audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aau-autonomous-microgrid-kimi-k26
          path: experiments/recursion-tree-v0/autonomous-engineering-kimi-report.json
          if-no-files-found: ignore

  nemotron:
    if: github.head_ref == 'experiment/recursive-tree-nemotron-v0'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      AAU_COGNITION_LIVE_EXPERIMENT: 'yes'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Independently verify benchmark
        run: |
          node --check experiments/recursion-tree-v0/autonomous-engineering-live.mjs
          node --test experiments/recursion-tree-v0/autonomous-engineering-benchmark.test.mjs
      - name: Nemotron thinking disabled identical engineering task under equal call ceiling
        working-directory: experiments/recursion-tree-v0
        run: node autonomous-engineering-live.mjs nemotron
      - name: Preserve full real Nemotron cognition and independent audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aau-autonomous-microgrid-nemotron
          path: experiments/recursion-tree-v0/autonomous-engineering-nemotron-report.json
          if-no-files-found: ignore
