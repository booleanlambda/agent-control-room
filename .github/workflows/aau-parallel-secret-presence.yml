name: AAU Parallel API Credential Presence Probe
on:
  pull_request:
    types: [opened]
    branches:
      - experiment/aau-k3-off-readonly-toolchain-20261020
permissions:
  contents: read
jobs:
  presence:
    runs-on: ubuntu-latest
    steps:
      - name: Check Parallel API GitHub Actions secrets without exposing values
        env:
          PARALLEL_API_KEY: ${{ secrets.PARALLEL_API_KEY }}
          PARALLEL_AI_API_KEY: ${{ secrets.PARALLEL_AI_API_KEY }}
          PARALLEL_APIKEY: ${{ secrets.PARALLEL_APIKEY }}
          PARALLEL_KEY: ${{ secrets.PARALLEL_KEY }}
        run: |
          python - <<'PY'
          import os, json
          names=('PARALLEL_API_KEY','PARALLEL_AI_API_KEY','PARALLEL_APIKEY','PARALLEL_KEY')
          present={name:bool(os.environ.get(name, '').strip()) for name in names}
          print('AAU_PARALLEL_CREDENTIAL_PRESENCE='+json.dumps(present,sort_keys=True))
          print('AAU_PARALLEL_CREDENTIAL_ANY='+str(any(present.values())).lower())
          print('AAU_PARALLEL_CREDENTIAL_PROBE_SCOPE=GitHub Actions environment presence only; no API request made')
          PY
