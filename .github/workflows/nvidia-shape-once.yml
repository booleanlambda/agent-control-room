name: AAU NVIDIA Completion Shape Probe Once

on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/nvidia-shape-once.yml']

permissions:
  contents: read

jobs:
  inspect-completion:
    if: github.head_ref == 'experiment/recursive-tree-nemotron-v0'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: One new bounded provider request; read-only GET probes
        working-directory: experiments/recursion-tree-v0
        run: |
          node --check nvidia-response-shape.mjs
          node nvidia-response-shape.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aau-nvidia-response-id-retrieval
          path: experiments/recursion-tree-v0/nvidia-response-shape-report.json
          if-no-files-found: error
