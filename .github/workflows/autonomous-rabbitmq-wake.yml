name: Autonomous RabbitMQ Wake Test

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/autonomous-rabbitmq-wake.yml'

permissions:
  contents: read

jobs:
  schedule-wake:
    name: Schedule wake and terminate producer
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      AMQP_URL: ${{ secrets.AMQP }}

    steps:
      - name: Verify RabbitMQ secret
        shell: bash
        run: |
          set -euo pipefail
          test -n "${AMQP_URL:-}"
          echo "AMQP_SECRET_PRESENT=true"

      - name: Install AMQP client
        shell: bash
        run: npm install --no-save --ignore-scripts amqplib@0.10.9

      - name: Publish autonomous wake for 60 seconds later
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import amqp from 'amqplib';
          import { randomUUID } from 'node:crypto';

          function normalize(raw) {
            let value = String(raw ?? '').trim();
            value = value.replace(/^AMQP(?:_URL)?\s*=\s*/i, '').trim();
            if ((value.startsWith('"') && value.endsWith('"')) ||
                (value.startsWith("'") && value.endsWith("'"))) {
              value = value.slice(1, -1).trim();
            }
            return value;
          }

          const url = normalize(process.env.AMQP_URL);
          const runId = process.env.GITHUB_RUN_ID;
          const wakeQueue = `agent-control-room.autowake.${runId}`;
          const delayQueue = `agent-control-room.autowake.delay.${runId}`;
          const createdAt = Date.now();
          const delayMs = 60_000;
          const messageId = randomUUID();

          const connection = await amqp.connect(url, { timeout: 10000 });
          const channel = await connection.createConfirmChannel();

          await channel.assertQueue(wakeQueue, { durable: true });
          await channel.assertQueue(delayQueue, {
            durable: true,
            arguments: {
              'x-dead-letter-exchange': '',
              'x-dead-letter-routing-key': wakeQueue,
            },
          });

          const event = {
            type: 'autonomous_wake',
            message_id: messageId,
            run_id: runId,
            created_at_ms: createdAt,
            wake_after_ms: delayMs,
            instruction: 'Wake the agent without any new human prompt.'
          };

          channel.sendToQueue(delayQueue, Buffer.from(JSON.stringify(event)), {
            persistent: true,
            expiration: String(delayMs),
            messageId,
            contentType: 'application/json',
            type: 'autonomous_wake'
          });
          await channel.waitForConfirms();

          console.log(`WAKE_MESSAGE_ID=${messageId}`);
          console.log(`WAKE_DELAY_MS=${delayMs}`);
          console.log(`WAKE_SCHEDULED_AT_MS=${createdAt}`);
          console.log('WAKE_MESSAGE_PERSISTENT=true');
          console.log('WAKE_SCHEDULED=true');

          await channel.close();
          await connection.close();
          console.log('PRODUCER_CONNECTION_CLOSED=true');
          console.log('PRODUCER_TERMINATED=true');
          NODE

  autonomous-wake:
    name: RabbitMQ wakes agent with no human input
    needs: schedule-wake
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      AMQP_URL: ${{ secrets.AMQP }}
      XKIRO_API_KEY: ${{ secrets.XKIRO_AGENT }}

    steps:
      - name: Confirm producer already finished
        shell: bash
        run: |
          echo "PRODUCER_JOB_FINISHED=true"
          echo "HUMAN_FOLLOWUP_PROMPT_REQUIRED=false"

      - name: Install AMQP client
        shell: bash
        run: npm install --no-save --ignore-scripts amqplib@0.10.9

      - name: Wait for RabbitMQ delayed wake
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import amqp from 'amqplib';
          import fs from 'node:fs';

          function normalize(raw) {
            let value = String(raw ?? '').trim();
            value = value.replace(/^AMQP(?:_URL)?\s*=\s*/i, '').trim();
            if ((value.startsWith('"') && value.endsWith('"')) ||
                (value.startsWith("'") && value.endsWith("'"))) {
              value = value.slice(1, -1).trim();
            }
            return value;
          }

          const url = normalize(process.env.AMQP_URL);
          const runId = process.env.GITHUB_RUN_ID;
          const wakeQueue = `agent-control-room.autowake.${runId}`;
          const delayQueue = `agent-control-room.autowake.delay.${runId}`;

          let connection;
          let channel;
          let consumerTag;
          let timer;

          try {
            connection = await amqp.connect(url, { timeout: 10000 });
            channel = await connection.createChannel();
            await channel.assertQueue(wakeQueue, { durable: true });
            await channel.prefetch(1);
            console.log('WAKE_CONSUMER_LISTENING=true');

            const event = await new Promise(async (resolve, reject) => {
              timer = setTimeout(() => reject(new Error('Timed out waiting for autonomous wake')), 120_000);
              const result = await channel.consume(wakeQueue, (msg) => {
                if (!msg) return;
                try {
                  const parsed = JSON.parse(msg.content.toString('utf8'));
                  if (parsed.type !== 'autonomous_wake') {
                    channel.nack(msg, false, false);
                    reject(new Error('Unexpected wake event type'));
                    return;
                  }
                  const receivedAt = Date.now();
                  const elapsed = receivedAt - Number(parsed.created_at_ms);
                  parsed.received_at_ms = receivedAt;
                  parsed.elapsed_ms = elapsed;
                  fs.writeFileSync('wake-event.json', JSON.stringify(parsed, null, 2));
                  channel.ack(msg);
                  clearTimeout(timer);
                  console.log(`WAKE_RECEIVED_AT_MS=${receivedAt}`);
                  console.log(`WAKE_ELAPSED_MS=${elapsed}`);
                  console.log('RABBITMQ_AUTONOMOUS_WAKE_RECEIVED=true');
                  resolve(parsed);
                } catch (err) {
                  channel.nack(msg, false, false);
                  reject(err);
                }
              }, { noAck: false });
              consumerTag = result.consumerTag;
            });

            if (event.elapsed_ms < 50_000) {
              throw new Error(`Wake arrived too early: ${event.elapsed_ms}ms`);
            }

            if (consumerTag) await channel.cancel(consumerTag);
            await channel.deleteQueue(delayQueue).catch(() => {});
            await channel.deleteQueue(wakeQueue).catch(() => {});
            console.log('DELAY_SEMANTICS_PASS=true');
            console.log('RABBITMQ_WAKE_PASS=true');
          } finally {
            if (timer) clearTimeout(timer);
            try { if (channel) await channel.close(); } catch {}
            try { if (connection) await connection.close(); } catch {}
          }
          NODE

      - name: Verify agent API secret
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${XKIRO_API_KEY:-}" ]; then
            echo "XKIRO_AGENT_SECRET_PRESENT=false"
            exit 2
          fi
          echo "XKIRO_AGENT_SECRET_PRESENT=true"

      - name: Load live free-tier fallback models
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -sS -o models.json -w '%{http_code}' https://api.xkiro.com/v1/models)
          echo "MODELS_HTTP_STATUS=${code}"
          test "$code" = "200"
          jq -r '[.data[] | select(.access_tier == "free") | .id] | .[:12][]' models.json > free-models.txt
          count=$(wc -l < free-models.txt | tr -d ' ')
          echo "FREE_FALLBACK_MODEL_COUNT=${count}"
          if [ "$count" -lt 1 ]; then
            echo "NO_FREE_CHAT_MODEL_AVAILABLE=true"
            exit 3
          fi
          first=$(sed -n '1p' free-models.txt)
          echo "FIRST_FREE_MODEL=${first}"

      - name: Invoke agent from autonomous wake event with fallback
        shell: bash
        run: |
          set -euo pipefail
          set +x

          elapsed=$(jq -r '.elapsed_ms' wake-event.json)
          message_id=$(jq -r '.message_id' wake-event.json)
          success=false
          final_http=""
          final_model=""
          final_content=""

          while IFS= read -r model; do
            [ -n "$model" ] || continue
            echo "TRYING_AGENT_MODEL=${model}"

            jq -n \
              --arg model "$model" \
              --arg elapsed "$elapsed" \
              --arg message_id "$message_id" \
              '{
                model:$model,
                temperature:0,
                max_tokens:120,
                messages:[
                  {
                    role:"system",
                    content:"You are an autonomous software agent. You have just been reactivated by a RabbitMQ event after the process that scheduled this wake already terminated. There is no new human prompt. Follow the wake instruction exactly."
                  },
                  {
                    role:"user",
                    content:("Autonomous wake event " + $message_id + " matured after " + $elapsed + " ms. Return exactly this token and nothing else: AUTONOMOUS_WAKE_OK")
                  }
                ]
              }' > payload.json

            for attempt in 1 2; do
              http_code=$(curl -sS -o response.json -w '%{http_code}' \
                https://api.xkiro.com/v1/chat/completions \
                -H "Authorization: Bearer ${XKIRO_API_KEY}" \
                -H 'Content-Type: application/json' \
                --data-binary @payload.json || true)

              echo "MODEL_ATTEMPT_HTTP=${model}:${attempt}:${http_code}"
              final_http="$http_code"

              if [ "$http_code" = "200" ]; then
                content=$(jq -r '.choices[0].message.content // empty' response.json)
                served_model=$(jq -r '.model // empty' response.json)
                normalized=$(printf '%s' "$content" | tr -d '\r\n ')
                if [ "$normalized" = "AUTONOMOUS_WAKE_OK" ]; then
                  success=true
                  final_model="${served_model:-$model}"
                  final_content="$content"
                  break 2
                fi
                echo "MODEL_RESPONSE_MISMATCH=${model}"
              fi

              sleep "$attempt"
            done
          done < free-models.txt

          echo "AGENT_HTTP_STATUS=${final_http}"
          if [ "$success" != "true" ]; then
            echo "AUTONOMOUS_AGENT_WAKE_PASS=false"
            jq '{error, message}' response.json 2>/dev/null || true
            exit 4
          fi

          echo "SERVED_MODEL=${final_model}"
          echo "AGENT_RESPONSE=${final_content}"
          echo "AUTONOMOUS_AGENT_WAKE_PASS=true"
          echo "HUMAN_INPUT_BETWEEN_SCHEDULE_AND_WAKE=false"
          echo "AUTONOMOUS_WAKE_EXPERIMENT_PASS=true"
