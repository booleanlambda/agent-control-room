name: AAU Kimi Direct Traceback Repair One Shot

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/kimi-direct-traceback-one-shot.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: aau-kimi-direct-traceback-one-shot
  cancel-in-progress: false

jobs:
  genuine-direct-repair:
    if: github.head_ref == 'experiment/recursive-tree-nemotron-v0'
    runs-on: ubuntu-latest
    timeout-minutes: 28
    env:
      MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
      AAU_PYTHON_SANDBOX: 'yes'
      AAU_REMEDIATION_V2_AUTHORIZED: 'yes'
      AAU_REPAIR_START_WITH_V3: 'yes'
      AAU_REMEDIATION_V2_FIXTURE: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Retrieve original genuine Kimi failed algorithm
        uses: actions/download-artifact@v4
        with:
          name: aau-kimi-unseen-python-cognition-audit
          run-id: 38994095805
          repository: booleanlambda/agent-control-room
          github-token: ${{ github.token }}
          path: experiments/recursion-tree-v0
      - name: Retrieve immutable prior genuine Kimi traceback-failure program
        uses: actions/download-artifact@v4
        with:
          name: aau-kimi-self-remediation-v3-live-evidence
          run-id: 39025542225
          repository: booleanlambda/agent-control-room
          github-token: ${{ github.token }}
          path: experiments/recursion-tree-v0/prior-v3
      - name: Preflight exact origin artifacts and authorized live-only environment
        run: |
          set -euo pipefail
          test -n "${MOONSHOT_API_KEY:-}" || { echo 'MOONSHOT_API_KEY_MISSING'; exit 3; }
          test "${AAU_REPAIR_START_WITH_V3:-}" = yes
          test -z "${AAU_REMEDIATION_V2_FIXTURE:-}"
          test -s experiments/recursion-tree-v0/unseen-python-kimi-report.json
          test -s experiments/recursion-tree-v0/prior-v3/self-remediation-v2-checkpoint.json
          node --check experiments/recursion-tree-v0/self-remediation-kimi-v2.mjs
          node --test experiments/recursion-tree-v0/unseen-python-benchmarks.test.mjs
          docker pull python:3.12-alpine
      - name: Reproduce Kimi's actual traceback then checkpoint direct repair entry
        working-directory: experiments/recursion-tree-v0
        run: node self-remediation-kimi-v2.mjs seed
      - name: Up to seven authorized independent repair-or-diagnose processes
        working-directory: experiments/recursion-tree-v0
        shell: bash
        run: |
          set -euo pipefail
          for cycle in $(seq 1 7); do
            echo "DIRECT_KIMI_CYCLE=$cycle"
            node self-remediation-kimi-v2.mjs cycle
            status="$(node -p "require('./self-remediation-v2-checkpoint.json').status")"
            next_phase="$(node -p "require('./self-remediation-v2-checkpoint.json').phase")"
            echo "DIRECT_KIMI_STATE=$status NEXT=$next_phase"
            if [[ "$status" == 'passed' || "$status" == 'manual_hold' || "$status" == 'exhausted' || "$status" == 'stopped' ]]; then
              break
            fi
            sleep 25
          done
      - name: Independent objective witness hidden-variation and model-authored tests audit
        working-directory: experiments/recursion-tree-v0
        run: node self-remediation-kimi-v2.mjs finish
      - name: Archive real Kimi code diagnosis checks and provider usage regardless of pass
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aau-kimi-direct-traceback-real-repair-evidence
          path: |
            experiments/recursion-tree-v0/self-remediation-v2-checkpoint.json
            experiments/recursion-tree-v0/self-remediation-v2-report.json
          if-no-files-found: ignore
