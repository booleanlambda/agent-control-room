name: AAU AMQP Credential Read-Only Probe V16

on:
  pull_request:
    types: [opened, synchronize]
    branches:
      - experiment/disk-frontier-v15
    paths:
      - '.github/workflows/amqp-credential-probe-v16.yml'

permissions:
  contents: read

concurrency:
  group: aau-serial-logistics-model-slot
  cancel-in-progress: false

jobs:
  read-only-secret-and-handshake:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      AMQP_URL: ${{ secrets.AMQP }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify secret presence without exposing the value
        shell: bash
        run: |
          set +x
          if [ -z "${AMQP_URL:-}" ]; then
            echo 'AMQP_SECRET_PRESENT=false'
            exit 2
          fi
          echo 'AMQP_SECRET_PRESENT=true'
      - name: Install minimal RabbitMQ client
        run: npm install --no-save --ignore-scripts amqplib@0.10.9
      - name: Connection-only TLS/AMQP handshake without any queue or message mutation
        shell: bash
        run: |
          set +x
          node --input-type=module <<'NODE'
          import amqp from 'amqplib';
          const raw = String(process.env.AMQP_URL || '').trim();
          let value = raw.replace(/^AMQP(?:_URL)?\s*=\s*/i,'').trim();
          if ((value.startsWith('"') && value.endsWith('"')) ||
              (value.startsWith("'") && value.endsWith("'"))) {
            value=value.slice(1,-1).trim();
          }
          let parsed;
          try { parsed=new URL(value); }
          catch { console.log('AMQP_URL_FORMAT_OK=false');process.exit(2); }
          if (!['amqp:','amqps:'].includes(parsed.protocol)) {
            console.log('AMQP_PROTOCOL_SUPPORTED=false');process.exit(2);
          }
          console.log('AMQP_URL_FORMAT_OK=true');
          console.log('AMQP_TLS_CONFIGURED='+String(parsed.protocol==='amqps:'));
          let conn;
          try {
            conn=await Promise.race([
              amqp.connect(value,{timeout:10000}),
              new Promise((_,reject)=>setTimeout(()=>reject(new Error('CONNECT_TIMEOUT')),12000))
            ]);
            console.log('AMQP_CONNECT_OK=true');
            console.log('AMQP_NO_QUEUE_OR_MESSAGE_MUTATION=true');
          } catch(e) {
            console.log('AMQP_CONNECT_OK=false');
            const name=String(e?.code||e?.name||'unknown');
            console.log('AMQP_ERROR_CATEGORY='+(['ECONNREFUSED','ETIMEDOUT','ENOTFOUND','EAI_AGAIN','ECONNRESET'].includes(name)?name:'OTHER'));
            process.exitCode=3;
          } finally {
            try { if(conn)await conn.close(); } catch {}
          }
          NODE
