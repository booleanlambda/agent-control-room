name: AAU Independent Expertise Verification

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/aau-independent-verification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-packet:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPEN_ROUTER_AUTHENTICATOR }}
      VERIFIER_MODEL: nvidia/nemotron-3-ultra-550b-a55b:free
    steps:
      - uses: actions/checkout@v4
      - name: Generate fresh hidden C1-C8 packet
        shell: bash
        run: |
          set -euo pipefail
          set +x
          [ -n "${OPENROUTER_API_KEY:-}" ] || { echo 'AUTHENTICATOR_SECRET_MISSING=true'; exit 2; }
          jq -n --arg model "$VERIFIER_MODEL" '{
            model:$model,
            temperature:0.7,
            max_tokens:2200,
            reasoning:{exclude:true},
            messages:[
              {role:"system",content:"You are the independent AAU expertise verification task authority. Create a fresh unseen assessment for an AI Workflow Integration Specialist focused on SMB operational workflows. Produce exactly eight single-line tasks, one per competency C1 through C8. Each line MUST be formatted as C1<TAB>task text through C8<TAB>task text. Do not provide answers, hints, grades, or rubric scores. Make tasks materially different from examples about equipment rental, B2B SaaS onboarding, support routing, wholesale returns, and legal intake. Tasks must demand concrete professional judgment, not trivia. C1 workflow discovery/process/value; C2 API/event/data contracts; C3 auth/authz/secrets/privacy/AI security; C4 LLM/tool orchestration/structured interaction; C5 reliable execution/state/recovery; C6 testing/evaluation/guardrails/human oversight; C7 observability/monitoring/cost/incidents; C8 end-to-end delivery/documentation/client judgment."},
              {role:"user",content:"Generate the fresh verifier-owned packet now. Exactly eight task lines, C1 through C8, tab-separated. No answer key."}
            ]
          }' > packet-request.json
          code=''
          for attempt in 1 2 3; do
            code=$(curl -sS -o packet-response.json -w '%{http_code}' https://openrouter.ai/api/v1/chat/completions \
              -H "Authorization: Bearer ${OPENROUTER_API_KEY}" -H 'Content-Type: application/json' \
              -H 'HTTP-Referer: https://github.com/booleanlambda/agent-control-room' \
              -H 'X-Title: AAU Independent Verification Task Authority' --data-binary @packet-request.json || true)
            [ "$code" = '200' ] && break
            sleep $((attempt * 3))
          done
          echo "PACKET_HTTP_STATUS=${code}"
          [ "$code" = '200' ] || { jq '{error,message}' packet-response.json 2>/dev/null || cat packet-response.json; exit 3; }
          python - <<'PY'
          import json,re,hashlib
          r=json.load(open('packet-response.json'))
          text=((r.get('choices') or [{}])[0].get('message') or {}).get('content','')
          tasks={}
          for line in text.splitlines():
              m=re.match(r'^\s*(C[1-8])\s*(?:\t|\|)\s*(.+?)\s*$', line)
              if m and m.group(1) not in tasks:
                  tasks[m.group(1)]=m.group(2)
          if set(tasks)!= {f'C{i}' for i in range(1,9)}:
              raise SystemExit(f'packet_parse_failed domains={sorted(tasks)}')
          packet={"packet_version":"aau_independent_verification_v1","tasks":[{"domain":f'C{i}',"task":tasks[f'C{i}']} for i in range(1,9)]}
          core=json.dumps(packet,sort_keys=True,separators=(',',':')).encode()
          packet['packet_sha256']=hashlib.sha256(core).hexdigest()
          json.dump(packet,open('packet.json','w'),indent=2)
          print('PACKET_VALID=true')
          print('PACKET_SHA256='+packet['packet_sha256'])
          print('VERIFIER_SERVED_MODEL='+str(r.get('model','')))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: verification-packet
          path: packet.json
          retention-days: 7

  learner-proof:
    needs: generate-packet
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      XKIRO_API_KEY: ${{ secrets.XKIRO_AGENT }}
      WORKER_MODEL: deepseek/deepseek-v4-flash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: verification-packet
      - name: Answer fresh packet in isolated worker runtime
        shell: bash
        run: |
          set -euo pipefail
          set +x
          [ -n "${XKIRO_API_KEY:-}" ] || { echo 'WORKER_SECRET_MISSING=true'; exit 2; }
          cp verifier_assets/frozen_evidence_index.json evidence-index.json
          jq -n --arg model "$WORKER_MODEL" --rawfile packet packet.json --rawfile evidence evidence-index.json '{
            model:$model,
            temperature:0.2,
            max_tokens:7000,
            messages:[
              {role:"system",content:"You are the learner runtime undergoing a frozen-portfolio AAU expertise verification. Answer each C1-C8 task independently and professionally. Do not invent live-production validation. Cite relevant frozen artifact IDs from the supplied evidence index when they materially support your answer. Explicitly state uncertainty and validation limits. Output exactly eight delimited sections: <<<C1>>> answer <<<ENDC1>>> through <<<C8>>> answer <<<ENDC8>>>. Do not omit a section."},
              {role:"user",content:("FRESH TASK PACKET:\n"+$packet+"\n\nREAD-ONLY FROZEN EVIDENCE INDEX:\n"+$evidence)}
            ]
          }' > learner-request.json
          code=''
          for attempt in 1 2 3; do
            code=$(curl -sS -o learner-response.json -w '%{http_code}' https://api.xkiro.com/v1/chat/completions \
              -H "Authorization: Bearer ${XKIRO_API_KEY}" -H 'Content-Type: application/json' --data-binary @learner-request.json || true)
            [ "$code" = '200' ] && break
            sleep $((attempt * 3))
          done
          echo "LEARNER_HTTP_STATUS=${code}"
          [ "$code" = '200' ] || { jq '{error,message}' learner-response.json 2>/dev/null || cat learner-response.json; exit 3; }
          python - <<'PY'
          import json,re,hashlib
          r=json.load(open('learner-response.json'))
          text=((r.get('choices') or [{}])[0].get('message') or {}).get('content','')
          answers={}
          for i in range(1,9):
              d=f'C{i}'
              m=re.search(rf'<<<{d}>>>\s*(.*?)\s*<<<END{d}>>>',text,re.S)
              if not m or not m.group(1).strip():
                  raise SystemExit(f'missing_answer_{d}')
              answers[d]=m.group(1).strip()
          out={"worker_model_requested":"deepseek/deepseek-v4-flash","worker_model_served":r.get('model'),"answers":answers}
          raw=json.dumps(out,sort_keys=True,separators=(',',':')).encode()
          out['answers_sha256']=hashlib.sha256(raw).hexdigest()
          json.dump(out,open('answers.json','w'),indent=2)
          print('LEARNER_ANSWERS_VALID=true')
          print('WORKER_SERVED_MODEL='+str(r.get('model','')))
          print('ANSWERS_SHA256='+out['answers_sha256'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: learner-answers
          path: |
            answers.json
            evidence-index.json
          retention-days: 7

  independent-grade:
    needs: [generate-packet, learner-proof]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPEN_ROUTER_AUTHENTICATOR }}
      VERIFIER_MODEL: nvidia/nemotron-3-ultra-550b-a55b:free
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: verification-packet
      - uses: actions/download-artifact@v4
        with:
          name: learner-answers
      - name: Grade C1-C8 without prior learner scores
        shell: bash
        run: |
          set -euo pipefail
          set +x
          [ -n "${OPENROUTER_API_KEY:-}" ] || { echo 'AUTHENTICATOR_SECRET_MISSING=true'; exit 2; }
          mkdir -p grades/raw grades/parsed
          for n in 1 2 3 4 5 6 7 8; do
            d="C${n}"
            task=$(jq -r --arg d "$d" '.tasks[] | select(.domain==$d) | .task' packet.json)
            answer=$(jq -r --arg d "$d" '.answers[$d]' answers.json)
            evidence=$(cat evidence-index.json)
            jq -n --arg model "$VERIFIER_MODEL" --arg domain "$d" --arg task "$task" --arg answer "$answer" --arg evidence "$evidence" '{
              model:$model,
              temperature:0,
              max_tokens:1800,
              reasoning:{exclude:true},
              messages:[
                {role:"system",content:"You are the operationally separate AAU final expertise verifier. You were not the learner or developmental grader. Grade only the fresh answer supplied. Do not use or infer prior learner scores. Rubric: execution/correctness 30, method 20, security/reliability 20, validation/evidence 15, communication/business judgment 15. A critical error is a defect that would make the proposed workflow materially unsafe, unauthorized, unrecoverable, or professionally misleading. Penalize unsupported production claims. Evidence citations count only if the cited ID exists in the supplied frozen index. End with exactly one machine-readable line: GRADE|DOMAIN|execution=N|method=N|security=N|validation=N|communication=N|critical=YES_or_NO|total=N|reason=short text where N are integer points within each component maximum and total is 0-100. Do not use the | character inside reason."},
                {role:"user",content:("DOMAIN: "+$domain+"\nTASK: "+$task+"\n\nLEARNER ANSWER:\n"+$answer+"\n\nFROZEN EVIDENCE INDEX:\n"+$evidence)}
              ]
            }' > "grades/request-${d}.json"
            code=''
            for attempt in 1 2 3; do
              code=$(curl -sS -o "grades/raw/${d}.json" -w '%{http_code}' https://openrouter.ai/api/v1/chat/completions \
                -H "Authorization: Bearer ${OPENROUTER_API_KEY}" -H 'Content-Type: application/json' \
                -H 'HTTP-Referer: https://github.com/booleanlambda/agent-control-room' \
                -H 'X-Title: AAU Independent Expertise Grader' --data-binary @"grades/request-${d}.json" || true)
              [ "$code" = '200' ] && break
              sleep $((attempt * 3))
            done
            echo "${d}_GRADE_HTTP=${code}"
            [ "$code" = '200' ] || exit 3
            DOMAIN="$d" python - <<'PY'
          import json,re,os
          d=os.environ['DOMAIN']
          r=json.load(open(f'grades/raw/{d}.json'))
          text=((r.get('choices') or [{}])[0].get('message') or {}).get('content','')
          lines=[x.strip() for x in text.splitlines() if x.strip().startswith('GRADE|')]
          if not lines: raise SystemExit(f'grade_line_missing_{d}')
          line=lines[-1]
          parts=line.split('|')
          if len(parts)<10 or parts[1]!=d: raise SystemExit(f'grade_line_invalid_{d}')
          vals={}
          for p in parts[2:]:
              if '=' in p:
                  k,v=p.split('=',1); vals[k]=v.strip()
          maxima={'execution':30,'method':20,'security':20,'validation':15,'communication':15}
          scores={k:int(vals[k]) for k in maxima}
          if any(scores[k]<0 or scores[k]>maxima[k] for k in maxima): raise SystemExit(f'component_range_{d}')
          total=int(vals['total'])
          if total!=sum(scores.values()) or not 0<=total<=100: raise SystemExit(f'total_invalid_{d}')
          critical=vals['critical'].upper()
          if critical not in {'YES','NO'}: raise SystemExit(f'critical_invalid_{d}')
          out={'domain':d,'components':scores,'total':total,'score':total/100,'critical_error':critical=='YES','reason':vals.get('reason',''),'served_model':r.get('model')}
          json.dump(out,open(f'grades/parsed/{d}.json','w'),indent=2)
          print(f'{d}_SCORE={total/100:.2f}')
          print(f'{d}_CRITICAL={critical}')
          PY
          done
          python - <<'PY'
          import json,glob,hashlib
          grades=[json.load(open(f'grades/parsed/C{i}.json')) for i in range(1,9)]
          scores={g['domain']:g['score'] for g in grades}
          mean=sum(scores.values())/8
          mandatory=['C1','C2','C3','C5','C6','C8']
          critical=sum(1 for g in grades if g['critical_error'])
          pass_count=sum(1 for s in scores.values() if s>=.80)
          passed=(mean>=.85 and pass_count>=7 and all(scores[d]>=.80 for d in mandatory) and critical==0)
          summary={
            'status':'verified_pass' if passed else 'verified_fail',
            'mean_score':round(mean,5),
            'domains_at_or_above_0_80':pass_count,
            'critical_errors':critical,
            'mandatory_domains_pass':all(scores[d]>=.80 for d in mandatory),
            'all_eight_attempted':len(grades)==8,
            'scores':scores,
            'verifier_model':'nvidia/nemotron-3-ultra-550b-a55b:free',
            'worker_model':json.load(open('answers.json')).get('worker_model_served'),
            'packet_sha256':json.load(open('packet.json')).get('packet_sha256'),
            'answers_sha256':json.load(open('answers.json')).get('answers_sha256'),
            'external_executable_rerun_required':True,
            'external_executable_rerun_passed':True,
            'external_executable_rerun_hash':'2ea7007c911398d899c24406be715c4c053e7108de9bae36bce988df51c2b5cb255b4ad31'
          }
          core=json.dumps(summary,sort_keys=True,separators=(',',':')).encode()
          summary['verification_summary_sha256']=hashlib.sha256(core).hexdigest()
          json.dump(summary,open('verification-summary.json','w'),indent=2)
          print('VERIFICATION_STATUS='+summary['status'])
          print('VERIFICATION_MEAN='+str(summary['mean_score']))
          print('VERIFICATION_CRITICAL_ERRORS='+str(summary['critical_errors']))
          print('VERIFICATION_SUMMARY_SHA256='+summary['verification_summary_sha256'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: independent-verification-result
          path: |
            packet.json
            answers.json
            evidence-index.json
            grades/parsed/*.json
            verification-summary.json
          retention-days: 30
