name: Migrate Expertise Verification to NVIDIA Direct

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/add-flux-render-probe.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Patch expertise verifier and workflows
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('scripts/aau_expertise_final_verification.py')
          s = path.read_text()

          start = s.index('def openrouter_call(')
          end = s.index('\ndef xkiro_call(', start)
          nvidia_call = '''def nvidia_call(key, model, system, user, max_tokens=300, temperature=0, timeout=210):
    body = {
        "model": model,
        "temperature": temperature,
        "max_tokens": max_tokens,
        "stream": False,
        "messages": [{"role": "system", "content": system}, {"role": "user", "content": user}],
    }
    if model == "z-ai/glm-5.3":
        body["chat_template_kwargs"] = {"clear_thinking": True}
    payload = json.dumps(body).encode()
    headers = {
        "Authorization": f"Bearer {key}",
        "Content-Type": "application/json",
        "Accept": "application/json",
        "User-Agent": "AAU-Expertise-Verification/0.4",
    }
    _, obj = http_json("https://integrate.api.nvidia.com/v1/chat/completions", headers=headers, payload=payload, timeout=timeout)
    msg = obj.get("choices", [{}])[0].get("message", {}) or {}
    text = msg.get("content") or msg.get("reasoning_content") or obj.get("choices", [{}])[0].get("text") or ""
    return obj, text
'''
          s = s[:start] + nvidia_call + s[end:]

          start = s.index('def list_openrouter_models():')
          end = s.index('\ndef parse_grade(', start)
          models_fn = '''def nvidia_candidate_models():
    return {
        "openai/gpt-oss-20b",
        "meta/muse-glimmer-30b",
        "z-ai/glm-5.3",
    }
'''
          s = s[:start] + models_fn + s[end:]

          # All external verifier roles now use NVIDIA direct credentials.
          s = s.replace('os.environ.get("OPENROUTER_API_KEY")', 'os.environ.get("NVIDIA_API_KEY")')
          s = s.replace('openrouter_call(', 'nvidia_call(')
          s = s.replace('list_openrouter_models()', 'nvidia_candidate_models()')

          old_task = '''    preferred = [
        "cohere/north-mini-code:free",
        "thinkingmachines/inkling:free",
        "thinkingmachines/inkling-small:free",
        "poolside/laguna-s-2.1:free",
        "google/gemma-4-31b-it:free",
        "google/gemma-4-26b-a4b-it:free",
    ]
    candidates = [m for m in preferred if m in available]
    if not candidates:
        candidates = [
            m for m in sorted(available)
            if m.endswith(":free") and not m.startswith("nvidia/") and not m.startswith("deepseek/")
        ][:12]
'''
          new_task = '''    preferred = [
        "openai/gpt-oss-20b",
        "meta/muse-glimmer-30b",
    ]
    candidates = [m for m in preferred if m in available]
'''
          if old_task not in s:
              raise SystemExit('task authority model block not found')
          s = s.replace(old_task, new_task, 1)

          s = s.replace('result["task_authority"] = {"provider": "OpenRouter", "model": used}',
                        'result["task_authority"] = {"provider": "NVIDIA Direct", "model": used}')

          s = s.replace('model = "nvidia/nemotron-3-ultra-550b-a55b:free"', 'model = "z-ai/glm-5.3"')
          s = s.replace('nvidia_call(key, model, system, user, max_tokens=260, temperature=0, reasoning_exclude=True, timeout=210)',
                        'nvidia_call(key, model, system, user, max_tokens=1024, temperature=0, timeout=210)')
          s = s.replace('"authenticator_provider": "OpenRouter"', '"authenticator_provider": "NVIDIA Direct"')

          old_adj = '''    preferred = [
        "thinkingmachines/inkling:free",
        "thinkingmachines/inkling-small:free",
        "poolside/laguna-s-2.1:free",
        "google/gemma-4-31b-it:free",
        "cohere/north-mini-code:free",
        "nex-agi/nex-n2.5-pro:free",
        "nex-agi/nex-n2.5-mini:free",
    ]
    candidates = [
        m for m in preferred
        if m in avail and m != task_model and not m.startswith("nvidia/") and not m.startswith("deepseek/")
    ]
    if not candidates:
        candidates = [
            m for m in sorted(avail)
            if m.endswith(":free") and m != task_model and not m.startswith("nvidia/") and not m.startswith("deepseek/")
        ][:12]
'''
          new_adj = '''    preferred = [
        "meta/muse-glimmer-30b",
        "openai/gpt-oss-20b",
    ]
    candidates = [m for m in preferred if m in avail and m != task_model]
'''
          if old_adj not in s:
              raise SystemExit('adjudicator model block not found')
          s = s.replace(old_adj, new_adj, 1)
          s = s.replace('nvidia_call(key, model, system, user, max_tokens=260, temperature=0, timeout=180)',
                        'nvidia_call(key, model, system, user, max_tokens=768, temperature=0, timeout=180)')

          s = s.replace('"authenticator_runtime": "OpenRouter via separate GitHub Actions job"',
                        '"authenticator_runtime": "NVIDIA direct API via separate GitHub Actions job"')
          s = s.replace('"adjudicator_runtime": "OpenRouter via separate GitHub Actions job when flagged"',
                        '"adjudicator_runtime": "NVIDIA direct API via separate GitHub Actions job when flagged"')

          path.write_text(s)

          # Construct this string instead of embedding a GitHub expression in the workflow's run block.
          nvidia_secret_ref = '$' + '{{ secrets.NVIDIA_API_KEY }}'
          workflow_paths = [
              Path('.github/workflows/expertise-final-verification.yml'),
              Path('.github/workflows/expertise-final-verification-resume.yml'),
              Path('.github/workflows/expertise-final-grading-resume.yml'),
          ]
          for wp in workflow_paths:
              w = wp.read_text()
              w = re.sub(r'^\s*OPENROUTER_API_KEY:\s*\$\{\{\s*secrets\.OPEN_ROUTER_(?:AUTHENTICATOR|ADJUDICATOR)\s*\}\}\s*$',
                         '      NVIDIA_API_KEY: ' + nvidia_secret_ref,
                         w, flags=re.M)
              w = w.replace('${OPENROUTER_API_KEY:-}', '${NVIDIA_API_KEY:-}')
              wp.write_text(w)
          PY

          python -m py_compile scripts/aau_expertise_final_verification.py

          if grep -R -n -E 'openrouter\.ai|OPENROUTER_API_KEY|OPEN_ROUTER_AUTHENTICATOR|OPEN_ROUTER_ADJUDICATOR|nvidia/nemotron-3-ultra-550b-a55b:free' \
            scripts/aau_expertise_final_verification.py \
            .github/workflows/expertise-final-verification.yml \
            .github/workflows/expertise-final-verification-resume.yml \
            .github/workflows/expertise-final-grading-resume.yml; then
            echo 'LEGACY_OPENROUTER_REFERENCE_FOUND=true'
            exit 1
          fi

          grep -n 'z-ai/glm-5.3' scripts/aau_expertise_final_verification.py
          grep -n 'meta/muse-glimmer-30b' scripts/aau_expertise_final_verification.py
          grep -n 'openai/gpt-oss-20b' scripts/aau_expertise_final_verification.py

      - name: Commit NVIDIA-direct verifier migration
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/aau_expertise_final_verification.py \
            .github/workflows/expertise-final-verification.yml \
            .github/workflows/expertise-final-verification-resume.yml \
            .github/workflows/expertise-final-grading-resume.yml
          git commit -m 'feat: move expertise verification to NVIDIA direct' || exit 0
          git push
