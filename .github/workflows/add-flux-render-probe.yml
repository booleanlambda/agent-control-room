name: Add FLUX Render Probe

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/add-flux-render-probe.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Add gated FLUX probe
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('workers/providers/nvidia.js')
          s = p.read_text()
          if 'export async function probeNvidiaFlux2()' not in s:
              s += r'''

export async function probeNvidiaFlux2() {
  const startedAt = Date.now();
  const config = resolveConfig();
  if (!config.apiKey) throw new Error('NVIDIA_API_KEY is not configured');

  const response = await fetch('https://ai.api.nvidia.com/v1/genai/black-forest-labs/flux.2-klein-4b', {
    method: 'POST',
    headers: {
      authorization: `Bearer ${config.apiKey}`,
      'content-type': 'application/json',
      accept: 'application/json',
      'user-agent': 'AAU-FLUX-Credit-Probe/0.1',
    },
    body: JSON.stringify({
      prompt: 'A minimal studio test image of a single blue circle centered on a plain white background.',
      width: 1024,
      height: 1024,
      samples: 1,
      seed: 1,
      steps: 1,
    }),
  });

  const raw = await response.text();
  let body = null;
  try { body = JSON.parse(raw); } catch {}
  const artifact = body?.artifacts?.[0] || body?.data?.[0] || null;
  const imagePayload = typeof artifact?.base64 === 'string'
    ? artifact.base64
    : typeof artifact?.b64_json === 'string'
      ? artifact.b64_json
      : '';
  const quotaHeaders = {};
  for (const [key, value] of response.headers.entries()) {
    if (/(rate|quota|credit|limit|remaining|reset)/i.test(key)) quotaHeaders[key] = value;
  }

  return {
    ok: response.ok,
    model: 'black-forest-labs/flux.2-klein-4b',
    http_status: response.status,
    latency_ms: Date.now() - startedAt,
    artifact_present: Boolean(artifact),
    image_payload_present: Boolean(imagePayload),
    image_payload_chars: imagePayload.length,
    quota_headers: quotaHeaders,
    error_code: body?.error?.code || body?.code || null,
    error_message: response.ok ? null : String(body?.error?.message || body?.detail || body?.message || raw).slice(0, 800),
  };
}
'''
              p.write_text(s)

          p = Path('workers/broker-bridge-start.js')
          s = p.read_text()
          marker = "const nvidiaWakeEnabled = isEnabled('AAU_NVIDIA_WAKE_ON_START');"
          if "AAU_NVIDIA_FLUX_SMOKE_TEST" not in s:
              block = r'''const fluxSmokeEnabled = isEnabled('AAU_NVIDIA_FLUX_SMOKE_TEST');

if (fluxSmokeEnabled) {
  try {
    const { probeNvidiaFlux2 } = await import('./providers/nvidia.js');
    const result = await probeNvidiaFlux2();
    console.log('AAU_NVIDIA_FLUX_SMOKE_PROBE', JSON.stringify(result));
  } catch (error) {
    console.log('AAU_NVIDIA_FLUX_SMOKE_PROBE', JSON.stringify({
      ok: false,
      model: 'black-forest-labs/flux.2-klein-4b',
      http_status: error?.status || null,
      error_name: error?.name || null,
      error_message: String(error?.message || error).slice(0, 800),
    }));
  }
}

'''
              if marker not in s:
                  raise SystemExit('startup marker not found')
              s = s.replace(marker, block + marker, 1)
              p.write_text(s)
          PY

          node --check workers/providers/nvidia.js
          node --check workers/broker-bridge-start.js

      - name: Commit probe
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add workers/providers/nvidia.js workers/broker-bridge-start.js
          git commit -m 'test: add gated NVIDIA FLUX.2 smoke probe' || exit 0
          git push
