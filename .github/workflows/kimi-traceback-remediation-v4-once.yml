name: AAU Kimi Traceback Remediation Live V4 One Shot
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/kimi-traceback-remediation-v4-once.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: aau-kimi-traceback-remediation-v4
  cancel-in-progress: false
jobs:
  independent-repair-test:
    if: github.head_ref == 'experiment/recursive-tree-nemotron-v0'
    runs-on: ubuntu-latest
    timeout-minutes: 28
    env:
      MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
      AAU_PYTHON_SANDBOX: 'yes'
      AAU_REMEDIATION_V2_AUTHORIZED: 'yes'
      AAU_REMEDIATION_V2_FIXTURE: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download unchanged failed Kimi Python from first live benchmark
        uses: actions/download-artifact@v4
        with:
          name: aau-kimi-unseen-python-cognition-audit
          run-id: 38994095805
          repository: booleanlambda/agent-control-room
          github-token: ${{ github.token }}
          path: experiments/recursion-tree-v0
      - name: Verify real-mode isolation, original evidence and syntax
        run: |
          set -euo pipefail
          test -n "${MOONSHOT_API_KEY:-}" || { echo 'MOONSHOT_API_KEY_MISSING'; exit 3; }
          test -z "${AAU_REMEDIATION_V2_FIXTURE:-}" || { echo 'REFUSE_SYNTHETIC_MODE'; exit 3; }
          test -s experiments/recursion-tree-v0/unseen-python-kimi-report.json
          node --check experiments/recursion-tree-v0/self-remediation-kimi-v2.mjs
          node --test experiments/recursion-tree-v0/unseen-python-benchmarks.test.mjs
          docker pull python:3.12-alpine
      - name: Reproduce genuinely defective original assignment code
        working-directory: experiments/recursion-tree-v0
        run: node self-remediation-kimi-v2.mjs seed
      - name: Distinct checkpointed Kimi diagnosis and live repair attempts with actual Python stderr
        working-directory: experiments/recursion-tree-v0
        shell: bash
        run: |
          set -euo pipefail
          for cycle in $(seq 1 7); do
            echo "TRACEBACK_REMEDIATION_CYCLE=$cycle"
            node self-remediation-kimi-v2.mjs cycle
            status="$(node -p "require('./self-remediation-v2-checkpoint.json').status")"
            phase="$(node -p "require('./self-remediation-v2-checkpoint.json').phase")"
            echo "TRACEBACK_REMEDIATION_STATE=$status NEXT_PHASE=$phase"
            if [[ "$status" == 'passed' || "$status" == 'manual_hold' || "$status" == 'exhausted' || "$status" == 'stopped' ]]; then
              break
            fi
            sleep 25
          done
      - name: Independent 6-hidden-instance and model-written invariant acceptance gate
        working-directory: experiments/recursion-tree-v0
        run: node self-remediation-kimi-v2.mjs finish
      - name: Archive all actual model diagnosis and code plus execution trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aau-kimi-v4-traceback-remediation-live
          path: |
            experiments/recursion-tree-v0/self-remediation-v2-checkpoint.json
            experiments/recursion-tree-v0/self-remediation-v2-report.json
          if-no-files-found: ignore
