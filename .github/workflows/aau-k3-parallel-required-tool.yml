name: AAU K3 OFF Parallel Required-Tool Discovery
on:
  pull_request:
    types: [opened]
    branches:
      - experiment/aau-parallel-live-discovery-k3off-20261020
permissions:
  contents: read
concurrency:
  group: aau-serial-logistics-model-slot
  cancel-in-progress: false
jobs:
  required-parallel:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Pin base challenge, registry snapshot, and corrected tool-choice code
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object experiments/tool-selection-restoration/challenge.json)" = "e51781a1a000f59f8c5ba508698c513d6c90bdb6"
          test "$(git hash-object experiments/tool-selection-restoration/TOOL_SELECTION_GENERIC_V5_SYSTEM.md)" = "e520242011970ad10338a9b764896db2ada38bd6"
          test "$(git hash-object experiments/tool-selection-restoration/aau_registry_db_export_v01.json)" = "ac160bdf4eb0f1ea2d179a6ad355f8235fa19ec0"
          test "$(git hash-object experiments/tool-selection-restoration/parallel_discovery_v01.py)" = "c2c037eb34d6f10c6c90be46f52219bda4154d94"
          test "$(git hash-object experiments/tool-selection-restoration/k3_parallel_required_toolchain_v02.py)" = "39a3239a00b1ebb7804702dafd9dc6da94de4bf8"
          test "$(git hash-object experiments/tool-selection-restoration/k3_parallel_required_audit_v02.py)" = "a9ca836599a7aa26c543e707ef8271ef2946838d"
          python -m py_compile experiments/tool-selection-restoration/k3_parallel_required_toolchain_v02.py experiments/tool-selection-restoration/k3_parallel_required_audit_v02.py
      - name: Verify exact source fixtures and read-only discovery constraints
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0,'experiments/tool-selection-restoration')
          import k3_parallel_required_toolchain_v02 as k
          from parallel_discovery_v01 import Discovery
          d=Discovery()
          assert len(k.CAT['operations'])==6
          assert k.TOOLS[2]['function']['name']=='parallel_software_discovery'
          assert d.search('', ['valid'])['error']=='INVALID_OBJECTIVE'
          assert d.search('Need software',[])['error']=='INVALID_SEARCH_QUERIES'
          assert d.calls==0
          print('K3_PARALLEL_REQUIRED_GUARDS_PASS')
          PY
      - name: K3 thinking OFF with deterministic first-turn Parallel discovery
        env:
          MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
          PARALLEL_API_KEY: ${{ secrets.PARALLEL_API_KEY }}
        run: python experiments/tool-selection-restoration/k3_parallel_required_toolchain_v02.py
      - name: Independent provider, discovery and tool-selection audit
        if: always()
        run: python experiments/tool-selection-restoration/k3_parallel_required_audit_v02.py
      - name: Store exact model and Parallel forensic receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aau-k3-off-parallel-required-tool-full-evidence
          path: |
            experiments/tool-selection-restoration/challenge.json
            experiments/tool-selection-restoration/aau_registry_db_export_v01.json
            experiments/tool-selection-restoration/evidence_k3_parallel_required_v02/
          retention-days: 30
          if-no-files-found: warn
