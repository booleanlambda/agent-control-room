name: AAU One-Time Kimi Unseen Python Cognition

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/unseen-python-once.yml'

permissions:
  contents: read

jobs:
  isolated-kimi-self-authored-python:
    if: github.head_ref == 'experiment/recursive-tree-nemotron-v0'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
      AAU_UNSEEN_COGNITION_EXPERIMENT: 'yes'
      AAU_PYTHON_SANDBOX: 'yes'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify six sealed instances and sandbox code
        run: |
          set -euo pipefail
          test -n "${MOONSHOT_API_KEY:-}" || { echo 'MOONSHOT_CREDENTIAL_MISSING'; exit 1; }
          node --check experiments/recursion-tree-v0/unseen-python-live.mjs
          node --check experiments/recursion-tree-v0/unseen-python-sandbox.mjs
          node --test experiments/recursion-tree-v0/unseen-python-benchmarks.test.mjs
      - name: Pull standard Python image before timed execution
        run: |
          docker pull python:3.12-alpine
          docker image inspect python:3.12-alpine >/dev/null
      - name: Kimi K2.6 authors Python solvers; hidden cases sealed from model
        working-directory: experiments/recursion-tree-v0
        run: node unseen-python-live.mjs
      - name: Preserve all source code, tool actions, hidden graders and billable usage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aau-kimi-unseen-python-cognition-audit
          path: experiments/recursion-tree-v0/unseen-python-kimi-report.json
          if-no-files-found: ignore
