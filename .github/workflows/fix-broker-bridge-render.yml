name: Fix Render Broker Bridge

on:
  push:
    paths:
      - '.github/workflows/fix-broker-bridge-render.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch import collision and verify syntax
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('workers/broker-bridge-render.js')
          s=p.read_text()
          s=s.replace("import http from 'node:http';", "import httpServer from 'node:http';")
          s=s.replace('http.createServer(', 'httpServer.createServer(')
          p.write_text(s)
          PY
          node --check workers/broker-bridge-render.js
      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add workers/broker-bridge-render.js
          git diff --cached --quiet && exit 0
          git commit -m 'fix: resolve Render broker bridge http symbol collision'
          git push
