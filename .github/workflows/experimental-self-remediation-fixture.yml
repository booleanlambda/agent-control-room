name: AAU Free Self-Remediation Protocol End-to-End

on:
  push:
    branches: [experiment/recursive-tree-nemotron-v0]
    paths:
      - 'experiments/recursion-tree-v0/self-remediation-v2-*.mjs'
      - 'experiments/recursion-tree-v0/self-remediation-kimi-v2.mjs'
      - '.github/workflows/experimental-self-remediation-fixture.yml'
      - 'experiments/recursion-tree-v0/unseen-failure-*.mjs'
  pull_request:
    branches: [main]
    paths:
      - 'experiments/recursion-tree-v0/self-remediation-v2-*.mjs'
      - 'experiments/recursion-tree-v0/self-remediation-kimi-v2.mjs'
      - '.github/workflows/experimental-self-remediation-fixture.yml'
      - 'experiments/recursion-tree-v0/unseen-failure-*.mjs'

permissions:
  contents: read
  actions: read

jobs:
  disposable-multiprocess-replay:
    if: github.head_ref == 'experiment/recursive-tree-nemotron-v0' || github.ref_name == 'experiment/recursive-tree-nemotron-v0'
    runs-on: ubuntu-latest
    timeout-minutes: 13
    env:
      GITHUB_ACTIONS: 'true'
      AAU_PYTHON_SANDBOX: 'yes'
      AAU_NO_PROVIDER_NETWORK: 'yes'
      AAU_REMEDIATION_V2_AUTHORIZED: ''
      MOONSHOT_API_KEY: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch exact historical failed Kimi code, never a repaired stand-in
        uses: actions/download-artifact@v4
        with:
          name: aau-kimi-unseen-python-cognition-audit
          run-id: 38994095805
          repository: booleanlambda/agent-control-room
          github-token: ${{ github.token }}
          path: experiments/recursion-tree-v0
      - name: Retrieve immutable Kimi V3 crashed-program evidence
        uses: actions/download-artifact@v4
        with:
          name: aau-kimi-self-remediation-v3-live-evidence
          run-id: 39025542225
          repository: booleanlambda/agent-control-room
          github-token: ${{ github.token }}
          path: experiments/recursion-tree-v0/prior-v3
      - name: Read-only retrieve immutable Kimi V5 validated algorithm and faulty self-test
        uses: actions/download-artifact@v4
        with:
          name: aau-kimi-direct-traceback-real-repair-evidence
          run-id: 39038175797
          repository: booleanlambda/agent-control-room
          github-token: ${{ github.token }}
          path: experiments/recursion-tree-v0/prior-v5
      - name: Retrieve immutable V6 Kimi-written corrected verification script
        uses: actions/download-artifact@v4
        with:
          name: aau-kimi-tests-only-live-remediation-evidence
          run-id: 39039858401
          repository: booleanlambda/agent-control-room
          github-token: ${{ github.token }}
          path: experiments/recursion-tree-v0/prior-v6
      - name: Check all fixture paths and no provider credentials
        run: |
          set -euo pipefail
          test -z "${MOONSHOT_API_KEY:-}"
          test -z "${AAU_REMEDIATION_V2_AUTHORIZED:-}"
          test -s experiments/recursion-tree-v0/unseen-python-kimi-report.json
          node --check experiments/recursion-tree-v0/self-remediation-v2-fixtures.mjs
          node --check experiments/recursion-tree-v0/self-remediation-kimi-v2.mjs
          node --check experiments/recursion-tree-v0/self-remediation-v2-fixture-integration.mjs
          node --check experiments/recursion-tree-v0/self-remediation-direct-traceback-fixture.mjs
          node --check experiments/recursion-tree-v0/self-remediation-tests-only-fixture.mjs
          node --check experiments/recursion-tree-v0/self-remediation-tests-only-adversarial.mjs
          node --check experiments/recursion-tree-v0/unseen-failure-fixtures.mjs
          node --check experiments/recursion-tree-v0/unseen-failure-live.mjs
          node --test experiments/recursion-tree-v0/unseen-python-benchmarks.test.mjs
          docker pull python:3.12-alpine
      - name: Eight genuine Docker and independent-process remediation replay scenarios
        working-directory: experiments/recursion-tree-v0
        run: node self-remediation-v2-fixture-integration.mjs
      - name: Verify DIRECT traceback-to-repair entry using real failed Kimi V3 source, synthetic response, and Docker
        working-directory: experiments/recursion-tree-v0
        run: node self-remediation-direct-traceback-fixture.mjs
      - name: Verify model-written solver remains frozen while replacing only Kimi's false-negative self-test
        working-directory: experiments/recursion-tree-v0
        run: node self-remediation-tests-only-fixture.mjs
      - name: Adversarially audit genuine Kimi-authored self-tests on 7 problems and 21 mutant witnesses
        working-directory: experiments/recursion-tree-v0
        run: node self-remediation-tests-only-adversarial.mjs
      - name: Validate two new genuinely failing Python seeds and independent public hidden exact oracles
        working-directory: experiments/recursion-tree-v0
        run: node unseen-failure-live.mjs preflight
      - name: Archive synthetic vs live provenance and recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aau-remediation-no-provider-protocol-evidence
          path: |
            experiments/recursion-tree-v0/self-remediation-v2-fixture-evidence.json
            experiments/recursion-tree-v0/test-only-kimi-adversarial-audit.json
            experiments/recursion-tree-v0/unseen-failure-kimi-report.json
          if-no-files-found: ignore
