<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AAU Agent Control Room</title>
<style>
:root{--bg:#070a0f;--panel:#0d121b;--line:#202b3b;--text:#edf3fb;--muted:#8fa0b7;--accent:#7dd3fc;--good:#5ee6a8;--warn:#f5c45e;--bad:#ff7b88}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#070a0f;color:var(--text);font-family:Inter,system-ui,sans-serif}.wrap{max-width:1500px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;gap:18px;align-items:flex-start}.top h1{margin:0;font-size:28px}.sub,.muted{color:var(--muted);font-size:12px}.live{display:flex;gap:8px;align-items:center;color:var(--muted)}.dot{width:9px;height:9px;border-radius:50%;background:var(--good)}.dot.bad{background:var(--bad)}.banner{margin:16px 0;padding:13px 15px;border:1px solid rgba(94,230,168,.35);background:rgba(94,230,168,.06);border-radius:14px}.banner.bad{border-color:rgba(255,123,136,.4);background:rgba(255,123,136,.08)}.banner strong{font-size:13px}.metrics{display:grid;grid-template-columns:repeat(6,1fr);gap:11px;margin:14px 0}.metric,.panel,.card{background:var(--panel);border:1px solid var(--line);border-radius:15px}.metric{padding:14px}.k{font-size:9px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}.v{font-size:18px;font-weight:700;margin-top:6px;overflow-wrap:anywhere}.s{font-size:10px;color:var(--muted);margin-top:4px}.system{display:grid;grid-template-columns:1.3fr .7fr;gap:12px}.panel{padding:15px}.panel h2{margin:0 0 11px;font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.kv>div{background:#0a1018;border:1px solid #192434;border-radius:10px;padding:9px}.good{color:var(--good)}.warn{color:var(--warn)}.badtext{color:var(--bad)}.mono{font-family:ui-monospace,monospace;font-size:11px}.focus-name{font-size:21px;font-weight:750}.focus-model{font-size:11px;color:var(--accent);margin:6px 0;overflow-wrap:anywhere}.reason{font-size:12px;line-height:1.5;color:#c5d0de;margin-top:8px}.toolbar{display:flex;gap:9px;margin:16px 0}.toolbar input,.toolbar select,.toolbar button{background:#0d121b;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px}.toolbar input{flex:1}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{padding:14px;text-align:left;color:inherit;cursor:pointer}.card.current{border-color:rgba(125,211,252,.5)}.head{display:flex;justify-content:space-between;gap:10px}.name{font-weight:700}.pill{font-size:9px;border:1px solid var(--line);border-radius:999px;padding:4px 7px;color:var(--muted)}.pill.current{color:var(--accent)}.pill.paused{color:var(--warn)}.action{font-size:12px;color:#cbd6e5;line-height:1.45;margin:12px 0;min-height:36px}.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.mini>div{background:#0a1018;border:1px solid #192434;border-radius:8px;padding:7px}.error{display:none;margin:12px 0;padding:10px;border:1px solid rgba(255,123,136,.4);border-radius:10px;color:#ffc2c8}.login{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:#070a0f}.loginbox{width:min(420px,92vw);padding:22px;background:#0d121b;border:1px solid var(--line);border-radius:16px}.loginbox input,.loginbox button{width:100%;padding:11px;margin-top:9px;border-radius:10px;border:1px solid var(--line);background:#080d14;color:var(--text)}.drawerbg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:30}.drawer{position:fixed;right:0;top:0;height:100vh;width:min(720px,96vw);background:#090e15;border-left:1px solid var(--line);z-index:31;transform:translateX(105%);transition:.2s;overflow:auto;padding:22px}.drawer.open{transform:none}.drawerbg.open{display:block}.close{float:right;background:#111824;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px 11px}.timeline{display:flex;flex-direction:column;gap:8px;margin-top:12px}.event{background:#0d141e;border:1px solid #192638;border-radius:10px;padding:10px}.event b{font-size:12px}.event div{font-size:11px;color:#b8c5d6;margin-top:4px;white-space:pre-wrap}.empty{padding:35px;text-align:center;color:var(--muted)}
@media(max-width:1050px){.metrics{grid-template-columns:repeat(3,1fr)}.system{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:650px){.wrap{padding:15px}.metrics{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.kv{grid-template-columns:1fr}.toolbar{flex-wrap:wrap}.toolbar input{flex-basis:100%}}
</style></head><body>
<div class="login" id="login"><div class="loginbox"><h2>AAU Agent Control Room</h2><div class="sub">Read-only operator view of the current autonomous lifecycle and paused population.</div><input id="pw" type="password" placeholder="Control Room password"><button id="loginBtn">Open Control Room</button><div id="loginMsg" class="badtext"></div></div></div>
<div class="wrap"><div class="top"><div><h1>AAU Agent Control Room</h1><div class="sub">Live experimental runtime truth</div></div><div class="live"><span id="dot" class="dot"></span><span id="liveText">Locked</span></div></div><div id="error" class="error"></div><div id="banner" class="banner"></div><div id="metrics" class="metrics"></div><div class="system"><section class="panel"><h2>Runtime</h2><div id="runtime" class="kv"></div></section><section class="panel"><h2>Current agent</h2><div id="experiment"></div></section></div><div class="toolbar"><input id="search" placeholder="Search agents…"><select id="filter"><option value="current">Current experiment</option><option value="paused">Paused population</option><option value="all">All agents</option><option value="archived">Archived</option></select><button id="refresh">Refresh</button></div><div id="grid" class="grid"></div></div>
<div id="drawerbg" class="drawerbg"></div><aside id="drawer" class="drawer"><button id="close" class="close">×</button><div id="drawerbody"></div></aside>
<script>
const API='https://mgtilfgygzymxiyixjit.supabase.co/functions/v1/agent-control-room-api';const st={pw:null,snap:null,sys:null,filter:'current',q:'',timer:null};const $=x=>document.querySelector(x);const esc=x=>String(x??'');const nice=x=>esc(x).replace(/^agent_/,'Agent ').split('_').map(y=>y.charAt(0).toUpperCase()+y.slice(1)).join(' ');const fmt=x=>Number.isFinite(Number(x))?Number(x).toLocaleString():'—';const when=x=>x?new Date(x).toLocaleString():'none';const rel=x=>{if(!x)return'none';let s=(new Date(x)-Date.now())/1000,a=Math.abs(s),v,u;if(a<60){v=Math.round(a);u='sec'}else if(a<3600){v=Math.round(a/60);u='min'}else if(a<86400){v=Math.round(a/3600);u='hr'}else{v=Math.round(a/86400);u='day'}return s>=0?`in ${v} ${u}${v===1?'':'s'}`:`${v} ${u}${v===1?'':'s'} ago`};
function auth(){return'Basic '+btoa('operator:'+st.pw)}async function api(q){const r=await fetch(API+'?'+q,{headers:{Authorization:auth()},cache:'no-store'});if(r.status===401)throw new Error('Invalid password');if(!r.ok)throw new Error('Request failed: '+r.status);return r.json()}function box(k,v,s=''){const d=document.createElement('div');d.innerHTML=`<div class="k">${esc(k)}</div><div class="v ${s}">${esc(v)}</div>`;return d}function metric(k,v,s){const d=box(k,v);d.className='metric';d.insertAdjacentHTML('beforeend',`<div class="s">${esc(s)}</div>`);return d}function currentId(){return st.sys?.current_agent?.agent_id}
function render(){const s=st.sys||{},w=s.wake_loop||{},a=s.current_agent||{},run=a.autonomous_run||{},next=a.next_wake_queue?.due_at||a.next_wake_intent?.wake_at||run.next_wake_at;const healthy=w.state==='running';$('#banner').className='banner'+(healthy?'':' bad');$('#banner').innerHTML=`<strong>${healthy?'Autonomous lifecycle running':'Autonomous lifecycle requires attention'}</strong><div class="sub">${esc(w.reason||(w.rabbitmq_wake_consumer_bound?'RabbitMQ consumer live.':'Rabbit wake armed; worker can hibernate and will be revived near the due wake.'))}</div>`;$('#dot').className='dot'+(healthy?'':' bad');$('#metrics').replaceChildren(metric('Current agent',nice(a.internal_label),'isolated experiment'),metric('Wake count',fmt(run.wake_count),'autonomous lifecycle'),metric('Model','Nemotron 3.5 Lightning',a.consistency_status||'—'),metric('Other agents paused',fmt(s.population?.other_agents_paused),'global pause remains on'),metric('Next wake',next?rel(next):'none',when(next)),metric('Wake loop',esc(w.state||'unknown').toUpperCase(),w.rabbitmq_wake_consumer_bound?'worker live':w.worker_hibernation_safe?'armed + revivable':'execution path unavailable'));
const r=$('#runtime');r.replaceChildren(box('Runtime mode',s.runtime_mode||'—'),box('Provider',s.experimental_runtime?.provider||'—',s.experimental_runtime?.provider==='nvidia_direct'?'good':''),box('Production use',s.experimental_runtime?.production_use?'YES':'NO'),box('Global population pause',s.global_population_pause?'ON':'OFF',s.global_population_pause?'warn':'good'),box('Legacy executor',s.normal_executor_enabled?'ON':'OFF'),box('Wake route',w.routing_key||'—','mono'),box('Rabbit message armed',w.rabbit_wake_armed?'YES':'NO',w.rabbit_wake_armed?'good':'warn'),box('Worker now',w.rabbitmq_wake_consumer_bound?'LIVE':w.worker_hibernation_safe?'HIBERNATING / REVIVABLE':'OFFLINE',w.rabbitmq_wake_consumer_bound||w.worker_hibernation_safe?'good':'badtext'),box('Liveness bridge',w.liveness_bridge||'none','mono'),box('Lifecycle monitor',s.cron?.lifecycle_monitor?'ON':'OFF',s.cron?.lifecycle_monitor?'good':'badtext'),box('Old wake cron',s.cron?.wake_activator?'ON':'OFF'),box('Old executor cron',s.cron?.legacy_wake_executor?'ON':'OFF'));
const e=$('#experiment'),lc=a.last_cognition||{};e.innerHTML=`<div class="focus-name">${nice(a.internal_label||'—')}</div><div class="focus-model">${esc(a.primary_model_id||'—')}</div><div class="reason"><b>${esc(lc.selected_action||'No cognition yet')}</b><br>${esc(lc.output_summary?.stated_reason||'')}</div><div class="reason ${next?'good':'badtext'}">${next?'Next wake: '+when(next):'No next wake scheduled'}</div>`;renderGrid();$('#liveText').textContent='Live · '+new Date(s.generated_at||Date.now()).toLocaleTimeString()}
function status(a){if(a.lifecycle_status==='archived')return['Archived',''];if(a.agent_id===currentId())return['Autonomous','current'];return st.sys?.global_population_pause?['Paused','paused']:['Idle','']}function renderGrid(){let xs=[...(st.snap?.agents||[])],q=st.q.toLowerCase();if(q)xs=xs.filter(a=>[a.internal_label,a.current_focus,a.last_action].some(v=>esc(v).toLowerCase().includes(q)));if(st.filter==='current')xs=xs.filter(a=>a.agent_id===currentId());if(st.filter==='paused')xs=xs.filter(a=>a.lifecycle_status!=='archived'&&a.agent_id!==currentId());if(st.filter==='archived')xs=xs.filter(a=>a.lifecycle_status==='archived');const g=$('#grid');g.replaceChildren();if(!xs.length){g.innerHTML='<div class="empty">No agents match this view.</div>';return}for(const a of xs){const [label,cls]=status(a),c=document.createElement('button');c.className='card '+(a.agent_id===currentId()?'current':'');c.innerHTML=`<div class="head"><div class="name">${nice(a.internal_label)}</div><span class="pill ${cls}">${label}</span></div><div class="action">${esc(a.last_action||a.current_focus||'No action recorded.')}</div><div class="mini"><div><div class="k">Wake</div><div class="v">${fmt(a.wake_number)}</div></div><div><div class="k">Compute</div><div class="v">${fmt(a.resources?.compute?.balance)}</div></div><div><div class="k">Activity</div><div class="v" style="font-size:11px">${a.last_activity_at?rel(a.last_activity_at):'—'}</div></div></div>`;c.onclick=()=>openAgent(a.agent_id);g.append(c)}}
async function refresh(silent=false){try{[st.snap,st.sys]=await Promise.all([api('mode=snapshot&_='+Date.now()),api('mode=system&_='+Date.now())]);render();$('#error').style.display='none'}catch(e){if(!silent){$('#error').textContent=e.message;$('#error').style.display='block'}$('#liveText').textContent='Connection issue'}}async function openAgent(id){$('#drawerbg').classList.add('open');$('#drawer').classList.add('open');$('#drawerbody').innerHTML='<div class="empty">Loading…</div>';try{const d=await api('mode=agent&id='+encodeURIComponent(id)+'&_='+Date.now()),a=d.status||{};let html=`<h2>${nice(a.internal_label||'agent')}</h2><div class="sub">${status(a)[0]}</div><div class="kv" style="margin-top:15px"><div><div class="k">Wake</div><div class="v">${fmt(a.wake_number)}</div></div><div><div class="k">Energy</div><div class="v">${fmt((a.energy||0)*100)}%</div></div><div><div class="k">Curiosity</div><div class="v">${fmt((a.curiosity||0)*100)}%</div></div></div><h3>Timeline</h3><div class="timeline">`;for(const ev of d.timeline||[])html+=`<div class="event"><b>${esc(ev.title||ev.event_kind)}</b><div>${esc(ev.detail||'')}</div><div>${when(ev.occurred_at)}</div></div>`;html+='</div>';$('#drawerbody').innerHTML=html}catch(e){$('#drawerbody').textContent=e.message}}
async function login(){st.pw=$('#pw').value;$('#loginMsg').textContent='Checking…';try{await api('mode=system');sessionStorage.setItem('aau_control_room_password',st.pw);$('#login').style.display='none';$('#loginMsg').textContent='';await refresh();st.timer=setInterval(()=>{if(!document.hidden)refresh(true)},15000)}catch(e){st.pw=null;$('#loginMsg').textContent=e.message}}$('#loginBtn').onclick=login;$('#pw').onkeydown=e=>{if(e.key==='Enter')login()};$('#refresh').onclick=()=>refresh();$('#filter').onchange=e=>{st.filter=e.target.value;renderGrid()};$('#search').oninput=e=>{st.q=e.target.value;renderGrid()};$('#close').onclick=$('#drawerbg').onclick=()=>{$('#drawerbg').classList.remove('open');$('#drawer').classList.remove('open')};const saved=sessionStorage.getItem('aau_control_room_password');if(saved){st.pw=saved;api('mode=system').then(()=>{$('#login').style.display='none';refresh();st.timer=setInterval(()=>{if(!document.hidden)refresh(true)},15000)}).catch(()=>sessionStorage.removeItem('aau_control_room_password'))}
</script></body></html>
