<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AAU Agent Control Room</title>
<style>
:root{--bg:#070a0f;--panel:#0e1520;--line:#223147;--text:#edf3fb;--muted:#8ea0b7;--accent:#7dd3fc;--good:#62e6aa;--warn:#f4c66a;--bad:#ff7f8d;--violet:#b9a8ff}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% -10%,#172b44,transparent 32%),var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;min-height:100vh}
button,input,textarea,select{font:inherit}.wrap{max-width:1480px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}.top h1{margin:0;font-size:27px}.sub,.muted{color:var(--muted);font-size:12px}.live{display:flex;gap:8px;align-items:center;color:var(--muted)}.dot{width:9px;height:9px;border-radius:50%;background:var(--good);box-shadow:0 0 14px rgba(98,230,170,.7)}.dot.bad{background:var(--bad)}
.banner,.panel,.card,.metric{background:linear-gradient(180deg,rgba(16,24,36,.97),rgba(9,14,22,.97));border:1px solid var(--line);border-radius:14px}.banner{margin:14px 0;padding:12px 14px;border-color:rgba(98,230,170,.35)}.banner.bad{border-color:rgba(255,127,141,.45)}.error{display:none;color:#ffc1c8;margin:10px 0}
.metrics{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin:14px 0}.metric{padding:12px}.k{font-size:9px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}.v{font-size:18px;font-weight:750;margin-top:5px;overflow-wrap:anywhere}.s{font-size:10px;color:var(--muted);margin-top:4px}
.system{display:grid;grid-template-columns:1.1fr .9fr;gap:12px}.panel{padding:14px}.panel h2,h3{margin:0 0 10px;font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}h3{margin-top:20px}.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.kv>div{background:#0a1018;border:1px solid #192638;border-radius:9px;padding:8px}.good{color:var(--good)}.warn{color:var(--warn)}.badtext{color:var(--bad)}.accent{color:var(--accent)}.mono{font-family:ui-monospace,monospace}
.toolbar,.controls,.actionrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.toolbar{margin:15px 0}.toolbar input{flex:1}.toolbar input,.toolbar select,.toolbar button,.controlbtn,.sendbtn,.filebtn{background:#0d1420;color:var(--text);border:1px solid var(--line);border-radius:9px;padding:9px 10px}.controlbtn,.sendbtn,.filebtn,.toolbar button{cursor:pointer}.controlbtn.pause{color:var(--warn);border-color:rgba(244,198,106,.5)}.controlbtn.unpause{color:var(--good);border-color:rgba(98,230,170,.5)}button:disabled{opacity:.45;cursor:not-allowed}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}.card{padding:13px;cursor:pointer}.card.current{border-color:rgba(125,211,252,.5)}.head{display:flex;justify-content:space-between;gap:10px}.name{font-weight:750}.internal{font-size:10px;color:var(--muted);margin-top:2px}.pill{font-size:9px;border:1px solid var(--line);border-radius:999px;padding:4px 7px;color:var(--muted);white-space:nowrap}.pill.current{color:var(--accent)}.pill.paused{color:var(--warn)}.pill.sleeping{color:var(--violet)}.action{font-size:12px;color:#c7d2df;line-height:1.45;margin:10px 0;min-height:34px}.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.mini>div{background:#0a1018;border:1px solid #192638;border-radius:8px;padding:7px}.nextline{margin-top:8px;border-top:1px solid #172231;padding-top:8px;font-size:10px;color:var(--muted)}
.identity{display:flex;gap:11px;align-items:center}.avatar{width:58px;height:58px;border-radius:50%;object-fit:cover;border:1px solid #31435b;background:#0a1018;flex:none}.avatar.lg{width:74px;height:74px}.avatarph{display:grid;place-items:center;color:var(--muted);font-weight:700}.focus-name{font-size:22px;font-weight:760}.focus-label,.profile-state{font-size:10px;color:var(--muted)}.focus-model{font-size:11px;color:var(--accent);margin-top:5px;overflow-wrap:anywhere}.stage{display:inline-block;margin-top:6px;border:1px solid #31435b;border-radius:999px;padding:4px 8px;font-size:10px;color:var(--violet)}.reason{font-size:12px;line-height:1.5;color:#c6d1df;margin-top:8px}
.login{position:fixed;inset:0;z-index:40;background:#070a0f;display:grid;place-items:center}.loginbox{width:min(420px,92vw);padding:22px;background:#0d1420;border:1px solid var(--line);border-radius:16px}.loginbox input,.loginbox button{width:100%;margin-top:9px;padding:11px;border-radius:9px;border:1px solid var(--line);background:#080d14;color:var(--text)}
.drawerbg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:30}.drawerbg.open{display:block}.drawer{position:fixed;right:0;top:0;height:100vh;width:min(840px,97vw);background:#090e15;border-left:1px solid var(--line);z-index:31;transform:translateX(105%);transition:.2s;overflow:auto;padding:20px}.drawer.open{transform:none}.close{float:right;background:#111a27;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:7px 10px;cursor:pointer}
.chat{border:1px solid #1b2a3d;border-radius:12px;background:#080d14;overflow:hidden}.chatlog{max-height:360px;overflow:auto;padding:11px;display:flex;flex-direction:column;gap:9px}.msg{max-width:88%;padding:9px 10px;border-radius:11px;font-size:12px;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere}.msg.admin{align-self:flex-end;background:#10253a;border:1px solid #1d4768}.msg.agent{align-self:flex-start;background:#151c26;border:1px solid #263244}.msgmeta{font-size:9px;color:var(--muted);margin-top:5px}.attachments{display:flex;flex-wrap:wrap;gap:7px;margin-top:7px}.attachment{border:1px solid #304159;border-radius:9px;background:#0c1320;padding:7px;max-width:260px}.attachment img{display:block;max-width:220px;max-height:150px;border-radius:7px;margin-bottom:6px}.attachment button{background:none;border:0;color:var(--accent);padding:0;cursor:pointer;text-align:left}.attmeta{font-size:9px;color:var(--muted);margin-top:3px}.composer{border-top:1px solid #1b2a3d;padding:10px;display:grid;grid-template-columns:1fr auto;gap:8px}.composer textarea{min-height:62px;max-height:180px;resize:vertical;background:#0d1420;color:var(--text);border:1px solid var(--line);border-radius:9px;padding:9px}.sendbtn{color:var(--accent);border-color:rgba(125,211,252,.45);min-width:90px}
.uploadbox{border:1px dashed #344860;border-radius:11px;padding:10px;background:#0a1018;margin-top:10px}.uploadgrid{display:grid;grid-template-columns:1fr 180px;gap:8px}.uploadgrid input,.uploadgrid select,.uploadgrid textarea{width:100%;background:#0d1420;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px}.uploadgrid textarea{grid-column:1/-1;min-height:56px;resize:vertical}.filebtn{color:var(--good);border-color:rgba(98,230,170,.45)}.uploadstatus{font-size:10px;color:var(--muted);margin-top:7px}
.filelist{display:flex;flex-direction:column;gap:7px}.fileitem{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;background:#0d141e;border:1px solid #1b2a3d;border-radius:9px;padding:9px}.fileitem button{background:none;border:0;color:var(--accent);padding:0;cursor:pointer;text-align:left}.filetag{font-size:9px;border:1px solid #304159;border-radius:999px;padding:3px 6px;color:var(--muted)}.empty{padding:18px;text-align:center;color:var(--muted)}.timeline{display:flex;flex-direction:column;gap:7px}.event{background:#0d141e;border:1px solid #1b2a3d;border-radius:9px;padding:9px}.event b{font-size:12px}.event div{font-size:11px;color:#b8c5d6;margin-top:4px;white-space:pre-wrap}
@media(max-width:1050px){.metrics{grid-template-columns:repeat(3,1fr)}.system{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:650px){.wrap{padding:14px}.metrics{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.kv{grid-template-columns:1fr}.uploadgrid{grid-template-columns:1fr}.composer{grid-template-columns:1fr}.sendbtn{width:100%}}
</style>
</head>
<body>
<div class="login" id="login"><div class="loginbox"><h2>AAU Agent Control Room</h2><div class="sub">Admin console for autonomous agents, chat and files.</div><input id="pw" type="password" placeholder="Control Room password"><button id="loginBtn">Open Control Room</button><div id="loginMsg" class="badtext"></div></div></div>
<div class="wrap">
  <div class="top"><div><h1>AAU Agent Control Room</h1><div class="sub">Next Intent · lifecycle · existence · expertise · admin chat · bidirectional files</div></div><div class="live"><span id="dot" class="dot"></span><span id="liveText">Locked</span></div></div>
  <div id="error" class="error"></div><div id="banner" class="banner"></div><div id="metrics" class="metrics"></div>
  <div class="system"><section class="panel"><h2>Runtime</h2><div id="runtime" class="kv"></div></section><section class="panel"><h2>Current agent</h2><div id="experiment"></div></section></div>
  <div class="toolbar"><input id="search" placeholder="Search agents, stage, focus or action…"><select id="filter"><option value="current">Current experiment</option><option value="paused">Paused population</option><option value="all">All agents</option><option value="archived">Archived</option></select><button id="refresh">Refresh</button></div>
  <div id="grid" class="grid"></div>
</div>
<div id="drawerbg" class="drawerbg"></div><aside id="drawer" class="drawer"><button id="close" class="close">×</button><div id="drawerbody"></div></aside>
<script>
const API='https://mgtilfgygzymxiyixjit.supabase.co/functions/v1/agent-control-room-api';
const st={pw:null,snap:null,sys:null,filter:'current',q:'',timer:null,drawerAgentId:null,drawerTimer:null,drawerMountedFor:null};
const $=x=>document.querySelector(x), raw=x=>String(x??''), esc=x=>raw(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nice=x=>raw(x).replace(/^agent_/,'Agent ').split('_').map(y=>y.charAt(0).toUpperCase()+y.slice(1)).join(' ');
const when=x=>x?new Date(x).toLocaleString():'none', rel=x=>{if(!x)return'none';const s=(new Date(x)-Date.now())/1000,a=Math.abs(s);let v,u;if(a<60){v=Math.round(a);u='sec'}else if(a<3600){v=Math.round(a/60);u='min'}else if(a<86400){v=Math.round(a/3600);u='hr'}else{v=Math.round(a/86400);u='day'}return s>=0?`in ${v} ${u}${v===1?'':'s'}`:`${v} ${u}${v===1?'':'s'} ago`};
const fmt=x=>Number.isFinite(Number(x))?Number(x).toLocaleString():'—';
function auth(){return'Basic '+btoa('operator:'+st.pw)}
async function api(q,{method='GET',body=null,form=null}={}){const headers={Authorization:auth()};if(body)headers['content-type']='application/json';const r=await fetch(API+'?'+q,{method,headers,body:form|| (body?JSON.stringify(body):null),cache:'no-store'});let d=null;try{d=await r.json()}catch{}if(r.status===401)throw new Error('Invalid password');if(!r.ok)throw new Error(d?.detail||d?.error||('Request failed: '+r.status));return d}
function showError(m){const e=$('#error');e.textContent=m;e.style.display='block';setTimeout(()=>{e.style.display='none'},7000)}
function displayName(a){return a?.public_name||nice(a?.internal_label||'—')}
function avatar(a,cls=''){const n=displayName(a),u=a?.pseudo_profile_image_url;if(u)return `<img class="avatar ${cls}" src="${esc(u)}" alt="${esc(n)}">`;return `<div class="avatar avatarph ${cls}">${esc((n||'?')[0]||'?')}</div>`}
function isPaused(a){return Boolean(a?.system_paused)||a?.autonomous_lifecycle?.status==='paused'||a?.lifecycle_run_status==='paused'||a?.operator_pause===true}
function currentId(){return st.sys?.current_agent?.agent_id}
function nextAt(a){return a?.next_intent?.execute_at||a?.next_intent_execution?.execute_at||a?.next_time_intent_at||a?.next_queued_execute_at||a?.autonomous_run?.next_intent_at||a?.next_wake_at}
function status(a){if(a?.lifecycle_status==='archived')return['Archived',''];if(isPaused(a))return['Paused','paused'];if(a?.sleeping)return['Sleeping','sleeping'];if(a?.agent_id===currentId())return['Autonomous','current'];return['Idle','']}
function controlsHtml(a,p=''){const paused=isPaused(a);return `<div class="controls"><button class="controlbtn pause" id="${p}pauseBtn" ${paused?'disabled':''}>Pause</button><button class="controlbtn unpause" id="${p}unpauseBtn" ${paused?'':'disabled'}>Unpause</button></div>`}
async function controlAgent(id,action){if(action==='pause'&&!confirm('Pause this agent? Active intents will be cancelled and the existence levy frozen.'))return;try{await api('mode=control',{method:'POST',body:{id,action,reason:'agent_control_room_admin_'+action}});await refresh(true);if(st.drawerAgentId===id)await reloadDrawer(id,false)}catch(e){showError(e.message)}}
function bindControls(a,p=''){const x=document.getElementById(p+'pauseBtn'),y=document.getElementById(p+'unpauseBtn');if(x)x.onclick=()=>controlAgent(a.agent_id,'pause');if(y)y.onclick=()=>controlAgent(a.agent_id,'unpause')}
function metric(k,v,s=''){return `<div class="metric"><div class="k">${esc(k)}</div><div class="v">${esc(v)}</div><div class="s">${esc(s)}</div></div>`}
function render(){
 const agents=st.snap?.agents||[], cur=st.sys?.current_agent||{}, exp=st.sys?.experimental_runtime||{};
 $('#banner').innerHTML=`<b>AAU live.</b> <span class="muted">File channel ${esc(st.sys?.file_channel_version||'agent_file_channel_v0_1')} · brain packet ${esc(exp.brain_packet_version||cur.brain_packet_version||'—')}</span>`;
 $('#metrics').innerHTML=[metric('Agents',agents.length,'known population'),metric('Current',cur.public_name||cur.internal_label||'—',cur.current_stage||''),metric('Compute',fmt(cur.compute_balance??cur.compute_credits),'current balance'),metric('Wakes',fmt(cur.wake_number??cur.intent_execution_count),'executions'),metric('Stage',nice(cur.current_stage||'—'),'mandatory lifecycle'),metric('Next',rel(cur.next_wake_at||cur.next_intent_at),'autonomous intent')].join('');
 $('#runtime').innerHTML=[['Provider',exp.provider||cur.primary_model_provider||'—'],['Model',cur.primary_model_id||exp.model||'—'],['State',exp.state||exp.experimental_intent_loop_state||cur.lifecycle_run_status||'—'],['Intent cadence',exp.minimum_time_intent_delay_minutes?exp.minimum_time_intent_delay_minutes+' min':'5 min'],['Packet',exp.brain_packet_version||'brain_packet_v0_31'],['Files','bidirectional v0.1']].map(([k,v])=>`<div><div class="k">${esc(k)}</div><div class="v" style="font-size:12px">${esc(v)}</div></div>`).join('');
 if(cur.agent_id){$('#experiment').innerHTML=`<div class="identity">${avatar(cur,'lg')}<div><div class="focus-name">${esc(displayName(cur))}</div><div class="focus-label">${esc(cur.internal_label||'')}</div><div class="focus-model">${esc(cur.primary_model_id||'')}</div><span class="stage">${esc(nice(cur.current_stage||'—'))}</span></div></div><div class="reason">${esc(cur.last_action||cur.selected_action||cur.stated_reason||'No recent action summary.')}</div><div class="actionrow">${controlsHtml(cur,'current')}</div>`;bindControls(cur,'current')}else $('#experiment').innerHTML='<div class="empty">No current agent.</div>';
 renderGrid();
}
function filteredAgents(){let a=(st.snap?.agents||[]).slice();if(st.filter==='current')a=a.filter(x=>x.agent_id===currentId());else if(st.filter==='paused')a=a.filter(isPaused);else if(st.filter==='archived')a=a.filter(x=>x.lifecycle_status==='archived');else if(st.filter==='all')a=a.filter(x=>x.lifecycle_status!=='archived');if(st.q){const q=st.q.toLowerCase();a=a.filter(x=>JSON.stringify(x).toLowerCase().includes(q))}return a}
function renderGrid(){const a=filteredAgents();$('#grid').innerHTML=a.length?a.map(x=>{const [label,cls]=status(x);return `<div class="card ${x.agent_id===currentId()?'current':''}" data-id="${esc(x.agent_id)}"><div class="head"><div><div class="name">${esc(displayName(x))}</div><div class="internal">${esc(x.internal_label||'')}</div></div><span class="pill ${cls}">${esc(label)}</span></div><div class="action">${esc(x.last_action||x.selected_action||x.current_focus||'No recent action')}</div><div class="mini"><div><div class="k">Stage</div><div>${esc(nice(x.current_stage||'—'))}</div></div><div><div class="k">Compute</div><div>${esc(fmt(x.compute_balance??x.compute_credits))}</div></div><div><div class="k">Wake</div><div>${esc(fmt(x.wake_number??x.intent_execution_count))}</div></div></div><div class="nextline">Next: ${esc(rel(nextAt(x)))}</div></div>`}).join(''):'<div class="empty">No agents match this view.</div>';document.querySelectorAll('.card[data-id]').forEach(c=>c.onclick=()=>openAgent(c.dataset.id))}
function attachmentHtml(f){const preview=f.signed_url&&String(f.mime_type||'').startsWith('image/')?`<img src="${esc(f.signed_url)}" alt="${esc(f.filename)}">`:'';return `<div class="attachment">${preview}<button data-file="${esc(f.file_id)}">${esc(f.filename)}</button><div class="attmeta">${esc(f.mime_type||'file')} · ${esc(f.processing_status||'')}</div></div>`}
function messagesHtml(messages){return messages.length?messages.map(m=>`<div class="msg ${m.sender_kind==='admin'?'admin':'agent'}">${esc(m.content||'')}${(m.attachments||[]).length?`<div class="attachments">${m.attachments.map(attachmentHtml).join('')}</div>`:''}<div class="msgmeta">${esc(m.sender_kind)} · ${esc(m.delivery_status||'')} · ${esc(when(m.created_at))}</div></div>`).join(''):'<div class="empty">No messages yet.</div>'}
function filesHtml(files){return files.length?files.map(f=>`<div class="fileitem"><div><button data-file="${esc(f.file_id)}">${esc(f.filename)}</button><div class="attmeta">${esc(f.mime_type)} · ${esc(f.direction)} · ${esc(when(f.created_at))}</div>${f.caption?`<div class="muted">${esc(f.caption)}</div>`:''}</div><span class="filetag">${esc(f.purpose||f.processing_status||'file')}</span></div>`).join(''):'<div class="empty">No files yet.</div>'}
function timelineHtml(d){/* activity_timeline_schema_v0_2 */return (d?.recent_activity||d?.timeline||[]).slice(0,12).map(e=>{const title=e?.title||e?.event_type||e?.action||e?.kind||e?.event_kind||'Activity';const detail=e?.detail||e?.summary||e?.details||e?.stated_reason||e?.context?.stated_reason||'';const type=e?.event_kind||e?.kind||e?.event_type||'';const stamp=e?.occurred_at||e?.created_at||e?.timestamp||null;const meta=[type,stamp?when(stamp):''].filter(Boolean).join(' · ');return `<div class="event"><b>${esc(title)}</b>${detail?`<div>${esc(detail)}</div>`:''}${meta?`<div class="msgmeta">${esc(meta)}</div>`:''}</div>`}).join('')||'<div class="empty">No recent activity supplied.</div>'}
async function downloadFile(id){try{const f=await api('mode=file&id='+encodeURIComponent(id));if(f.signed_url){window.open(f.signed_url,'_blank','noopener');return}if(f.inline_content!=null){const b=new Blob([f.inline_content],{type:f.mime_type||'text/plain'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=f.filename||'agent-file';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000);return}throw new Error('File payload unavailable')}catch(e){showError(e.message)}}
function bindFileButtons(root=document){root.querySelectorAll('[data-file]').forEach(b=>b.onclick=e=>{e.stopPropagation();downloadFile(b.dataset.file)})}
async function sendChat(id){const t=$('#chatText'),m=raw(t?.value).trim();if(!m)return;const b=$('#sendBtn');b.disabled=true;try{await api('mode=chat',{method:'POST',body:{id,message:m}});t.value='';await reloadDrawer(id,false)}catch(e){showError(e.message)}finally{b.disabled=false}}
async function uploadFile(id){const input=$('#fileInput'),file=input?.files?.[0];if(!file){showError('Choose a file first.');return}const form=new FormData();form.append('id',id);form.append('file',file);form.append('purpose',$('#filePurpose').value);form.append('caption',$('#fileCaption').value);form.append('message',$('#fileMessage').value);const b=$('#uploadBtn'),s=$('#uploadStatus');b.disabled=true;s.textContent='Uploading…';try{const r=await api('mode=file_upload',{method:'POST',form});s.textContent=`Uploaded: ${r.filename} · ${r.status}`;input.value='';$('#fileCaption').value='';$('#fileMessage').value='';await reloadDrawer(id,false)}catch(e){s.textContent='Upload failed';showError(e.message)}finally{b.disabled=false}}
function updateDrawerDynamic(d,c,fdata){if(!st.drawerAgentId)return;const a=d?.status||d?.agent||d||{},messages=c?.messages||[],files=fdata?.files||[];
 const header=$('#drawerHeader');if(header)header.innerHTML=`<div class="identity">${avatar(a,'lg')}<div><div class="focus-name">${esc(displayName(a))}</div><div class="focus-label">${esc(a.internal_label||'')}</div><div class="focus-model">${esc(a.primary_model_id||'')}</div><span class="stage">${esc(nice(a.current_stage||'—'))}</span></div></div>`;
 const controls=$('#drawerControls');if(controls){controls.innerHTML=controlsHtml(a,'drawer');bindControls(a,'drawer')}
 const log=$('#chatlog');if(log){const nearBottom=log.scrollHeight-log.scrollTop-log.clientHeight<80;const oldTop=log.scrollTop;log.innerHTML=messagesHtml(messages);bindFileButtons(log);if(nearBottom)log.scrollTop=log.scrollHeight;else log.scrollTop=oldTop}
 const fileList=$('#drawerFileList');if(fileList){fileList.innerHTML=filesHtml(files);bindFileButtons(fileList)}
 const timeline=$('#drawerTimeline');if(timeline)timeline.innerHTML=timelineHtml(d);
}
async function reloadDrawer(id,forceMount=false){if(st.drawerAgentId!==id)return;const [d,c,f]=await Promise.all([api('mode=agent&id='+encodeURIComponent(id)),api('mode=chat&id='+encodeURIComponent(id)),api('mode=files&id='+encodeURIComponent(id))]);if(forceMount||st.drawerMountedFor!==id||!$('#chatText')||!$('#fileInput'))renderDrawer(d,c,f);else updateDrawerDynamic(d,c,f)}
function renderDrawer(d,c,fdata){const a=d?.status||d?.agent||d||{},messages=c?.messages||[],files=fdata?.files||[];$('#drawerbody').innerHTML=`
<div id="drawerHeader"><div class="identity">${avatar(a,'lg')}<div><div class="focus-name">${esc(displayName(a))}</div><div class="focus-label">${esc(a.internal_label||'')}</div><div class="focus-model">${esc(a.primary_model_id||'')}</div><span class="stage">${esc(nice(a.current_stage||'—'))}</span></div></div></div>
<div class="actionrow" id="drawerControls">${controlsHtml(a,'drawer')}</div>
<h3>Admin ↔ Agent Chat</h3>
<div class="chat"><div class="chatlog" id="chatlog">${messagesHtml(messages)}</div><div class="composer"><textarea id="chatText" placeholder="Message this agent…"></textarea><button id="sendBtn" class="sendbtn">Send</button></div></div>
<h3>Send File</h3>
<div class="uploadbox"><div class="uploadgrid"><input id="fileInput" type="file"><select id="filePurpose"><option value="attachment">General attachment</option><option value="embodiment_candidate">Embodiment candidate image</option></select><input id="fileCaption" placeholder="Caption (optional)"><input id="fileMessage" placeholder="Message to accompany file (optional)"></div><div class="actionrow"><button id="uploadBtn" class="filebtn">Upload & send</button><span class="uploadstatus" id="uploadStatus">Private storage · max 25 MB</span></div></div>
<h3>Files</h3><div class="filelist" id="drawerFileList">${filesHtml(files)}</div>
<h3>Recent Activity</h3><div class="timeline" id="drawerTimeline">${timelineHtml(d)}</div>`;
 st.drawerMountedFor=a.agent_id||st.drawerAgentId;bindControls(a,'drawer');$('#sendBtn').onclick=()=>sendChat(a.agent_id);$('#uploadBtn').onclick=()=>uploadFile(a.agent_id);$('#chatText').addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)){e.preventDefault();sendChat(a.agent_id)}});bindFileButtons($('#drawerbody'));const log=$('#chatlog');if(log)log.scrollTop=log.scrollHeight}
async function openAgent(id,silent=false){const changed=st.drawerAgentId!==id;st.drawerAgentId=id;if(changed)st.drawerMountedFor=null;$('#drawer').classList.add('open');$('#drawerbg').classList.add('open');try{await reloadDrawer(id,changed);clearInterval(st.drawerTimer);st.drawerTimer=setInterval(()=>reloadDrawer(id,false).catch(()=>{}),5000)}catch(e){if(!silent)showError(e.message)}}
function closeDrawer(){st.drawerAgentId=null;st.drawerMountedFor=null;clearInterval(st.drawerTimer);$('#drawer').classList.remove('open');$('#drawerbg').classList.remove('open')}
async function refresh(silent=false){try{const [snap,sys]=await Promise.all([api('mode=snapshot'),api('mode=system')]);st.snap=snap;st.sys=sys;$('#dot').classList.remove('bad');$('#liveText').textContent='Live';render()}catch(e){$('#dot').classList.add('bad');$('#liveText').textContent='Error';if(!silent)showError(e.message)}}
async function login(){st.pw=$('#pw').value;$('#loginMsg').textContent='';try{await refresh();$('#login').style.display='none';clearInterval(st.timer);st.timer=setInterval(()=>refresh(true),8000)}catch(e){st.pw=null;$('#loginMsg').textContent=e.message}}
$('#loginBtn').onclick=login;$('#pw').addEventListener('keydown',e=>{if(e.key==='Enter')login()});$('#refresh').onclick=()=>refresh();$('#filter').onchange=e=>{st.filter=e.target.value;renderGrid()};$('#search').oninput=e=>{st.q=e.target.value;renderGrid()};$('#close').onclick=closeDrawer;$('#drawerbg').onclick=closeDrawer;
</script>
</body>
</html>
