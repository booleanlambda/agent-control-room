<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agent Control Room</title><style>:root{--bg:#070a0f;--panel:#0d121b;--line:#202b3b;--text:#edf3fb;--muted:#8fa0b7;--accent:#7dd3fc;--good:#5ee6a8;--warn:#f5c45e;--bad:#ff7b88;--violet:#b8a7ff;--shadow:0 22px 60px rgba(0,0,0,.36)}*{box-sizing:border-box}html,body{margin:0;background:radial-gradient(circle at 15% -10%,#142438 0,transparent 30%),var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{min-height:100vh}button,input,select{font:inherit}button{cursor:pointer}.wrap{max-width:1540px;margin:0 auto;padding:28px 24px 60px}.top{display:flex;gap:18px;align-items:flex-start;justify-content:space-between;margin-bottom:22px}.title h1{font-size:28px;margin:0 0 6px;letter-spacing:-.03em}.title p{margin:0;color:var(--muted);font-size:14px}.live{display:flex;align-items:center;gap:9px;color:var(--muted);font-size:13px}.dot{width:9px;height:9px;border-radius:50%;background:var(--good);box-shadow:0 0 16px rgba(94,230,168,.8)}.metrics{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-bottom:16px}.metric{background:linear-gradient(180deg,rgba(17,24,36,.92),rgba(10,15,23,.92));border:1px solid var(--line);border-radius:16px;padding:15px 16px}.metric .k{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}.metric .v{font-size:25px;font-weight:730;margin-top:5px;letter-spacing:-.03em}.metric .s{font-size:11px;color:var(--muted);margin-top:3px}.spend-values{display:flex;gap:14px;align-items:flex-end;margin-top:8px}.spend-child{flex:1;min-width:0}.spend-label{font-size:9px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}.spend-num{font-size:19px;font-weight:730;letter-spacing:-.03em;margin-top:3px;white-space:nowrap}.toolbar{display:flex;gap:10px;align-items:center;margin:18px 0}.search{flex:1;min-width:180px;background:var(--panel);border:1px solid var(--line);border-radius:12px;color:var(--text);padding:11px 13px;outline:none}.select,.btn{background:var(--panel);border:1px solid var(--line);border-radius:12px;color:var(--text);padding:10px 12px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.card{background:linear-gradient(180deg,rgba(16,23,34,.96),rgba(10,15,23,.96));border:1px solid var(--line);border-radius:17px;padding:16px;box-shadow:0 10px 35px rgba(0,0,0,.16);transition:.16s ease;min-height:282px}.card:hover{transform:translateY(-2px);border-color:#38516d;box-shadow:var(--shadow)}.card-head{display:flex;justify-content:space-between;gap:12px;align-items:center}.name{font-size:16px;font-weight:700}.pill{font-size:10px;letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--line);border-radius:999px;padding:5px 8px;color:var(--muted)}.pill.awake{color:var(--good);border-color:rgba(94,230,168,.35);background:rgba(94,230,168,.06)}.pill.alert{color:var(--bad);border-color:rgba(255,123,136,.35)}.focus{font-size:13px;color:#cbd6e5;line-height:1.45;margin:14px 0 12px;min-height:38px}.action{font-size:12px;color:var(--muted);line-height:1.45;border-left:2px solid #2d4058;padding-left:10px;min-height:50px}.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}.mini .box{background:#0a1018;border:1px solid #192434;border-radius:10px;padding:8px}.mini .label{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}.mini .num{font-size:13px;font-weight:650;margin-top:3px}.bar{height:3px;background:#1c2735;border-radius:99px;overflow:hidden;margin-top:5px}.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--violet));border-radius:99px}.foot{display:flex;justify-content:space-between;align-items:center;gap:8px;border-top:1px solid #172231;padding-top:11px;font-size:11px;color:var(--muted)}.badges{display:flex;gap:6px;flex-wrap:wrap}.badge{padding:3px 6px;border-radius:7px;background:#111b28;border:1px solid #1f2d3e}.badge.stim{color:var(--accent)}.badge.err{color:var(--bad)}.empty{border:1px dashed var(--line);border-radius:16px;padding:45px;text-align:center;color:var(--muted);grid-column:1/-1}.error{margin:16px 0;padding:13px;border:1px solid rgba(255,123,136,.35);background:rgba(255,123,136,.08);border-radius:12px;color:#ffc2c8;display:none}.drawer-back{position:fixed;inset:0;background:rgba(2,5,9,.74);backdrop-filter:blur(4px);display:none;z-index:30}.drawer{position:fixed;right:0;top:0;height:100vh;width:min(720px,96vw);background:#090e15;border-left:1px solid var(--line);z-index:40;transform:translateX(105%);transition:.22s ease;overflow:auto;box-shadow:-30px 0 80px rgba(0,0,0,.45)}.drawer.open{transform:translateX(0)}.drawer-back.open{display:block}.drawer-inner{padding:24px}.drawer-top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;position:sticky;top:0;background:rgba(9,14,21,.94);backdrop-filter:blur(10px);padding:6px 0 15px;z-index:2;border-bottom:1px solid #172231}.close{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:#111824;color:var(--text);font-size:20px}.detail-title{font-size:23px;font-weight:730}.detail-sub{font-size:12px;color:var(--muted);margin-top:4px}.section{margin-top:22px}.section h3{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin:0 0 10px}.reason{padding:13px;background:#0d141e;border:1px solid #1b2939;border-radius:12px;line-height:1.55;color:#d8e3f1;font-size:13px}.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.kv>div{background:#0c121b;border:1px solid #182433;border-radius:11px;padding:10px}.kv .kk{font-size:9px;text-transform:uppercase;color:var(--muted);letter-spacing:.08em}.kv .vv{font-size:13px;margin-top:4px;overflow-wrap:anywhere}.chips{display:flex;flex-wrap:wrap;gap:7px}.chip{font-size:11px;border:1px solid #26364a;background:#101927;border-radius:999px;padding:6px 9px;color:#cbd6e5}.timeline{display:flex;flex-direction:column;gap:9px}.event{display:grid;grid-template-columns:14px 1fr;gap:10px}.event .node{width:13px;height:13px;border-radius:50%;margin-top:4px;background:#31465f;border:3px solid #0a1018}.event-body{background:#0d141e;border:1px solid #192638;border-radius:12px;padding:10px 11px}.event-title{font-size:12px;font-weight:650}.event-detail{font-size:12px;color:#b8c5d6;margin-top:3px;line-height:1.45;white-space:pre-wrap}.event-time{font-size:10px;color:var(--muted);margin-top:6px}.login{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 0,#142438 0,transparent 36%),#070a0f;z-index:100}.login-box{width:min(430px,92vw);background:#0d121b;border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:var(--shadow)}.login-box h2{margin:0 0 6px}.login-box p{color:var(--muted);font-size:13px}.login-box input{width:100%;background:#080d14;border:1px solid var(--line);border-radius:12px;color:var(--text);padding:12px;margin:10px 0}.login-box button{width:100%;padding:11px;border-radius:12px;border:1px solid #29445f;background:#132235;color:#eaf5ff}.login-msg{font-size:12px;color:var(--bad);min-height:18px;margin-top:8px}@media(max-width:1100px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.metrics{grid-template-columns:repeat(3,1fr)}}@media(max-width:700px){.wrap{padding:18px 14px 45px}.top{flex-direction:column}.grid{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}.toolbar{flex-wrap:wrap}.search{width:100%;flex-basis:100%}.kv{grid-template-columns:1fr}.drawer-inner{padding:18px}.metric .v{font-size:21px}}</style></head><body><div class="login" id="login"><div class="login-box"><h2>Agent Control Room</h2><p>Read-only operator access. Password is kept only for this browser session.</p><input id="pw" type="password" placeholder="Control Room password"><button id="loginBtn">Open Control Room</button><div class="login-msg" id="loginMsg"></div></div></div><div class="wrap"><div class="top"><div class="title"><h1>Agent Control Room</h1><p>Read-only observability for the private incubator</p></div><div class="live"><span class="dot"></span><span id="liveText">Locked</span></div></div><div id="error" class="error"></div><div class="metrics" id="metrics"></div><div class="toolbar"><input class="search" id="search" placeholder="Search agents, focus or last action…"><select id="filter" class="select"><option value="all">All agents</option><option value="awake">Awake / queued</option><option value="stimuli">Has stimuli</option><option value="alerts">Has alerts</option></select><select id="sort" class="select"><option value="activity">Recent activity</option><option value="nextwake">Next wake</option><option value="curiosity">Curiosity</option><option value="stimuli">Stimuli</option></select><button class="btn" id="refresh">Refresh</button></div><div class="grid" id="grid"></div></div><div class="drawer-back" id="back"></div><aside class="drawer" id="drawer"><div class="drawer-inner" id="drawerInner"></div></aside><script>const API='https://mgtilfgygzymxiyixjit.supabase.co/functions/v1/agent-control-room-api';const state={snapshot:null,providers:null,query:'',filter:'all',sort:'activity',openAgent:null,timer:null,financeTimer:null,password:null};const $=s=>document.querySelector(s);const esc=s=>String(s??'');const h=(tag,cls,text)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=esc(text);return e};const fmtNum=(n,d=0)=>Number.isFinite(Number(n))?Number(n).toLocaleString(undefined,{maximumFractionDigits:d}):'—';const money=(n,c='usd')=>Number.isFinite(Number(n))?new Intl.NumberFormat(undefined,{style:'currency',currency:String(c||'usd').toUpperCase(),maximumFractionDigits:4}).format(Number(n)):'—';const pct=n=>Math.round(Math.max(0,Math.min(1,Number(n)||0))*100);const rel=t=>{if(!t)return'—';const d=new Date(t);if(Number.isNaN(d.getTime()))return'—';const s=(d-Date.now())/1000,a=Math.abs(s);let v,u;if(a<60){v=Math.round(a);u='sec'}else if(a<3600){v=Math.round(a/60);u='min'}else if(a<86400){v=Math.round(a/3600);u='hr'}else{v=Math.round(a/86400);u='day'}return s>=0?'in '+v+' '+u+(v===1?'':'s'):v+' '+u+(v===1?'':'s')+' ago'};const niceLabel=s=>esc(s).replace(/^agent_/,'Agent ').split('_').map(x=>x.charAt(0).toUpperCase()+x.slice(1)).join(' ');const short=(s,n=150)=>{s=esc(s);return s.length>n?s.slice(0,n-1)+'…':s};function authHeader(){return 'Basic '+btoa('operator:'+state.password)}async function api(params){const r=await fetch(API+'?'+params,{headers:{Authorization:authHeader()},cache:'no-store'});if(r.status===401)throw new Error('Invalid password');if(!r.ok)throw new Error('Request failed: '+r.status);return r.json()}function metric(k,v,s){const x=h('div','metric');x.append(h('div','k',k),h('div','v',v),h('div','s',s));return x}function spendMetric(){const ps=state.providers?.providers||[],p=ps.find(x=>x.provider==='openai')||ps[0]||{},costs=p.costs||{},cur=costs.currency||'usd',x=h('div','metric spend'),vals=h('div','spend-values'),a=h('div','spend-child'),b=h('div','spend-child');x.append(h('div','k','OpenAI spend'));a.append(h('div','spend-label','7D'),h('div','spend-num',money(costs.last_7_days,cur)));b.append(h('div','spend-label','MTD'),h('div','spend-num',money(costs.month_to_date,cur)));vals.append(a,b);x.append(vals);return x}function renderMetrics(){const m=$('#metrics');m.replaceChildren();const p=state.snapshot?.population||{},agents=state.snapshot?.agents||[],next=agents.map(a=>a.next_queued_due_at||a.next_time_wake_at).filter(Boolean).sort()[0];m.append(metric('Agents',fmtNum(p.agents),'private population'),metric('Awake / queued',fmtNum((p.awake||0)+(p.wake_pending||0)),'right now'),metric('Pending stimuli',fmtNum(p.pending_stimuli),'in agent inboxes'),metric('Open alerts',fmtNum(p.open_alerts),'operator anomalies'),metric('Next wake',rel(next),next?new Date(next).toLocaleTimeString():'none scheduled'),spendMetric())}function box(label,value,bar){const b=h('div','box');b.append(h('div','label',label),h('div','num',value));if(bar!==undefined){const wrap=h('div','bar'),i=document.createElement('i');i.style.width=pct(bar)+'%';wrap.append(i);b.append(wrap)}return b}function card(a){const c=h('button','card');c.type='button';c.style.textAlign='left';c.style.color='inherit';c.style.width='100%';c.style.font='inherit';c.onclick=()=>openAgent(a.agent_id);const head=h('div','card-head');head.append(h('div','name',niceLabel(a.internal_label)));const st=a.awake||a.wake_pending?'awake':a.highest_alert_severity?'alert':'';head.append(h('span','pill '+st,a.awake?'Awake':a.wake_pending?'Queued':a.sleeping?'Sleeping':a.lifecycle_status));c.append(head,h('div','focus',a.current_focus||'No current focus recorded.'),h('div','action',short(a.last_action||'No action recorded yet.',180)));const mini=h('div','mini');mini.append(box('Curiosity',pct(a.curiosity)+'%',a.curiosity),box('Energy',pct(a.energy)+'%',a.energy),box('Social',pct(a.social_appetite)+'%',a.social_appetite));c.append(mini);const foot=h('div','foot'),left=h('div','badges');if(a.pending_stimuli)left.append(h('span','badge stim',a.pending_stimuli+' stimuli'));if(a.open_alerts)left.append(h('span','badge err',a.open_alerts+' alerts'));if(a.active_goals)left.append(h('span','badge',a.active_goals+' goals'));left.append(h('span','badge','wake '+fmtNum(a.wake_number)));foot.append(left,h('span','',a.next_time_wake_at||a.next_queued_due_at?rel(a.next_queued_due_at||a.next_time_wake_at):'no wake'));c.append(foot);return c}function filtered(){let arr=[...(state.snapshot?.agents||[])],q=state.query.toLowerCase().trim();if(q)arr=arr.filter(a=>[a.internal_label,a.public_name,a.current_focus,a.last_action,a.last_stated_reason].some(x=>esc(x).toLowerCase().includes(q)));if(state.filter==='awake')arr=arr.filter(a=>a.awake||a.wake_pending||a.pending_wakes>0);if(state.filter==='stimuli')arr=arr.filter(a=>(a.pending_stimuli||0)>0);if(state.filter==='alerts')arr=arr.filter(a=>(a.open_alerts||0)>0);const ts=x=>x?new Date(x).getTime():Number.MAX_SAFE_INTEGER;if(state.sort==='activity')arr.sort((a,b)=>ts(b.last_activity_at)-ts(a.last_activity_at));if(state.sort==='nextwake')arr.sort((a,b)=>ts(a.next_queued_due_at||a.next_time_wake_at)-ts(b.next_queued_due_at||b.next_time_wake_at));if(state.sort==='curiosity')arr.sort((a,b)=>(b.curiosity||0)-(a.curiosity||0));if(state.sort==='stimuli')arr.sort((a,b)=>(b.pending_stimuli||0)-(a.pending_stimuli||0));return arr}function renderGrid(){const g=$('#grid');g.replaceChildren();const arr=filtered();if(!arr.length){g.append(h('div','empty','No agents match this view.'));return}arr.forEach(a=>g.append(card(a)))}function render(){renderMetrics();renderGrid();const t=state.snapshot?.generated_at;$('#liveText').textContent=t?'Live · updated '+new Date(t).toLocaleTimeString():'Live'}async function refresh(silent=false){if(!state.password)return;try{state.snapshot=await api('mode=snapshot&_='+Date.now());renderMetrics();renderGrid();const t=state.snapshot?.generated_at;$('#liveText').textContent=t?'Live · updated '+new Date(t).toLocaleTimeString():'Live';$('#error').style.display='none';if(state.openAgent)refreshAgent(state.openAgent,true)}catch(e){if(!silent){$('#error').textContent=e.message;$('#error').style.display='block'}$('#liveText').textContent='Connection issue'}}async function refreshFinance(silent=false){if(!state.password)return;try{state.providers=await api('mode=providers&_='+Date.now());renderMetrics()}catch(e){if(!silent){$('#error').textContent='Provider finance: '+e.message;$('#error').style.display='block'}}}function kv(k,v){const d=h('div');d.append(h('div','kk',k),h('div','vv',v));return d}function section(title){const s=h('section','section');s.append(h('h3','',title));return s}function eventNode(ev){const e=h('div','event '+esc(ev.event_kind)),rail=h('div');rail.append(h('div','node'));const body=h('div','event-body');body.append(h('div','event-title',ev.title||ev.event_kind));if(ev.detail)body.append(h('div','event-detail',ev.detail));body.append(h('div','event-time',new Date(ev.occurred_at).toLocaleString()+' · '+ev.event_kind));e.append(rail,body);return e}async function openAgent(id){state.openAgent=id;$('#back').classList.add('open');$('#drawer').classList.add('open');$('#drawerInner').replaceChildren(h('div','empty','Loading agent history…'));await refreshAgent(id,false)}async function refreshAgent(id,silent){try{const d=await api('mode=agent&id='+encodeURIComponent(id)+'&_='+Date.now());if(state.openAgent!==id)return;const root=$('#drawerInner');root.replaceChildren();const top=h('div','drawer-top'),left=h('div');left.append(h('div','detail-title',niceLabel(d.status?.internal_label||'agent')),h('div','detail-sub',(d.status?.current_focus||'No current focus')+' · '+(d.status?.awake?'awake':'sleeping')));const close=h('button','close','×');close.onclick=closeDrawer;top.append(left,close);root.append(top);const status=d.status||{},s1=section('Current state'),grid=h('div','kv');grid.append(kv('Last action',status.last_action||'—'),kv('Next wake',status.next_time_wake_at?new Date(status.next_time_wake_at).toLocaleString():'—'),kv('Wake number',fmtNum(status.wake_number)),kv('Pending stimuli',fmtNum(status.pending_stimuli)),kv('Energy',pct(status.energy)+'%'),kv('Curiosity',pct(status.curiosity)+'%'));s1.append(grid);root.append(s1);if(status.last_stated_reason){const sr=section('Stated reason');sr.append(h('div','reason',status.last_stated_reason));root.append(sr)}const rsrc=status.resources||{},rs=section('Resources'),rg=h('div','kv');['compute','research','creative','storage'].forEach(k=>{const r=rsrc[k];if(r)rg.append(kv(k,fmtNum(r.balance,2)+' / reserve '+fmtNum(r.target_reserve,2)))});rs.append(rg);root.append(rs);if(Array.isArray(d.interests)&&d.interests.length){const si=section('Interests'),chips=h('div','chips');d.interests.forEach(x=>chips.append(h('span','chip',x.topic+' · '+fmtNum((x.interest_strength||0)*100)+'%')));si.append(chips);root.append(si)}const tl=section('Timeline'),list=h('div','timeline');(d.timeline||[]).forEach(ev=>list.append(eventNode(ev)));if(!(d.timeline||[]).length)list.append(h('div','empty','No timeline entries yet.'));tl.append(list);root.append(tl)}catch(e){if(!silent)$('#drawerInner').replaceChildren(h('div','empty','Could not load agent detail: '+e.message))}}function closeDrawer(){state.openAgent=null;$('#drawer').classList.remove('open');$('#back').classList.remove('open')}async function startTimers(){clearInterval(state.timer);clearInterval(state.financeTimer);state.timer=setInterval(()=>{if(!document.hidden)refresh(true)},15000);state.financeTimer=setInterval(()=>{if(!document.hidden)refreshFinance(true)},300000)}async function login(){const pw=$('#pw').value;if(!pw)return;state.password=pw;$('#loginMsg').textContent='Checking…';try{const [snap,providers]=await Promise.all([api('mode=snapshot&_='+Date.now()),api('mode=providers&_='+Date.now())]);state.snapshot=snap;state.providers=providers;sessionStorage.setItem('agentControlRoomPassword',pw);$('#login').style.display='none';$('#loginMsg').textContent='';render();startTimers()}catch(e){state.password=null;sessionStorage.removeItem('agentControlRoomPassword');$('#loginMsg').textContent='Access denied'}}$('#loginBtn').onclick=login;$('#pw').addEventListener('keydown',e=>{if(e.key==='Enter')login()});$('#back').onclick=closeDrawer;document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDrawer()});$('#search').oninput=e=>{state.query=e.target.value;renderGrid()};$('#filter').onchange=e=>{state.filter=e.target.value;renderGrid()};$('#sort').onchange=e=>{state.sort=e.target.value;renderGrid()};$('#refresh').onclick=()=>{refresh(false);refreshFinance(false)};document.addEventListener('visibilitychange',()=>{if(!document.hidden){refresh(true);refreshFinance(true)}});const saved=sessionStorage.getItem('agentControlRoomPassword');if(saved){state.password=saved;Promise.all([api('mode=snapshot&_='+Date.now()),api('mode=providers&_='+Date.now())]).then(([snap,providers])=>{state.snapshot=snap;state.providers=providers;$('#login').style.display='none';render();startTimers()}).catch(()=>{state.password=null;sessionStorage.removeItem('agentControlRoomPassword')})}</script></body></html>
