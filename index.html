<style>

*{box-sizing:border-box}html,body{margin:0;background:radial-gradient(circle at 15% -10%,#142438 0,transparent 30%),var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{min-height:100vh}button,input,select{font:inherit}button{cursor:pointer}.wrap{max-width:1540px;margin:0 auto;padding:28px 24px 60px}.top{display:flex;gap:18px;align-items:flex-start;justify-content:space-between;margin-bottom:16px}.title h1{font-size:28px;margin:0 0 6px;letter-spacing:-.03em}.title p{margin:0;color:var(--muted);font-size:14px}.live{display:flex;align-items:center;gap:9px;color:var(--muted);font-size:13px}.dot{width:9px;height:9px;border-radius:50%;background:var(--good);box-shadow:0 0 16px rgba(94,230,168,.8)}.dot.warn{background:var(--warn);box-shadow:0 0 16px rgba(245,196,94,.65)}.banner{display:flex;justify-content:space-between;gap:18px;align-items:center;border:1px solid rgba(245,196,94,.36);background:rgba(245,196,94,.07);border-radius:15px;padding:13px 15px;margin-bottom:14px}.banner.bad{border-color:rgba(255,123,136,.4);background:rgba(255,123,136,.08)}.banner-title{font-size:13px;font-weight:700}.banner-text{font-size:12px;color:#c9d4e2;margin-top:3px;line-height:1.45}.banner-pill{white-space:nowrap;font-size:10px;text-transform:uppercase;letter-spacing:.09em;border:1px solid currentColor;border-radius:999px;padding:5px 8px;color:var(--warn)}.banner.bad .banner-pill{color:var(--bad)}.metrics{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;margin-bottom:14px}.metric{background:linear-gradient(180deg,rgba(17,24,36,.92),rgba(10,15,23,.92));border:1px solid var(--line);border-radius:16px;padding:15px 16px;min-height:102px}.metric .k{font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}.metric .v{font-size:20px;font-weight:730;margin-top:7px;letter-spacing:-.025em;overflow-wrap:anywhere}.metric .s{font-size:11px;color:var(--muted);margin-top:5px;line-height:1.35}.system{display:grid;grid-template-columns:1.25fr .75fr;gap:14px;margin-bottom:18px}.panel{background:linear-gradient(180deg,rgba(16,23,34,.96),rgba(10,15,23,.96));border:1px solid var(--line);border-radius:17px;padding:16px}.panel h2{font-size:13px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin:0 0 12px}.kv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.kv>div{background:#0c121b;border:1px solid #182433;border-radius:11px;padding:10px}.kk{font-size:9px;text-transform:uppercase;color:var(--muted);letter-spacing:.08em}.vv{font-size:13px;margin-top:4px;overflow-wrap:anywhere}.good{color:var(--good)}.warn{color:var(--warn)}.badtext{color:var(--bad)}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11px}.focus-card{display:flex;flex-direction:column;gap:9px}.focus-name{font-size:20px;font-weight:760}.focus-model{font-size:12px;color:var(--accent);overflow-wrap:anywhere}.focus-action{font-size:13px;line-height:1.5;padding:11px;border-left:2px solid var(--accent);background:#0a1018;border-radius:0 10px 10px 0}.focus-reason{font-size:12px;line-height:1.5;color:#bdc9d8}.toolbar{display:flex;gap:10px;align-items:center;margin:18px 0 12px}.search{flex:1;min-width:180px;background:var(--panel);border:1px solid var(--line);border-radius:12px;color:var(--text);padding:11px 13px;outline:none}.select,.btn{background:var(--panel);border:1px solid var(--line);border-radius:12px;color:var(--text);padding:10px 12px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.card{background:linear-gradient(180deg,rgba(16,23,34,.96),rgba(10,15,23,.96));border:1px solid var(--line);border-radius:17px;padding:16px;box-shadow:0 10px 35px rgba(0,0,0,.16);transition:.16s ease;min-height:245px}.card:hover{transform:translateY(-2px);border-color:#38516d;box-shadow:var(--shadow)}.card.current{border-color:rgba(125,211,252,.4);box-shadow:0 0 0 1px rgba(125,211,252,.08) inset}.card-head{display:flex;justify-content:space-between;gap:12px;align-items:center}.name{font-size:16px;font-weight:700}.pill{font-size:9px;letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--line);border-radius:999px;padding:5px 8px;color:var(--muted);text-align:right}.pill.current{color:var(--accent);border-color:rgba(125,211,252,.35);background:rgba(125,211,252,.06)}.pill.paused{color:var(--warn);border-color:rgba(245,196,94,.25)}.pill.archived{color:#77879d}.focus{font-size:13px;color:#cbd6e5;line-height:1.45;margin:14px 0 12px;min-height:38px}.action{font-size:12px;color:var(--muted);line-height:1.45;border-left:2px solid #2d4058;padding-left:10px;min-height:48px}.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}.box{background:#0a1018;border:1px solid #192434;border-radius:10px;padding:8px}.label{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}.num{font-size:13px;font-weight:650;margin-top:3px}.foot{display:flex;justify-content:space-between;align-items:center;gap:8px;border-top:1px solid #172231;padding-top:11px;font-size:11px;color:var(--muted)}.badge{padding:3px 6px;border-radius:7px;background:#111b28;border:1px solid #1f2d3e;margin-right:5px}.empty{border:1px dashed var(--line);border-radius:16px;padding:45px;text-align:center;color:var(--muted);grid-column:1/-1}.error{margin:16px 0;padding:13px;border:1px solid rgba(255,123,136,.35);background:rgba(255,123,136,.08);border-radius:12px;color:#ffc2c8;display:none}.drawer-back{position:fixed;inset:0;background:rgba(2,5,9,.74);backdrop-filter:blur(4px);display:none;z-index:30}.drawer{position:fixed;right:0;top:0;height:100vh;width:min(760px,96vw);background:#090e15;border-left:1px solid var(--line);z-index:40;transform:translateX(105%);transition:.22s ease;overflow:auto;box-shadow:-30px 0 80px rgba(0,0,0,.45)}.drawer.open{transform:translateX(0)}.drawer-back.open{display:block}.drawer-inner{padding:24px}.drawer-top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;position:sticky;top:0;background:rgba(9,14,21,.94);backdrop-filter:blur(10px);padding:6px 0 15px;z-index:2;border-bottom:1px solid #172231}.close{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:#111824;color:var(--text);font-size:20px}.detail-title{font-size:23px;font-weight:730}.detail-sub{font-size:12px;color:var(--muted);margin-top:4px}.section{margin-top:22px}.section h3{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin:0 0 10px}.reason{padding:13px;background:#0d141e;border:1px solid #1b2939;border-radius:12px;line-height:1.55;color:#d8e3f1;font-size:13px}.timeline{display:flex;flex-direction:column;gap:9px}.event{display:grid;grid-template-columns:14px 1fr;gap:10px}.node{width:13px;height:13px;border-radius:50%;margin-top:4px;background:#31465f;border:3px solid #0a1018}.event-body{background:#0d141e;border:1px solid #192638;border-radius:12px;padding:10px 11px}.event-title{font-size:12px;font-weight:650}.event-detail{font-size:12px;color:#b8c5d6;margin-top:3px;line-height:1.45;white-space:pre-wrap}.event-time{font-size:10px;color:var(--muted);margin-top:6px}.login{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 0,#142438 0,transparent 36%),#070a0f;z-index:100}.login-box{width:min(430px,92vw);background:#0d121b;border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:var(--shadow)}.login-box h2{margin:0 0 6px}.login-box p{color:var(--muted);font-size:13px;line-height:1.5}.login-box input{width:100%;background:#080d14;border:1px solid var(--line);border-radius:12px;color:var(--text);padding:12px;margin:10px 0}.login-box button{width:100%;padding:11px;border-radius:12px;border:1px solid #29445f;background:#132235;color:#eaf5ff}.login-msg{font-size:12px;color:var(--bad);min-height:18px;margin-top:8px}
@media(max-width:1150px){.metrics{grid-template-columns:repeat(3,1fr)}.system{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.kv{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:700px){.wrap{padding:18px 14px 45px}.top{flex-direction:column}.metrics{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.toolbar{flex-wrap:wrap}.search{width:100%;flex-basis:100%}.kv{grid-template-columns:1fr}.drawer-inner{padding:18px}.metric .v{font-size:18px}}
</style>

<body>
<div class="login" id="login"><div class="login-box"><h2>AAU Agent Control Room</h2><p>Read-only operator view. This dashboard now distinguishes the current NVIDIA experiment from the paused legacy population.</p><input id="pw" type="password" placeholder="Control Room password"><button id="loginBtn">Open Control Room</button><div class="login-msg" id="loginMsg"></div></div></div>
<div class="wrap">
  <div class="top"><div class="title"><h1>AAU Agent Control Room</h1><p>Current runtime truth — experimental cognition, wake lifecycle and paused population</p></div><div class="live"><span class="dot" id="liveDot"></span><span id="liveText">Locked</span></div></div>
  <div id="error" class="error"></div>
  <div id="loopBanner" class="banner bad" style="display:none"></div>
  <div class="metrics" id="metrics"></div>
  <div class="system">
    <section class="panel"><h2>Runtime</h2><div class="kv" id="runtimeKv"></div></section>
    <section class="panel"><h2>Current experiment</h2><div class="focus-card" id="experimentCard"></div></section>
  </div>
  <div class="toolbar"><input class="search" id="search" placeholder="Search agents, focus or last action…"><select id="filter" class="select"><option value="current">Current experiment</option><option value="paused">Paused population</option><option value="all">All agents</option><option value="archived">Archived</option></select><select id="sort" class="select"><option value="activity">Recent activity</option><option value="wake">Wake count</option><option value="label">Agent label</option></select><button class="btn" id="refresh">Refresh</button></div>
  <div class="grid" id="grid"></div>
</div>
<div class="drawer-back" id="back"></div><aside class="drawer" id="drawer"><div class="drawer-inner" id="drawerInner"></div></aside>
<script>
const API='https://mgtilfgygzymxiyixjit.supabase.co/functions/v1/agent-control-room-api';
const state={snapshot:null,system:null,query:'',filter:'current',sort:'activity',openAgent:null,timer:null,password:null};
const $=s=>document.querySelector(s);const esc=s=>String(s??'');const h=(tag,cls,text)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=esc(text);return e};
const fmt=(n,d=0)=>Number.isFinite(Number(n))?Number(n).toLocaleString(undefined,{maximumFractionDigits:d}):'—';
const short=(s,n=170)=>{s=esc(s);return s.length>n?s.slice(0,n-1)+'…':s};
const nice=s=>esc(s).replace(/^agent_/,'Agent ').split('_').map(x=>x.charAt(0).toUpperCase()+x.slice(1)).join(' ');
const when=t=>{if(!t)return'none';const d=new Date(t);return Number.isNaN(d.getTime())?'none':d.toLocaleString()};
const rel=t=>{if(!t)return'none';const d=new Date(t);if(Number.isNaN(d.getTime()))return'none';const s=(d-Date.now())/1000,a=Math.abs(s);let v,u;if(a<60){v=Math.round(a);u='sec'}else if(a<3600){v=Math.round(a/60);u='min'}else if(a<86400){v=Math.round(a/3600);u='hr'}else{v=Math.round(a/86400);u='day'}return s>=0?'in '+v+' '+u+(v===1?'':'s'):v+' '+u+(v===1?'':'s')+' ago'};
function auth(){return 'Basic '+btoa('operator:'+state.password)}
async function api(params){const r=await fetch(API+'?'+params,{headers:{Authorization:auth()},cache:'no-store'});if(r.status===401)throw new Error('Invalid password');if(!r.ok)throw new Error('Request failed: '+r.status);return r.json()}
function metric(k,v,s){const x=h('div','metric');x.append(h('div','k',k),h('div','v',v),h('div','s',s));return x}
function pair(k,v,cls=''){const d=h('div');d.append(h('div','kk',k),h('div','vv '+cls,v));return d}
function currentId(){return state.system?.current_agent?.agent_id||null}
function effectiveStatus(a){if(a.lifecycle_status==='archived')return{label:'Archived',cls:'archived'};if(a.agent_id===currentId()){const scheduled=Boolean(state.system?.current_agent?.next_wake_intent||state.system?.current_agent?.next_wake_queue);return{label:scheduled?'Experiment · scheduled':'Experiment · no next wake',cls:'current'}}if(state.system?.global_population_pause)return{label:'Paused',cls:'paused'};return{label:a.sleeping?'Sleeping':'Idle',cls:''}}
function renderBanner(){const b=$('#loopBanner'),w=state.system?.wake_loop||{};if(w.state==='degraded'||w.rabbitmq_wake_consumer_bound===false){b.style.display='flex';b.className='banner bad';b.replaceChildren();const l=h('div');l.append(h('div','banner-title','Autonomous lifecycle loop is not complete'),h('div','banner-text',w.reason||'Current agent does not have a self-scheduled next wake and/or the RabbitMQ wake consumer is not bound.'));b.append(l,h('div','banner-pill','DEGRADED'));}else{b.style.display='flex';b.className='banner';b.replaceChildren();const l=h('div');l.append(h('div','banner-title','Autonomous lifecycle loop'),h('div','banner-text','Agent-selected next wakes are persisted and routed through RabbitMQ.'));b.append(l,h('div','banner-pill','HEALTHY'));}}
function renderMetrics(){const m=$('#metrics');m.replaceChildren();const s=state.system||{},a=s.current_agent||{},p=s.population||{},w=s.wake_loop||{};const next=a.next_wake_intent?.wake_at||a.next_wake_queue?.due_at||null;m.append(metric('Current agent',nice(a.internal_label||'—'),'isolated experiment'),metric('Model','Nemotron 3.5 Lightning',a.consistency_status||'—'),metric('Provider','NVIDIA direct','experimental only'),metric('Other agents paused',fmt(p.other_agents_paused),'global population pause'),metric('Next wake',next?rel(next):'None',next?when(next):'not scheduled'),metric('Wake loop',String(w.state||'unknown').toUpperCase(),w.rabbitmq_wake_consumer_bound?'RabbitMQ consumer bound':'RabbitMQ consumer not bound'))}
function renderRuntime(){const r=$('#runtimeKv');r.replaceChildren();const s=state.system||{},e=s.experimental_runtime||{},w=s.wake_loop||{},c=s.cron||{};r.append(pair('Runtime mode',s.runtime_mode||'—','mono'),pair('Experimental provider',e.provider||'—',e.provider==='nvidia_direct'?'good':''),pair('Production use',e.production_use?'YES':'NO',e.production_use?'badtext':'good'),pair('Global population pause',s.global_population_pause?'ON':'OFF',s.global_population_pause?'warn':'good'),pair('Normal executor',s.normal_executor_enabled?'ON':'OFF',s.normal_executor_enabled?'good':'warn'),pair('Experimental scope',e.scope||'—','mono'),pair('Wake capability',w.self_schedule_capability_enabled?'ENABLED':'DISABLED',w.self_schedule_capability_enabled?'good':'badtext'),pair('RabbitMQ route',w.routing_key||'—','mono'),pair('Wake consumer',w.rabbitmq_wake_consumer_bound?'BOUND':'NOT BOUND',w.rabbitmq_wake_consumer_bound?'good':'badtext'),pair('Wake activator cron',c.wake_activator?'ON':'OFF',c.wake_activator?'good':'warn'),pair('Legacy wake executor cron',c.legacy_wake_executor?'ON':'OFF',c.legacy_wake_executor?'good':'warn'),pair('Operator monitor',c.operator_monitor?'ON':'OFF',c.operator_monitor?'good':'warn'))}
function renderExperiment(){const x=$('#experimentCard');x.replaceChildren();const a=state.system?.current_agent||{},lc=a.last_cognition||{};x.append(h('div','focus-name',nice(a.internal_label||'—')),h('div','focus-model',a.primary_model_id||'—'),h('div','focus-action',lc.selected_action||'No committed cognition yet.'),h('div','focus-reason',lc.output_summary?.stated_reason||'No stated reason recorded.'));const next=a.next_wake_intent?.wake_at||a.next_wake_queue?.due_at;x.append(h('div','vv '+(next?'good':'badtext'),next?'Next wake '+when(next):'No next wake is currently scheduled.'))}
function card(a){const st=effectiveStatus(a),c=h('button','card '+(a.agent_id===currentId()?'current':''));c.type='button';c.style.textAlign='left';c.style.color='inherit';c.style.width='100%';c.style.font='inherit';c.onclick=()=>openAgent(a.agent_id);const head=h('div','card-head');head.append(h('div','name',nice(a.internal_label)),h('span','pill '+st.cls,st.label));c.append(head,h('div','focus',a.current_focus||'No current focus recorded.'),h('div','action',short(a.last_action||'No action recorded yet.',190)));const mini=h('div','mini');mini.append(box('Wake #',fmt(a.wake_number)),box('Compute',fmt(a.resources?.compute?.balance,0)),box('Last activity',a.last_activity_at?rel(a.last_activity_at):'—'));c.append(mini);const foot=h('div','foot');const left=h('div');if(a.pending_stimuli)left.append(h('span','badge',a.pending_stimuli+' historical stimuli'));if(a.open_alerts)left.append(h('span','badge',a.open_alerts+' alerts'));foot.append(left,h('span','',a.agent_id===currentId()?(state.system?.wake_loop?.next_wake_scheduled?'wake scheduled':'no next wake'):'population paused'));c.append(foot);return c}
function box(label,value){const b=h('div','box');b.append(h('div','label',label),h('div','num',value));return b}
function filtered(){let arr=[...(state.snapshot?.agents||[])],q=state.query.toLowerCase().trim();if(q)arr=arr.filter(a=>[a.internal_label,a.public_name,a.current_focus,a.last_action,a.last_stated_reason].some(x=>esc(x).toLowerCase().includes(q)));if(state.filter==='current')arr=arr.filter(a=>a.agent_id===currentId());if(state.filter==='paused')arr=arr.filter(a=>a.lifecycle_status!=='archived'&&a.agent_id!==currentId());if(state.filter==='archived')arr=arr.filter(a=>a.lifecycle_status==='archived');if(state.sort==='activity')arr.sort((a,b)=>new Date(b.last_activity_at||0)-new Date(a.last_activity_at||0));if(state.sort==='wake')arr.sort((a,b)=>(b.wake_number||0)-(a.wake_number||0));if(state.sort==='label')arr.sort((a,b)=>esc(a.internal_label).localeCompare(esc(b.internal_label)));return arr}
function renderGrid(){const g=$('#grid');g.replaceChildren();const arr=filtered();if(!arr.length){g.append(h('div','empty','No agents match this view.'));return}arr.forEach(a=>g.append(card(a)))}
function render(){renderBanner();renderMetrics();renderRuntime();renderExperiment();renderGrid();const t=state.system?.generated_at||state.snapshot?.generated_at;$('#liveText').textContent=t?'Live · '+new Date(t).toLocaleTimeString():'Live';$('#liveDot').className='dot '+(state.system?.wake_loop?.state==='degraded'?'warn':'')}
async function refresh(silent=false){try{const [snapshot,system]=await Promise.all([api('mode=snapshot&_='+Date.now()),api('mode=system&_='+Date.now())]);state.snapshot=snapshot;state.system=system;render();$('#error').style.display='none';if(state.openAgent)refreshAgent(state.openAgent,true)}catch(e){if(!silent){$('#error').textContent=e.message;$('#error').style.display='block'}$('#liveText').textContent='Connection issue'}}
function section(title){const s=h('section','section');s.append(h('h3','',title));return s}
async function openAgent(id){state.openAgent=id;$('#back').classList.add('open');$('#drawer').classList.add('open');$('#drawerInner').replaceChildren(h('div','empty','Loading agent history…'));await refreshAgent(id,false)}
async function refreshAgent(id,silent){try{const d=await api('mode=agent&id='+encodeURIComponent(id)+'&_='+Date.now());if(state.openAgent!==id)return;const root=$('#drawerInner');root.replaceChildren();const a=(state.snapshot?.agents||[]).find(x=>x.agent_id===id)||{},st=effectiveStatus(a);const top=h('div','drawer-top'),left=h('div');left.append(h('div','detail-title',nice(d.status?.internal_label||a.internal_label||'agent')),h('div','detail-sub',st.label+' · '+(d.status?.current_focus||'No current focus')));const close=h('button','close','×');close.onclick=closeDrawer;top.append(left,close);root.append(top);const s1=section('Runtime interpretation'),kg=h('div','kv');kg.append(pair('Effective status',st.label),pair('Global pause',state.system?.global_population_pause?'ON':'OFF'),pair('Current experiment',id===currentId()?'YES':'NO'),pair('Model',id===currentId()?state.system?.current_agent?.primary_model_id:'legacy binding / paused','mono'));s1.append(kg);root.append(s1);const status=d.status||{};const s2=section('Recorded agent state'),g=h('div','kv');g.append(pair('Last action',status.last_action||'—'),pair('Wake number',fmt(status.wake_number)),pair('Energy',fmt((status.energy||0)*100)+'%'),pair('Curiosity',fmt((status.curiosity||0)*100)+'%'),pair('Pending stimuli',fmt(status.pending_stimuli)),pair('Next recorded time wake',status.next_time_wake_at?when(status.next_time_wake_at):'—'));s2.append(g);root.append(s2);if(status.last_stated_reason){const sr=section('Last stated reason');sr.append(h('div','reason',status.last_stated_reason));root.append(sr)}const tl=section('Timeline'),list=h('div','timeline');(d.timeline||[]).forEach(ev=>{const e=h('div','event'),node=h('div','node'),body=h('div','event-body');body.append(h('div','event-title',ev.title||ev.event_kind));if(ev.detail)body.append(h('div','event-detail',ev.detail));body.append(h('div','event-time',when(ev.occurred_at)+' · '+esc(ev.event_kind)));e.append(node,body);list.append(e)});if(!(d.timeline||[]).length)list.append(h('div','empty','No timeline entries yet.'));tl.append(list);root.append(tl)}catch(e){if(!silent)$('#drawerInner').replaceChildren(h('div','empty','Could not load agent detail: '+e.message))}}
function closeDrawer(){state.openAgent=null;$('#drawer').classList.remove('open');$('#back').classList.remove('open')}
async function login(){const pw=$('#pw').value;state.password=pw;$('#loginMsg').textContent='Checking…';try{await Promise.all([api('mode=system'),api('mode=snapshot')]);sessionStorage.setItem('aau_control_room_password',pw);$('#login').style.display='none';$('#loginMsg').textContent='';await refresh(false);if(state.timer)clearInterval(state.timer);state.timer=setInterval(()=>{if(!document.hidden)refresh(true)},15000)}catch(e){state.password=null;$('#loginMsg').textContent=e.message}}
$('#loginBtn').onclick=login;$('#pw').addEventListener('keydown',e=>{if(e.key==='Enter')login()});$('#back').onclick=closeDrawer;document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDrawer()});$('#search').oninput=e=>{state.query=e.target.value;renderGrid()};$('#filter').onchange=e=>{state.filter=e.target.value;renderGrid()};$('#sort').onchange=e=>{state.sort=e.target.value;renderGrid()};$('#refresh').onclick=()=>refresh(false);document.addEventListener('visibilitychange',()=>{if(!document.hidden&&state.password)refresh(true)});const saved=sessionStorage.getItem('aau_control_room_password');if(saved){state.password=saved;Promise.all([api('mode=system'),api('mode=snapshot')]).then(()=>{$('#login').style.display='none';refresh(false);state.timer=setInterval(()=>{if(!document.hidden)refresh(true)},15000)}).catch(()=>{state.password=null;sessionStorage.removeItem('aau_control_room_password')})}
</script>
</body>
</html>
