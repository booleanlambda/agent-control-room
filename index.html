<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AAU Agent Control Room</title>
<style>
:root{--bg:#070a0f;--panel:#0d121b;--line:#202b3b;--text:#edf3fb;--muted:#8fa0b7;--accent:#7dd3fc;--good:#5ee6a8;--warn:#f5c45e;--bad:#ff7b88;--violet:#b8a7ff}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 15% -10%,#142438 0,transparent 30%),var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif}.wrap{max-width:1540px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;gap:18px;align-items:flex-start}.top h1{margin:0;font-size:28px}.sub,.muted{color:var(--muted);font-size:12px}.live{display:flex;gap:8px;align-items:center;color:var(--muted)}.dot{width:9px;height:9px;border-radius:50%;background:var(--good);box-shadow:0 0 16px rgba(94,230,168,.7)}.dot.bad{background:var(--bad)}.banner{margin:16px 0;padding:13px 15px;border:1px solid rgba(94,230,168,.35);background:rgba(94,230,168,.06);border-radius:14px}.banner.bad{border-color:rgba(255,123,136,.4);background:rgba(255,123,136,.08)}.banner strong{font-size:13px}.metrics{display:grid;grid-template-columns:repeat(6,1fr);gap:11px;margin:14px 0}.metric,.panel,.card{background:linear-gradient(180deg,rgba(16,23,34,.96),rgba(10,15,23,.96));border:1px solid var(--line);border-radius:15px}.metric{padding:14px}.k{font-size:9px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}.v{font-size:18px;font-weight:700;margin-top:6px;overflow-wrap:anywhere}.s{font-size:10px;color:var(--muted);margin-top:4px}.system{display:grid;grid-template-columns:1.25fr .75fr;gap:12px}.panel{padding:15px}.panel h2{margin:0 0 11px;font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.kv>div{background:#0a1018;border:1px solid #192434;border-radius:10px;padding:9px}.good{color:var(--good)}.warn{color:var(--warn)}.badtext{color:var(--bad)}.accent{color:var(--accent)}.mono{font-family:ui-monospace,monospace;font-size:11px}.focus-name{font-size:23px;font-weight:750}.focus-label{font-size:11px;color:var(--muted);margin-top:2px}.focus-model{font-size:11px;color:var(--accent);margin:6px 0;overflow-wrap:anywhere}.reason{font-size:12px;line-height:1.5;color:#c5d0de;margin-top:8px}.stage{display:inline-flex;align-items:center;border:1px solid #31435b;border-radius:999px;padding:4px 8px;font-size:10px;color:var(--violet);margin-top:7px}.toolbar{display:flex;gap:9px;margin:16px 0}.toolbar input,.toolbar select,.toolbar button{background:#0d121b;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px}.toolbar input{flex:1}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{padding:14px;text-align:left;color:inherit;cursor:pointer}.card.current{border-color:rgba(125,211,252,.5)}.head{display:flex;justify-content:space-between;gap:10px}.name{font-weight:700}.internal{font-size:10px;color:var(--muted);margin-top:2px}.pill{font-size:9px;border:1px solid var(--line);border-radius:999px;padding:4px 7px;color:var(--muted)}.pill.current{color:var(--accent)}.pill.paused{color:var(--warn)}.pill.sleeping{color:var(--violet)}.action{font-size:12px;color:#cbd6e5;line-height:1.45;margin:12px 0;min-height:36px}.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.mini>div{background:#0a1018;border:1px solid #192434;border-radius:8px;padding:7px}.nextline{margin-top:9px;border-top:1px solid #172231;padding-top:9px;font-size:10px;color:var(--muted)}.error{display:none;margin:12px 0;padding:10px;border:1px solid rgba(255,123,136,.4);border-radius:10px;color:#ffc2c8}.login{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:#070a0f}.loginbox{width:min(420px,92vw);padding:22px;background:#0d121b;border:1px solid var(--line);border-radius:16px}.loginbox input,.loginbox button{width:100%;padding:11px;margin-top:9px;border-radius:10px;border:1px solid var(--line);background:#080d14;color:var(--text)}.drawerbg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:30}.drawer{position:fixed;right:0;top:0;height:100vh;width:min(760px,96vw);background:#090e15;border-left:1px solid var(--line);z-index:31;transform:translateX(105%);transition:.2s;overflow:auto;padding:22px}.drawer.open{transform:none}.drawerbg.open{display:block}.close{float:right;background:#111824;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px 11px}.timeline{display:flex;flex-direction:column;gap:8px;margin-top:12px}.event{background:#0d141e;border:1px solid #192638;border-radius:10px;padding:10px}.event b{font-size:12px}.event div{font-size:11px;color:#b8c5d6;margin-top:4px;white-space:pre-wrap}.chips{display:flex;gap:7px;flex-wrap:wrap}.chip{font-size:10px;border:1px solid #26364a;background:#101927;border-radius:999px;padding:6px 9px;color:#cbd6e5}.empty{padding:35px;text-align:center;color:var(--muted)}h3{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin:20px 0 9px}
@media(max-width:1050px){.metrics{grid-template-columns:repeat(3,1fr)}.system{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:650px){.wrap{padding:15px}.metrics{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.kv{grid-template-columns:1fr}.toolbar{flex-wrap:wrap}.toolbar input{flex-basis:100%}}
</style></head><body>
<div class="login" id="login"><div class="loginbox"><h2>AAU Agent Control Room</h2><div class="sub">Read-only operator view of autonomous Next Intent execution.</div><input id="pw" type="password" placeholder="Control Room password"><button id="loginBtn">Open Control Room</button><div id="loginMsg" class="badtext"></div></div></div>
<div class="wrap"><div class="top"><div><h1>AAU Agent Control Room</h1><div class="sub">Next Intent runtime · lifecycle · existence · homeostasis</div></div><div class="live"><span id="dot" class="dot"></span><span id="liveText">Locked</span></div></div><div id="error" class="error"></div><div id="banner" class="banner"></div><div id="metrics" class="metrics"></div><div class="system"><section class="panel"><h2>Intent runtime</h2><div id="runtime" class="kv"></div></section><section class="panel"><h2>Current agent</h2><div id="experiment"></div></section></div><div class="toolbar"><input id="search" placeholder="Search agents, stage, focus or action…"><select id="filter"><option value="current">Current experiment</option><option value="paused">Paused population</option><option value="all">All agents</option><option value="archived">Archived</option></select><button id="refresh">Refresh</button></div><div id="grid" class="grid"></div></div>
<div id="drawerbg" class="drawerbg"></div><aside id="drawer" class="drawer"><button id="close" class="close">×</button><div id="drawerbody"></div></aside>
<script>
const API='https://mgtilfgygzymxiyixjit.supabase.co/functions/v1/agent-control-room-api';
const st={pw:null,snap:null,sys:null,filter:'current',q:'',timer:null};const $=x=>document.querySelector(x);const esc=x=>String(x??'');
const nice=x=>esc(x).replace(/^agent_/,'Agent ').split('_').map(y=>y.charAt(0).toUpperCase()+y.slice(1)).join(' ');const stageName=x=>nice(x||'—');const fmt=x=>Number.isFinite(Number(x))?Number(x).toLocaleString():'—';const pct=x=>Number.isFinite(Number(x))?Math.round(Number(x)*100)+'%':'—';const when=x=>x?new Date(x).toLocaleString():'none';
const rel=x=>{if(!x)return'none';let s=(new Date(x)-Date.now())/1000,a=Math.abs(s),v,u;if(a<60){v=Math.round(a);u='sec'}else if(a<3600){v=Math.round(a/60);u='min'}else if(a<86400){v=Math.round(a/3600);u='hr'}else{v=Math.round(a/86400);u='day'}return s>=0?`in ${v} ${u}${v===1?'':'s'}`:`${v} ${u}${v===1?'':'s'} ago`};
function auth(){return'Basic '+btoa('operator:'+st.pw)}async function api(q){const r=await fetch(API+'?'+q,{headers:{Authorization:auth()},cache:'no-store'});if(r.status===401)throw new Error('Invalid password');if(!r.ok)throw new Error('Request failed: '+r.status);return r.json()}
function box(k,v,s=''){const d=document.createElement('div');d.innerHTML=`<div class="k">${esc(k)}</div><div class="v ${s}">${esc(v)}</div>`;return d}function metric(k,v,s){const d=box(k,v);d.className='metric';d.insertAdjacentHTML('beforeend',`<div class="s">${esc(s)}</div>`);return d}function currentId(){return st.sys?.current_agent?.agent_id}function displayName(a){return a?.public_name||nice(a?.internal_label||'—')}
function loopObj(s){return s.intent_loop||s.wake_loop||{}}function runObj(a){return a?.autonomous_run||{}}function intentCount(a){return a?.intent_execution_count??a?.wake_number??runObj(a).intent_execution_count??runObj(a).wake_count}function nextAt(a){return a?.next_intent?.execute_at||a?.next_intent_execution?.execute_at||a?.next_time_intent_at||a?.next_queued_execute_at||a?.next_time_wake_at||a?.next_queued_due_at||runObj(a).next_intent_at||runObj(a).next_wake_at}function pendingIntent(a){return a?.intent_pending??a?.wake_pending??false}
function render(){const s=st.sys||{},loop=loopObj(s),a=s.current_agent||{},run=runObj(a),next=nextAt(a),healthy=loop.state==='running',activeName=displayName(a);$('#banner').className='banner'+(healthy?'':' bad');$('#banner').innerHTML=`<strong>${healthy?'Next Intent lifecycle running':loop.state==='paused'?'Next Intent lifecycle paused':'Next Intent lifecycle requires attention'}</strong><div class="sub">${esc(loop.reason||(loop.rabbitmq_intent_consumer_bound?'aau.intent consumer live.':'Intent execution path status unavailable.'))}</div>`;$('#dot').className='dot'+(healthy?'':' bad');
$('#metrics').replaceChildren(metric('Current agent',activeName,a.internal_label?nice(a.internal_label):'isolated experiment'),metric('Intent executions',fmt(run.intent_execution_count??run.wake_count),'completed cognition cycles'),metric('Lifecycle stage',stageName(a.lifecycle_stage),'mandatory lifecycle'),metric('Compute',fmt(a.resources?.compute?.balance??st.snap?.agents?.find(x=>x.agent_id===a.agent_id)?.resources?.compute?.balance),'existence resource'),metric('Next intent',next?rel(next):'none',when(next)),metric('Intent loop',esc(loop.state||'unknown').toUpperCase(),loop.rabbitmq_intent_consumer_bound?'worker live':loop.worker_hibernation_safe?'armed + revivable':'execution path unavailable'));
const r=$('#runtime');r.replaceChildren(box('Protocol',s.protocol_version||loop.protocol_version||'next_intent_protocol_v0_1','accent'),box('Runtime mode',s.runtime_mode||'—'),box('Provider',s.experimental_runtime?.provider||'—',s.experimental_runtime?.provider==='nvidia_direct'?'good':''),box('Intent route',loop.routing_key||'aau.intent','mono'),box('Intent worker',loop.rabbitmq_intent_consumer_bound?'LIVE':loop.worker_hibernation_safe?'HIBERNATING / REVIVABLE':'OFFLINE',loop.rabbitmq_intent_consumer_bound||loop.worker_hibernation_safe?'good':'badtext'),box('Rabbit intent armed',loop.rabbit_intent_armed?'YES':'NO',loop.rabbit_intent_armed?'good':'warn'),box('Lifecycle monitor',s.cron?.lifecycle_monitor?'ON':'OFF',s.cron?.lifecycle_monitor?'good':'badtext'),box('Existence levy',s.cron?.existence_levy?'ON':'OFF',s.cron?.existence_levy?'good':'badtext'),box('Global population pause',s.global_population_pause?'ON':'OFF',s.global_population_pause?'warn':'good'),box('Legacy activation cron',s.cron?.legacy_wake_activator?'ON':'OFF'),box('Legacy executor cron',s.cron?.legacy_wake_executor?'ON':'OFF'),box('Worker heartbeat',loop.worker_heartbeat_at?rel(loop.worker_heartbeat_at):'none'));
const lc=a.last_cognition||{},intent=a.next_intent||{},e=$('#experiment');e.innerHTML=`<div class="focus-name">${esc(activeName)}</div><div class="focus-label">${esc(nice(a.internal_label||''))}</div><div class="stage">${esc(stageName(a.lifecycle_stage))}</div><div class="focus-model">${esc(a.primary_model_id||'—')}</div><div class="reason"><b>${esc(lc.selected_action||'No cognition yet')}</b><br>${esc(lc.output_summary?.stated_reason||'')}</div><div class="reason"><b>Homeostasis:</b> energy ${esc(pct(a.energy))} · stress ${esc(pct(a.stress))} · ${a.sleeping?'sleeping':a.awake?'awake':'inactive'}</div><div class="reason"><b>Existence:</b> ${esc(a.existence_account_state||'—')}</div><div class="reason ${next?'good':'badtext'}">${next?`Next Intent: ${esc(intent.intent_reason||'scheduled continuation')} · ${when(next)}`:'No active Next Intent'}</div>`;renderGrid();$('#liveText').textContent='Live · '+new Date(s.generated_at||Date.now()).toLocaleTimeString()}
function status(a){if(a.lifecycle_status==='archived')return['Archived',''];if(a.sleeping)return['Sleeping','sleeping'];if(a.agent_id===currentId())return['Autonomous','current'];return st.sys?.global_population_pause?['Paused','paused']:['Idle','']}
function renderGrid(){let xs=[...(st.snap?.agents||[])],q=st.q.toLowerCase();if(q)xs=xs.filter(a=>[a.internal_label,a.public_name,a.lifecycle_stage,a.current_focus,a.last_action].some(v=>esc(v).toLowerCase().includes(q)));if(st.filter==='current')xs=xs.filter(a=>a.agent_id===currentId());if(st.filter==='paused')xs=xs.filter(a=>a.lifecycle_status!=='archived'&&a.agent_id!==currentId());if(st.filter==='archived')xs=xs.filter(a=>a.lifecycle_status==='archived');const g=$('#grid');g.replaceChildren();if(!xs.length){g.innerHTML='<div class="empty">No agents match this view.</div>';return}for(const a of xs){const [label,cls]=status(a),c=document.createElement('button'),next=nextAt(a);c.className='card '+(a.agent_id===currentId()?'current':'');c.innerHTML=`<div class="head"><div><div class="name">${esc(displayName(a))}</div><div class="internal">${esc(nice(a.internal_label))}</div></div><span class="pill ${cls}">${label}</span></div><div class="stage">${esc(stageName(a.lifecycle_stage))}</div><div class="action">${esc(a.last_action||a.current_focus||'No action recorded.')}</div><div class="mini"><div><div class="k">Executions</div><div class="v">${fmt(intentCount(a))}</div></div><div><div class="k">Compute</div><div class="v">${fmt(a.resources?.compute?.balance)}</div></div><div><div class="k">Energy / stress</div><div class="v" style="font-size:11px">${pct(a.energy)} / ${pct(a.stress)}</div></div></div><div class="nextline">${next?`Next Intent ${rel(next)} · ${when(next)}`:pendingIntent(a)?'Intent pending':'No active Next Intent'}</div>`;c.onclick=()=>openAgent(a.agent_id);g.append(c)}}
async function refresh(silent=false){try{[st.snap,st.sys]=await Promise.all([api('mode=snapshot&_='+Date.now()),api('mode=system&_='+Date.now())]);render();$('#error').style.display='none'}catch(e){if(!silent){$('#error').textContent=e.message;$('#error').style.display='block'}$('#liveText').textContent='Connection issue'}}
async function openAgent(id){$('#drawerbg').classList.add('open');$('#drawer').classList.add('open');$('#drawerbody').innerHTML='<div class="empty">Loading…</div>';try{const d=await api('mode=agent&id='+encodeURIComponent(id)+'&_='+Date.now()),a=d.status||{},next=d.next_intents?.[0],exec=d.intent_executions?.[0];let html=`<h2>${esc(displayName(a))}</h2><div class="sub">${esc(nice(a.internal_label||'agent'))} · ${status(a)[0]}</div><div class="stage">${esc(stageName(a.lifecycle_stage))}</div><div class="kv" style="margin-top:15px"><div><div class="k">Intent executions</div><div class="v">${fmt(intentCount(a))}</div></div><div><div class="k">Energy</div><div class="v">${pct(a.energy)}</div></div><div><div class="k">Stress</div><div class="v">${pct(a.stress)}</div></div><div><div class="k">Sleep state</div><div class="v">${a.sleeping?'SLEEPING':a.awake?'AWAKE':'INACTIVE'}</div></div><div><div class="k">Existence</div><div class="v">${esc(a.existence_account_state||'—')}</div></div><div><div class="k">Compute</div><div class="v">${fmt(a.resources?.compute?.balance)}</div></div></div>`;
html+=`<h3>Lifecycle</h3><div class="chips"><span class="chip">Identity ${esc(a.identity_status||'—')}</span><span class="chip">Embodiment ${esc(a.embodiment_status||'—')}</span><span class="chip">Expertise ${esc(a.expertise_status||'—')}</span></div>`;
html+=`<h3>Next Intent</h3><div class="event"><b>${esc(next?.intent_reason||'No active Next Intent')}</b><div>${next?`${esc(next.intent_kind)} · ${when(next.execute_at)} · priority ${fmt((next.priority||0)*100)}%`:''}</div></div>`;
if(exec)html+=`<h3>Latest intent execution</h3><div class="event"><b>${esc(exec.status||'—')}</b><div>${esc(exec.intent_execution_id||'')}<br>${when(exec.execute_at)}${exec.last_error?'<br>'+esc(exec.last_error):''}</div></div>`;
html+='<h3>Timeline</h3><div class="timeline">';for(const ev of d.timeline||[])html+=`<div class="event"><b>${esc(ev.title||ev.event_kind)}</b><div>${esc(ev.detail||'')}</div><div>${when(ev.occurred_at)}</div></div>`;html+='</div>';$('#drawerbody').innerHTML=html}catch(e){$('#drawerbody').textContent=e.message}}
async function login(){st.pw=$('#pw').value;$('#loginMsg').textContent='Checking…';try{await api('mode=system');sessionStorage.setItem('aau_control_room_password',st.pw);$('#login').style.display='none';$('#loginMsg').textContent='';await refresh();st.timer=setInterval(()=>{if(!document.hidden)refresh(true)},15000)}catch(e){st.pw=null;$('#loginMsg').textContent=e.message}}
$('#loginBtn').onclick=login;$('#pw').onkeydown=e=>{if(e.key==='Enter')login()};$('#refresh').onclick=()=>refresh();$('#filter').onchange=e=>{st.filter=e.target.value;renderGrid()};$('#search').oninput=e=>{st.q=e.target.value;renderGrid()};$('#close').onclick=$('#drawerbg').onclick=()=>{$('#drawerbg').classList.remove('open');$('#drawer').classList.remove('open')};const saved=sessionStorage.getItem('aau_control_room_password');if(saved){st.pw=saved;api('mode=system').then(()=>{$('#login').style.display='none';refresh();st.timer=setInterval(()=>{if(!document.hidden)refresh(true)},15000)}).catch(()=>sessionStorage.removeItem('aau_control_room_password'))}
</script></body></html>
