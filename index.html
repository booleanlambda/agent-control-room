<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AAU Agent Control Room</title>
<style>
:root{--bg:#070a0f;--panel:#0d121b;--line:#202b3b;--text:#edf3fb;--muted:#8fa0b7;--accent:#7dd3fc;--good:#5ee6a8;--warn:#f5c45e;--bad:#ff7b88;--violet:#b8a7ff}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 15% -10%,#142438 0,transparent 30%),var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif}
button,input,textarea,select{font:inherit}.wrap{max-width:1540px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;gap:18px;align-items:flex-start}.top h1{margin:0;font-size:28px}.sub,.muted{color:var(--muted);font-size:12px}
.live{display:flex;gap:8px;align-items:center;color:var(--muted)}.dot{width:9px;height:9px;border-radius:50%;background:var(--good);box-shadow:0 0 16px rgba(94,230,168,.7)}.dot.bad{background:var(--bad)}
.banner{margin:16px 0;padding:13px 15px;border:1px solid rgba(94,230,168,.35);background:rgba(94,230,168,.06);border-radius:14px}.banner.bad{border-color:rgba(255,123,136,.4);background:rgba(255,123,136,.08)}
.metrics{display:grid;grid-template-columns:repeat(6,1fr);gap:11px;margin:14px 0}.metric,.panel,.card{background:linear-gradient(180deg,rgba(16,23,34,.96),rgba(10,15,23,.96));border:1px solid var(--line);border-radius:15px}.metric{padding:14px}
.k{font-size:9px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}.v{font-size:18px;font-weight:700;margin-top:6px;overflow-wrap:anywhere}.s{font-size:10px;color:var(--muted);margin-top:4px}
.system{display:grid;grid-template-columns:1.15fr .85fr;gap:12px}.panel{padding:15px}.panel h2{margin:0 0 11px;font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.kv>div{background:#0a1018;border:1px solid #192434;border-radius:10px;padding:9px}
.good{color:var(--good)}.warn{color:var(--warn)}.badtext{color:var(--bad)}.accent{color:var(--accent)}.mono{font-family:ui-monospace,monospace;font-size:11px}
.identity{display:flex;gap:12px;align-items:center}.identity-copy{min-width:0}.focus-name{font-size:23px;font-weight:750}.focus-label{font-size:11px;color:var(--muted);margin-top:2px}.focus-model{font-size:11px;color:var(--accent);margin:7px 0;overflow-wrap:anywhere}
.avatar{width:58px;height:58px;border-radius:50%;object-fit:cover;border:1px solid #31435b;background:#0a1018;flex:none}.avatar.sm{width:42px;height:42px}.avatar.lg{width:76px;height:76px}.avatarph{display:grid;place-items:center;color:var(--muted);font-weight:700}
.profile-state{font-size:9px;color:var(--muted);margin-top:4px}.reason{font-size:12px;line-height:1.5;color:#c5d0de;margin-top:8px}
.stage{display:inline-flex;align-items:center;border:1px solid #31435b;border-radius:999px;padding:4px 8px;font-size:10px;color:var(--violet);margin-top:7px}
.toolbar,.controls{display:flex;gap:9px;flex-wrap:wrap}.toolbar{margin:16px 0}.toolbar input,.toolbar select,.toolbar button,.controlbtn,.sendbtn{background:#0d121b;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px}.toolbar input{flex:1}
.controlbtn{cursor:pointer}.controlbtn.pause{border-color:rgba(245,196,94,.5);color:var(--warn)}.controlbtn.unpause{border-color:rgba(94,230,168,.5);color:var(--good)}.controlbtn:disabled,.sendbtn:disabled{opacity:.45;cursor:not-allowed}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{padding:14px;text-align:left;color:inherit;cursor:pointer}.card.current{border-color:rgba(125,211,252,.5)}
.head{display:flex;justify-content:space-between;gap:10px}.name{font-weight:700}.internal{font-size:10px;color:var(--muted);margin-top:2px}.pill{font-size:9px;border:1px solid var(--line);border-radius:999px;padding:4px 7px;color:var(--muted);white-space:nowrap}.pill.current{color:var(--accent)}.pill.paused{color:var(--warn)}.pill.sleeping{color:var(--violet)}
.action{font-size:12px;color:#cbd6e5;line-height:1.45;margin:12px 0;min-height:36px}.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.mini>div{background:#0a1018;border:1px solid #192434;border-radius:8px;padding:7px}.nextline{margin-top:9px;border-top:1px solid #172231;padding-top:9px;font-size:10px;color:var(--muted)}
.error{display:none;margin:12px 0;padding:10px;border:1px solid rgba(255,123,136,.4);border-radius:10px;color:#ffc2c8}
.login{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:#070a0f}.loginbox{width:min(420px,92vw);padding:22px;background:#0d121b;border:1px solid var(--line);border-radius:16px}.loginbox input,.loginbox button{width:100%;padding:11px;margin-top:9px;border-radius:10px;border:1px solid var(--line);background:#080d14;color:var(--text)}
.drawerbg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:30}.drawer{position:fixed;right:0;top:0;height:100vh;width:min(800px,96vw);background:#090e15;border-left:1px solid var(--line);z-index:31;transform:translateX(105%);transition:.2s;overflow:auto;padding:22px}.drawer.open{transform:none}.drawerbg.open{display:block}.close{float:right;background:#111824;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px 11px;cursor:pointer}
.timeline{display:flex;flex-direction:column;gap:8px;margin-top:12px}.event{background:#0d141e;border:1px solid #192638;border-radius:10px;padding:10px}.event b{font-size:12px}.event div{font-size:11px;color:#b8c5d6;margin-top:4px;white-space:pre-wrap}.chips{display:flex;gap:7px;flex-wrap:wrap}.chip{font-size:10px;border:1px solid #26364a;background:#101927;border-radius:999px;padding:6px 9px;color:#cbd6e5}.empty{padding:25px;text-align:center;color:var(--muted)}
.chat{border:1px solid #1b2a3d;border-radius:13px;background:#080d14;overflow:hidden}.chatlog{max-height:360px;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:10px}.msg{max-width:88%;padding:9px 11px;border-radius:12px;font-size:12px;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere}.msg.admin{align-self:flex-end;background:#10253a;border:1px solid #1d4768}.msg.agent{align-self:flex-start;background:#151c26;border:1px solid #263244}.msgmeta{font-size:9px;color:var(--muted);margin-top:5px}.composer{display:flex;gap:8px;border-top:1px solid #1b2a3d;padding:10px}.composer textarea{flex:1;resize:vertical;min-height:62px;max-height:180px;background:#0d121b;border:1px solid var(--line);border-radius:10px;color:var(--text);padding:10px}.sendbtn{min-width:90px;cursor:pointer;border-color:rgba(125,211,252,.45);color:var(--accent)}
.notice{font-size:10px;color:var(--muted);margin:8px 0}.actionrow{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-top:14px;flex-wrap:wrap}
h3{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin:20px 0 9px}
@media(max-width:1050px){.metrics{grid-template-columns:repeat(3,1fr)}.system{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:650px){.wrap{padding:15px}.metrics{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.kv{grid-template-columns:1fr}.toolbar{flex-wrap:wrap}.toolbar input{flex-basis:100%}.avatar.lg{width:64px;height:64px}.composer{flex-direction:column}.sendbtn{width:100%}}
</style>
</head>
<body>
<div class="login" id="login"><div class="loginbox"><h2>AAU Agent Control Room</h2><div class="sub">Admin console for autonomous Next Intent execution.</div><input id="pw" type="password" placeholder="Control Room password"><button id="loginBtn">Open Control Room</button><div id="loginMsg" class="badtext"></div></div></div>
<div class="wrap">
  <div class="top"><div><h1>AAU Agent Control Room</h1><div class="sub">Next Intent · lifecycle · existence · expertise · admin chat</div></div><div class="live"><span id="dot" class="dot"></span><span id="liveText">Locked</span></div></div>
  <div id="error" class="error"></div><div id="banner" class="banner"></div><div id="metrics" class="metrics"></div>
  <div class="system"><section class="panel"><h2>Intent runtime</h2><div id="runtime" class="kv"></div></section><section class="panel"><h2>Current agent</h2><div id="experiment"></div></section></div>
  <div class="toolbar"><input id="search" placeholder="Search agents, stage, focus or action…"><select id="filter"><option value="current">Current experiment</option><option value="paused">Paused population</option><option value="all">All agents</option><option value="archived">Archived</option></select><button id="refresh">Refresh</button></div>
  <div id="grid" class="grid"></div>
</div>
<div id="drawerbg" class="drawerbg"></div><aside id="drawer" class="drawer"><button id="close" class="close">×</button><div id="drawerbody"></div></aside>
<script>
const API='https://mgtilfgygzymxiyixjit.supabase.co/functions/v1/agent-control-room-api';
const st={pw:null,snap:null,sys:null,filter:'current',q:'',timer:null,drawerAgentId:null,drawerTimer:null};
const $=x=>document.querySelector(x);const raw=x=>String(x??'');const esc=x=>raw(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nice=x=>raw(x).replace(/^agent_/,'Agent ').split('_').map(y=>y.charAt(0).toUpperCase()+y.slice(1)).join(' ');
const stageName=x=>nice(x||'—');const fmt=x=>Number.isFinite(Number(x))?Number(x).toLocaleString():'—';const pct=x=>Number.isFinite(Number(x))?Math.round(Number(x)*100)+'%':'—';
const when=x=>x?new Date(x).toLocaleString():'none';const rel=x=>{if(!x)return'none';let s=(new Date(x)-Date.now())/1000,a=Math.abs(s),v,u;if(a<60){v=Math.round(a);u='sec'}else if(a<3600){v=Math.round(a/60);u='min'}else if(a<86400){v=Math.round(a/3600);u='hr'}else{v=Math.round(a/86400);u='day'}return s>=0?`in ${v} ${u}${v===1?'':'s'}`:`${v} ${u}${v===1?'':'s'} ago`};
function auth(){return'Basic '+btoa('operator:'+st.pw)}
async function api(q,{method='GET',body=null}={}){const r=await fetch(API+'?'+q,{method,headers:{Authorization:auth(),...(body?{'content-type':'application/json'}:{})},body:body?JSON.stringify(body):null,cache:'no-store'});let data=null;try{data=await r.json()}catch{}if(r.status===401)throw new Error('Invalid password');if(!r.ok)throw new Error(data?.detail||data?.error||('Request failed: '+r.status));return data}
function displayName(a){return a?.public_name||nice(a?.internal_label||'—')}
function avatar(a,cls=''){const n=displayName(a),u=a?.pseudo_profile_image_url;if(u)return `<img class="avatar ${cls}" src="${esc(u)}" alt="${esc(n)} pseudo profile picture">`;return `<div class="avatar avatarph ${cls}" title="Embodiment image pending">${esc((n||'?').trim().charAt(0).toUpperCase()||'?')}</div>`}
function box(k,v,s=''){const d=document.createElement('div');d.innerHTML=`<div class="k">${esc(k)}</div><div class="v ${s}">${esc(v)}</div>`;return d}
function metric(k,v,s){const d=box(k,v);d.className='metric';d.insertAdjacentHTML('beforeend',`<div class="s">${esc(s)}</div>`);return d}
function currentId(){return st.sys?.current_agent?.agent_id}function runObj(a){return a?.autonomous_run||{}}function intentCount(a){return a?.intent_execution_count??runObj(a).intent_execution_count??0}
function nextAt(a){return a?.next_intent?.execute_at||a?.next_intent_execution?.execute_at||a?.next_time_intent_at||a?.next_queued_execute_at||runObj(a).next_intent_at}
function isPaused(a){return Boolean(a?.system_paused)||a?.autonomous_lifecycle?.status==='paused'||a?.lifecycle_run_status==='paused'||a?.operator_pause===true}
function pendingIntent(a){return Boolean(a?.intent_pending)}
function status(a){if(a?.lifecycle_status==='archived')return['Archived',''];if(isPaused(a))return['Paused','paused'];if(a?.sleeping)return['Sleeping','sleeping'];if(a?.agent_id===currentId())return['Autonomous','current'];return['Idle','']}
function controlsHtml(a,idPrefix=''){const paused=isPaused(a);return `<div class="controls"><button class="controlbtn pause" id="${idPrefix}pauseBtn" ${paused?'disabled':''}>Pause</button><button class="controlbtn unpause" id="${idPrefix}unpauseBtn" ${paused?'':'disabled'}>Unpause</button></div>`}
async function controlAgent(id,action){const label=action==='pause'?'pause':'unpause';if(action==='pause'&&!confirm('Pause this agent? Existence levy and active intents will be frozen/cancelled.'))return;try{await api('mode=control',{method:'POST',body:{id,action,reason:'agent_control_room_admin_'+label}});await refresh(true);if(st.drawerAgentId===id)await openAgent(id,true)}catch(e){showError(e.message)}}
function bindControlButtons(a,idPrefix=''){const p=document.getElementById(idPrefix+'pauseBtn'),u=document.getElementById(idPrefix+'unpauseBtn');if(p)p.onclick=()=>controlAgent(a.agent_id,'pause');if(u)u.onclick=()=>controlAgent(a.agent_id,'unpause')}
function showError(msg){const e=$('#error');e.textContent=msg;e.style.display='block'}
function render(){const s=st.sys||{},loop=s.intent_loop||{},a=s.current_agent||{},run=runObj(a),next=nextAt(a),healthy=loop.state==='running',activeName=displayName(a),snapAgent=(st.snap?.agents||[]).find(x=>x.agent_id===a.agent_id)||{};const pic={...snapAgent,...a};
$('#banner').className='banner'+(healthy?'':' bad');$('#banner').innerHTML=`<strong>${healthy?'Next Intent lifecycle running':loop.state==='paused'?'Next Intent lifecycle paused':'Next Intent lifecycle requires attention'}</strong><div class="sub">${esc(loop.reason||(loop.rabbitmq_intent_consumer_bound?'aau.intent consumer live.':'Intent execution path status unavailable.'))}</div>`;$('#dot').className='dot'+(healthy?'':' bad');
$('#metrics').replaceChildren(metric('Current agent',activeName,a.internal_label?nice(a.internal_label):'isolated experiment'),metric('Intent executions',fmt(run.intent_execution_count??intentCount(snapAgent)),'completed cognition cycles'),metric('Lifecycle stage',stageName(a.lifecycle_stage),'mandatory lifecycle'),metric('Compute',fmt(snapAgent.resources?.compute?.balance),'existence resource'),metric('Next intent',next?rel(next):'none',when(next)),metric('Intent loop',raw(loop.state||'unknown').toUpperCase(),loop.rabbitmq_intent_consumer_bound?'worker live':loop.worker_hibernation_safe?'armed + revivable':'execution path unavailable'));
$('#runtime').replaceChildren(box('Protocol',s.protocol_version||loop.protocol_version||'next_intent_protocol_v0_1','accent'),box('Runtime mode',s.runtime_mode||'—'),box('Provider',s.experimental_runtime?.provider||'—'),box('Intent route',loop.routing_key||'aau.intent','mono'),box('Intent worker',loop.rabbitmq_intent_consumer_bound?'LIVE':loop.worker_hibernation_safe?'HIBERNATING / REVIVABLE':'OFFLINE',loop.rabbitmq_intent_consumer_bound||loop.worker_hibernation_safe?'good':'badtext'),box('Rabbit intent armed',loop.rabbit_intent_armed?'YES':'NO',loop.rabbit_intent_armed?'good':'warn'),box('Lifecycle monitor',s.cron?.lifecycle_monitor?'ON':'OFF'),box('Existence levy',s.cron?.existence_levy?'ON':'OFF'),box('Worker heartbeat',loop.worker_heartbeat_at?rel(loop.worker_heartbeat_at):'none'));
const lc=a.last_cognition||{},intent=a.next_intent||{},e=$('#experiment');e.innerHTML=`<div class="identity">${avatar(pic,'lg')}<div class="identity-copy"><div class="focus-name">${esc(activeName)}</div><div class="focus-label">${esc(nice(a.internal_label||''))}</div><div class="stage">${esc(stageName(a.lifecycle_stage))}</div><div class="profile-state">Pseudo profile: ${pic.pseudo_profile_ready?'ready':'embodiment image pending'}</div></div></div><div class="focus-model">${esc(a.primary_model_id||'—')}</div><div class="reason"><b>${esc(lc.selected_action||'No cognition yet')}</b><br>${esc(lc.output_summary?.stated_reason||'')}</div><div class="reason"><b>Homeostasis:</b> energy ${esc(pct(a.energy))} · stress ${esc(pct(a.stress))} · ${a.sleeping?'sleeping':a.awake?'awake':'inactive'}</div><div class="reason"><b>Existence:</b> ${esc(a.existence_account_state||'—')}</div><div class="reason ${next?'good':'badtext'}">${next?`Next Intent: ${esc(intent.intent_reason||'scheduled continuation')} · ${when(next)}`:'No active Next Intent'}</div><div class="actionrow">${controlsHtml({...snapAgent,...a},'current')}<button class="controlbtn" id="currentChatBtn">Open chat</button></div>`;
bindControlButtons({...snapAgent,...a},'current');const cb=$('#currentChatBtn');if(cb)cb.onclick=()=>openAgent(a.agent_id);
renderGrid();$('#liveText').textContent='Live · '+new Date(s.generated_at||Date.now()).toLocaleTimeString()}
function renderGrid(){let xs=[...(st.snap?.agents||[])],q=st.q.toLowerCase();if(q)xs=xs.filter(a=>[a.internal_label,a.public_name,a.lifecycle_stage,a.current_focus,a.last_action].some(v=>raw(v).toLowerCase().includes(q)));if(st.filter==='current')xs=xs.filter(a=>a.agent_id===currentId());if(st.filter==='paused')xs=xs.filter(a=>isPaused(a));if(st.filter==='archived')xs=xs.filter(a=>a.lifecycle_status==='archived');const g=$('#grid');g.replaceChildren();if(!xs.length){g.innerHTML='<div class="empty">No agents match this view.</div>';return}for(const a of xs){const [label,cls]=status(a),c=document.createElement('button'),next=nextAt(a);c.className='card '+(a.agent_id===currentId()?'current':'');c.innerHTML=`<div class="head"><div class="identity">${avatar(a,'sm')}<div class="identity-copy"><div class="name">${esc(displayName(a))}</div><div class="internal">${esc(nice(a.internal_label))}</div><div class="profile-state">${a.pseudo_profile_ready?'Pseudo profile ready':'Embodiment image pending'}</div></div></div><span class="pill ${cls}">${label}</span></div><div class="stage">${esc(stageName(a.lifecycle_stage))}</div><div class="action">${esc(a.last_action||a.current_focus||'No action recorded.')}</div><div class="mini"><div><div class="k">Executions</div><div class="v">${fmt(intentCount(a))}</div></div><div><div class="k">Compute</div><div class="v">${fmt(a.resources?.compute?.balance)}</div></div><div><div class="k">Energy / stress</div><div class="v" style="font-size:11px">${pct(a.energy)} / ${pct(a.stress)}</div></div></div><div class="nextline">${next?`Next Intent ${rel(next)} · ${when(next)}`:pendingIntent(a)?'Intent pending':'No active Next Intent'}</div>`;c.onclick=()=>openAgent(a.agent_id);g.append(c)}}
async function refresh(silent=false){try{[st.snap,st.sys]=await Promise.all([api('mode=snapshot&_='+Date.now()),api('mode=system&_='+Date.now())]);render();$('#error').style.display='none'}catch(e){if(!silent)showError(e.message);$('#liveText').textContent='Connection issue'}}
function chatHtml(chat){const msgs=Array.isArray(chat?.messages)?chat.messages:[];if(!msgs.length)return '<div class="empty">No admin chat yet.</div>';return msgs.map(m=>`<div class="msg ${m.sender_kind==='admin'?'admin':'agent'}"><div>${esc(m.content||'')}</div><div class="msgmeta">${m.sender_kind==='admin'?'Admin':'Agent'} · ${esc(m.delivery_status||'')} · ${when(m.created_at)}</div></div>`).join('')}
async function sendChat(id){const ta=$('#chatInput'),btn=$('#sendChatBtn');const message=raw(ta?.value).trim();if(!message)return;btn.disabled=true;try{await api('mode=chat',{method:'POST',body:{id,message}});ta.value='';await loadChat(id);await refresh(true)}catch(e){showError(e.message)}finally{btn.disabled=false}}
async function loadChat(id){if(st.drawerAgentId!==id)return;try{const chat=await api('mode=chat&id='+encodeURIComponent(id)+'&_='+Date.now());const log=$('#chatlog');if(log){log.innerHTML=chatHtml(chat);log.scrollTop=log.scrollHeight}}catch(e){const log=$('#chatlog');if(log)log.innerHTML=`<div class="empty badtext">${esc(e.message)}</div>`}}
async function openAgent(id,silent=false){st.drawerAgentId=id;$('#drawerbg').classList.add('open');$('#drawer').classList.add('open');if(!silent)$('#drawerbody').innerHTML='<div class="empty">Loading…</div>';try{const [d,chat]=await Promise.all([api('mode=agent&id='+encodeURIComponent(id)+'&_='+Date.now()),api('mode=chat&id='+encodeURIComponent(id)+'&_='+Date.now())]);const a=d.status||{},next=d.next_intents?.[0],exec=d.intent_executions?.[0];let html=`<div class="identity">${avatar(a,'lg')}<div class="identity-copy"><h2 style="margin:0">${esc(displayName(a))}</h2><div class="sub">${esc(nice(a.internal_label||'agent'))} · ${status(a)[0]}</div><div class="stage">${esc(stageName(a.lifecycle_stage))}</div><div class="profile-state">Pseudo profile: ${a.pseudo_profile_ready?'ready':'embodiment image pending'}</div></div></div><div class="actionrow">${controlsHtml(a,'drawer')}<span class="sub">Manual controls are audited.</span></div>`;
html+=`<div class="kv" style="margin-top:15px"><div><div class="k">Intent executions</div><div class="v">${fmt(intentCount(a))}</div></div><div><div class="k">Energy</div><div class="v">${pct(a.energy)}</div></div><div><div class="k">Stress</div><div class="v">${pct(a.stress)}</div></div><div><div class="k">Sleep state</div><div class="v">${a.sleeping?'SLEEPING':a.awake?'AWAKE':'INACTIVE'}</div></div><div><div class="k">Existence</div><div class="v">${esc(a.existence_account_state||'—')}</div></div><div><div class="k">Compute</div><div class="v">${fmt(a.resources?.compute?.balance)}</div></div></div>`;
html+=`<h3>Admin chat</h3><div class="notice">Messages are human stimuli, not authority overrides and not expertise evidence. A paused agent keeps messages queued until unpaused.</div><div class="chat"><div class="chatlog" id="chatlog">${chatHtml(chat)}</div><div class="composer"><textarea id="chatInput" maxlength="12000" placeholder="Message ${esc(displayName(a))}…"></textarea><button class="sendbtn" id="sendChatBtn">Send</button></div></div>`;
html+=`<h3>Lifecycle</h3><div class="chips"><span class="chip">Identity ${esc(a.identity_status||'—')}</span><span class="chip">Embodiment ${esc(a.embodiment_status||'—')}</span><span class="chip">Expertise ${esc(a.expertise_status||'—')}</span></div>`;
html+=`<h3>Next Intent</h3><div class="event"><b>${esc(next?.intent_reason||'No active Next Intent')}</b><div>${next?`${esc(next.intent_kind)} · ${when(next.execute_at)} · priority ${fmt((next.priority||0)*100)}%`:''}</div></div>`;
if(exec)html+=`<h3>Latest intent execution</h3><div class="event"><b>${esc(exec.status||'—')}</b><div>${esc(exec.intent_execution_id||'')}<br>${when(exec.execute_at)}${exec.last_error?'<br>'+esc(exec.last_error):''}</div></div>`;
html+='<h3>Timeline</h3><div class="timeline">';for(const ev of d.timeline||[])html+=`<div class="event"><b>${esc(ev.title||ev.event_kind)}</b><div>${esc(ev.detail||'')}</div><div>${when(ev.occurred_at)}</div></div>`;html+='</div>';$('#drawerbody').innerHTML=html;bindControlButtons(a,'drawer');$('#sendChatBtn').onclick=()=>sendChat(id);$('#chatInput').onkeydown=e=>{if((e.ctrlKey||e.metaKey)&&e.key==='Enter')sendChat(id)};const log=$('#chatlog');if(log)log.scrollTop=log.scrollHeight}catch(e){if(!silent)$('#drawerbody').textContent=e.message}}
function closeDrawer(){st.drawerAgentId=null;$('#drawerbg').classList.remove('open');$('#drawer').classList.remove('open')}
async function login(){st.pw=$('#pw').value;$('#loginMsg').textContent='Checking…';try{await api('mode=system');sessionStorage.setItem('aau_control_room_password',st.pw);$('#login').style.display='none';$('#loginMsg').textContent='';await refresh();st.timer=setInterval(()=>{if(!document.hidden){refresh(true);if(st.drawerAgentId)loadChat(st.drawerAgentId)}},10000)}catch(e){st.pw=null;$('#loginMsg').textContent=e.message}}
$('#loginBtn').onclick=login;$('#pw').onkeydown=e=>{if(e.key==='Enter')login()};$('#refresh').onclick=()=>refresh();$('#filter').onchange=e=>{st.filter=e.target.value;renderGrid()};$('#search').oninput=e=>{st.q=e.target.value;renderGrid()};$('#close').onclick=$('#drawerbg').onclick=closeDrawer;
const saved=sessionStorage.getItem('aau_control_room_password');if(saved){st.pw=saved;api('mode=system').then(()=>{$('#login').style.display='none';refresh();st.timer=setInterval(()=>{if(!document.hidden){refresh(true);if(st.drawerAgentId)loadChat(st.drawerAgentId)}},10000)}).catch(()=>sessionStorage.removeItem('aau_control_room_password'))}
</script>
